<!doctype html>
<html lang="zh-CN" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P04 船舶动态 · SSPS 原型</title>
<link rel="stylesheet" href="assets/app.css">
<style>
/* 船舶动态协作台 · 重构原型（方案见 docs/handoff/vessel-dynamics-rebuild-plan.md）
   只用 app.css 的 token；密度是独立于皮肤的维度 data-density，几何规则不进 skin.css。 */
html[data-density="cozy"]   { --rh:44px; --cp:7px 10px; --fs:12.5px; --sub:11px }
html[data-density="compact"]{ --rh:32px; --cp:2px 8px;  --fs:12px;   --sub:10px }

.page.bd{display:flex;flex-direction:column;gap:8px;padding:12px 16px;max-width:none;height:calc(100vh - var(--shell-gutter)*2 - 52px);min-height:600px}
.bd-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}
.bd-bar h1{margin:0 6px 0 0;font-size:18px;font-weight:600;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.bd-bar .sp{flex:1}
.bd-bar .btn{padding:4px 11px;font-size:12px}
.bd-bar select.inp{width:auto;height:28px;padding:2px 10px;font-size:12px}
.bd-bar .lab{font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;white-space:nowrap}
.bd-bar .upd{font-size:11px;color:var(--muted);white-space:nowrap}
.bd-views{flex:none;border-bottom:1px solid var(--line)}
.bd-views button{padding:6px 12px;font-size:12.5px}
.bd-views button small{background:var(--surface-3);border-radius:9px;padding:0 6px;color:var(--muted);font-size:10.5px}
.bd-views button.on small{background:var(--ink);color:var(--on-ink)}
.bd-views button.mine::before{content:"★ ";color:var(--caution)}
.bd-flt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none;font-size:12px}
.bd-flt .inp{width:auto;height:28px;padding:2px 10px;font-size:12px}
.bd-flt .cnt{color:var(--muted);margin-left:auto;white-space:nowrap}
.bd-flt .quick{background:var(--ink);color:var(--on-ink);border-radius:12px;padding:1px 10px;cursor:pointer}

.bd-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:8px}
.bd-body.norail{grid-template-columns:minmax(0,1fr)}
.bd-body.norail .bd-rail{display:none}
.bd-main{min-width:0;min-height:0;display:flex;flex-direction:column}
.bd-scroll{flex:1;overflow:auto;min-height:0}

/* 高密度主表 */
.bd-t{border-collapse:separate;border-spacing:0;font-size:var(--fs);width:max-content;min-width:100%}
.bd-t th,.bd-t td{border-bottom:1px solid var(--line-2);padding:var(--cp);height:var(--rh);vertical-align:middle;white-space:nowrap;text-align:left;background:var(--card)}
.bd-t th{position:sticky;top:0;z-index:3;background:var(--surface-2);color:var(--muted);font-weight:500;font-size:10.5px;letter-spacing:.06em;height:28px}
.bd-t th.can{color:var(--ink)}
.bd-t th.can::after{content:"✎";margin-left:4px;font-size:10px;color:var(--caution)}
.bd-t .fz{position:sticky;z-index:2}
.bd-t th.fz{z-index:4}
.bd-t .f0{left:0;width:26px;min-width:26px;padding:0;text-align:center}
.bd-t .f1{left:26px;width:118px;min-width:118px}
.bd-t .f2{left:144px;width:158px;min-width:158px;border-right:1px solid var(--line)}
.bd-t .fr{position:sticky;right:0;z-index:2;border-left:1px solid var(--line);text-align:right}
.bd-t th.fr{z-index:4}
.bd-t tbody tr:hover>td{background:var(--surface-2)}
.bd-t tr.open>td{background:var(--surface-2)}
.bd-t tr.hit>td{box-shadow:inset 0 2px 0 var(--ink),inset 0 -2px 0 var(--ink)}
.bd-t tr.alertrow>td.f0{box-shadow:inset 3px 0 0 var(--warn)}
.bd-t tr.myrow>td.f0{box-shadow:inset 3px 0 0 var(--caution)}
.bd-t td.r{text-align:right}
.bd-t td b{font-weight:600;color:var(--ink)}
.bd-t td i{display:block;font-style:normal;font-size:var(--sub);line-height:1.15;color:var(--muted)}
.bd-t td .l1{display:block;line-height:1.2}
.bd-t td.na{color:var(--line-strong);text-align:center}
.bd-t td.ed{cursor:text}
.bd-t td.ed:hover{box-shadow:inset 0 0 0 1px var(--line-strong)}
.bd-t td.need{background:var(--caution-bg) !important}
.bd-t td.need .ph{color:var(--caution);font-weight:500}
.bd-t td.dirty{box-shadow:inset 3px 0 0 var(--ink)}
.bd-t td.editing{padding:1px 3px;box-shadow:inset 0 0 0 2px var(--ink)}
.bd-t td.editing input,.bd-t td.editing select{height:calc(var(--rh) - 6px);min-height:24px;border:0;background:transparent;font-size:12px;padding:0 4px;outline:none;max-width:190px}
.bd-t td.editing input[type=date]{max-width:118px}
.xp{border:0;background:none;color:var(--muted);font-size:11px;width:26px;height:100%;padding:0}
.xp:hover{color:var(--ink)}
.tdc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:11px;line-height:18px;color:var(--muted);margin-right:4px;background:var(--surface)}
.tdc.me{border-color:var(--caution-line);background:var(--caution-bg);color:var(--caution);font-weight:600;cursor:pointer}
.stale{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:1px}
.star{color:var(--caution)}.star.off{color:var(--line-strong)}
.pg{display:inline-block;width:64px;height:5px;border-radius:3px;background:var(--surface-3);vertical-align:middle;margin-right:6px;overflow:hidden}
.pg>span{display:block;height:100%;background:var(--ink)}
.rowbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;font-size:11px;line-height:20px;padding:0 8px;color:var(--text)}
.rowbtn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:600}
.rowbtn:hover{border-color:var(--ink)}
.crow td{background:var(--surface-2) !important;height:auto;padding:8px 10px}
.crow .f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crow .inp{width:auto;height:28px;font-size:12px;padding:2px 8px}

/* 行内展开 */
.xrow>td{padding:0 !important;height:auto;background:var(--bg) !important;white-space:normal;border-bottom:1px solid var(--line)}
.xin{position:sticky;left:0;width:var(--bdw,100%);align-items:start;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) 300px;gap:10px;padding:10px 12px 12px 26px}
.xin>.xt{grid-column:1/3}
.xin>.xm{grid-column:3;grid-row:1/3;min-width:0}
.xb{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:9px 11px;min-width:0;overflow-x:auto}
.xb h4{margin:0 0 7px;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.xb.me{border-color:var(--caution-line);background:var(--caution-bg)}
.xb.me h4{color:var(--caution)}
.tl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}
.tl div{border-top:2px solid var(--line-strong);padding:6px 6px 0 0;font-size:11px;min-width:0}
.tl div.done{border-top-color:var(--ink)}
.tl div.late b{color:var(--warn)}
.tl small{display:block;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl b{display:block;font-weight:600;color:var(--ink);white-space:nowrap}
.tl span{display:block;color:var(--muted);white-space:nowrap}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv2 span{color:var(--muted);white-space:nowrap}
.kv2 b{font-weight:500;color:var(--ink)}
.mini{width:100%;border-collapse:collapse;font-size:11.5px}
.mini th,.mini td{padding:3px 6px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap}
.mini th{color:var(--muted);font-weight:500;font-size:10px}
.mini td.r,.mini th.r{text-align:right}
.logf{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center}
.logf .inp{height:26px;font-size:11.5px;padding:1px 6px;width:86px}
.mef{display:grid;gap:7px}
.mef label{display:block;font-size:11px;color:var(--caution);margin-bottom:2px}
.mef .ln{display:flex;gap:5px}
.mef .inp{height:28px;font-size:12px;padding:2px 8px;background:var(--surface)}
.mef .now{border:1px solid var(--caution-line);background:var(--surface);border-radius:4px;font-size:11px;padding:0 8px;white-space:nowrap}
.xf{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:11.5px}
.xf a{color:var(--muted);text-decoration:underline;cursor:pointer}
.pred{border-left:2px solid var(--ink);padding-left:9px}

/* 预警栏、汇总带 */
.bd-rail{display:flex;flex-direction:column;min-height:0}
.bd-rail .rh{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line-2);font-size:12.5px;font-weight:600;color:var(--ink)}
.bd-rail .rb{flex:1;overflow:auto}
.bd-rail .grp{display:flex;align-items:center;gap:6px;padding:8px 12px 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bd-rail .grp b{margin-left:auto;font-size:11px;color:var(--ink);letter-spacing:0}
.al{padding:6px 12px 7px;border-bottom:1px solid var(--line-2);cursor:pointer;border-left:3px solid transparent}
.al:hover{background:var(--surface-2)}
.al.l1{border-left-color:var(--caution)}.al.l2{border-left-color:var(--warn)}.al.l3{border-left-color:var(--line-strong)}
.al b{display:block;font-size:12px;font-weight:600;color:var(--ink)}
.al span{display:block;font-size:11px;color:var(--muted);white-space:normal;line-height:1.45}
.bd-rail .rf{padding:7px 12px;border-top:1px solid var(--line-2);font-size:10px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.bd-sum{flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:hidden}
.bd-sum div{padding:6px 14px;border-right:1px solid var(--line-2);cursor:pointer;min-width:0}
.bd-sum div:last-child{border-right:0;cursor:default}
.bd-sum div:hover{background:var(--surface-2)}
.bd-sum div.on{background:var(--surface-3)}
.bd-sum small{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-sum b{font-size:18px;font-weight:500;letter-spacing:-.03em;color:var(--ink)}
.bd-sum b.w{color:var(--warn)}.bd-sum b.c{color:var(--caution)}

/* 抽屉、列设置、授权表 */
.bd-dr{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:96vw;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-pop);z-index:90;display:none;flex-direction:column}
.bd-dr.on{display:flex}
.bd-dr .dh{padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.bd-dr .dh b{font-size:14px;color:var(--ink)}
.bd-dr .dh button{margin-left:auto;border:0;background:none;font-size:20px;color:var(--muted)}
.bd-dr .db{flex:1;overflow:auto;padding:4px 16px 16px}
.bd-dr h5{margin:14px 0 6px;font-size:10px;font-weight:500;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.bd-dr .df{padding:10px 16px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end}
.colrow input{accent-color:var(--ink)}
.colrow{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}
.colrow .mv{margin-left:auto;display:flex;gap:3px}
.colrow .mv button{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:22px;height:20px;line-height:1;font-size:10px;color:var(--muted)}
.gt{border-collapse:collapse;font-size:11.5px;width:100%}
.gt th,.gt td{border:1px solid var(--line-2);padding:4px 6px;text-align:center;white-space:nowrap}
.gt th{background:var(--surface-2);color:var(--muted);font-weight:500;font-size:10.5px}
.gt td:first-child,.gt th:first-child{text-align:left}
.gt td.g{cursor:pointer}.gt td.g:hover{background:var(--surface-2)}
.gt td.lk{color:var(--line-strong);background:var(--surface-2)}
.gt td.on{color:var(--ink);font-weight:600}
.gt td.chg{box-shadow:inset 0 0 0 2px var(--caution)}
.note{font-size:11.5px;color:var(--muted);line-height:1.6}
.bd-cards{display:none}
@media(max-width:1280px){.xin{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}.xin>.xt,.xin>.xm{grid-column:1/-1;grid-row:auto}.bd-body{grid-template-columns:minmax(0,1fr) 250px}}
@media(max-width:900px){
  .page.bd{height:auto;min-height:0;padding:12px}
  .bd-body{display:block}.bd-rail,.bd-scroll,.bd-bar .lab,.bd-bar .hid{display:none}
  .bd-cards{display:block}
  .bd-sum{grid-template-columns:repeat(3,minmax(0,1fr)) !important}
  .vc{padding:10px 12px;border-bottom:1px solid var(--line-2)}
  .vc .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .vc .r2{color:var(--muted);font-size:12px;margin:2px 0 5px}
  .xin{position:static;width:auto;grid-template-columns:minmax(0,1fr);padding:8px 0 0}.xin>*{grid-column:auto !important;grid-row:auto !important}
}
</style>
<link rel="stylesheet" href="assets/skin.css">
<script data-skin-init>(function(){var s="paper",d="compact";try{var v=localStorage.getItem("ssps-skin");if(v==="legacy"||v==="midnight")s=v;if(localStorage.getItem("ssps-density")==="cozy")d="cozy";}catch(e){}document.documentElement.setAttribute("data-skin",s);document.documentElement.setAttribute("data-density",d);})();</script>
</head>
<body>
<div class="app"><aside id="nav"></aside>
  <div class="main"><header id="topbar"></header>
    <main class="page bd">
      <div class="bd-bar">
        <h1>船舶动态</h1>
        <span class="lab">模拟身份</span><select class="inp" id="viewer"></select>
        <span class="sp"></span>
        <button class="btn primary" id="bNew">＋ 新建</button>
        <button class="btn hid" id="bAdopt" title="演示：从预测页采纳方案后落到协作台">模拟采纳预测</button>
        <button class="btn hid" id="bExp">导出</button>
        <button class="btn" id="bCols">列设置</button>
        <button class="btn hid" id="bGrant">岗位授权</button>
        <div class="ds-seg" id="dens"><button data-d="cozy">舒适</button><button data-d="compact">紧凑</button></div>
        <button class="btn hid" id="bRail">预警栏</button>
        <span class="upd hid" id="upd"></span>
      </div>
      <div class="tabs2 bd-views" id="views"></div>
      <div class="bd-flt">
        <input class="inp" id="kw" placeholder="船名 / 航次号 / 船次号 / 合同号" style="min-width:220px">
        <select class="inp" id="fst"></select>
        <select class="inp" id="fown"></select>
        <button class="chipf" id="fme">只看我负责的</button>
        <button class="chipf" id="fstar">重点关注</button>
        <span id="quick"></span>
        <span class="cnt" id="cnt"></span>
      </div>
      <div class="bd-body" id="body">
        <section class="card bd-main"><div class="bd-scroll" id="scroll"><table class="bd-t" id="tbl"></table></div><div class="bd-cards" id="cards"></div></section>
        <aside class="card bd-rail" id="rail"></aside>
      </div>
      <div class="card bd-sum" id="sum"></div>
    </main>
  </div>
</div>
<div class="bd-dr" id="drawer"></div>
<script src="mock-data.js"></script><script src="engine.js"></script><script src="assets/shell.js"></script><script src="assets/common.js"></script>
<script>
(function () {
  const M = window.MOCK, C = window.C, $ = (id) => document.getElementById(id), esc = C.esc;
  const SS = { get: (k, d) => { try { const r = sessionStorage.getItem(k); return r ? JSON.parse(r) : d; } catch (e) { return d; } }, set: (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } } };
  const LS = { get: (k, d) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } } };

  /* ---------- 身份（岗位 = 角色 + 部门） ---------- */
  const VIEWERS = [['林海川', '大宗采购部', '业务员'], ['周晓棠', '大宗采购部', '部门主管'], ['韩墨', '商务海运部', '业务员'], ['苏望舒', '商务海运部', '部门主管'],
    ['罗景行', '仓储物流部', '业务员'], ['沈予安', '仓储物流部', '部门主管'], ['顾明远', '仓储物流部', '物流管理员'], ['钟立诚', '—', '系统管理员']];
  VIEWERS.forEach((x) => { M.people[x[0]] = { dept: x[1], role: x[2] }; });
  const POSTS = [['p1', '业务员 · 大宗采购部'], ['p2', '业务员 · 商务海运部'], ['p3', '业务员 · 仓储物流部'], ['p4', '部门主管 · 大宗采购部'], ['p5', '部门主管 · 商务海运部'], ['p6', '部门主管 · 仓储物流部'], ['p7', '物流管理员'], ['p8', '系统管理员']];
  const setMe = (name) => { const x = VIEWERS.find((q) => q[0] === name) || VIEWERS[0]; Object.assign(C.me, { name: x[0], dept: x[1], role: x[2] }); SS.set('ssps-board-viewer', x[0]); };
  setMe(SS.get('ssps-board-viewer', C.me.name));
  const role = () => C.me.role, dept = () => C.me.dept;
  const post = () => role() === '系统管理员' ? 'p8' : role() === '物流管理员' ? 'p7' : (role() === '部门主管' ? { 大宗采购部: 'p4', 商务海运部: 'p5', 仓储物流部: 'p6' } : { 大宗采购部: 'p1', 商务海运部: 'p2', 仓储物流部: 'p3' })[dept()];

  /* ---------- 字段组与授权（方案第 5 节）。取值：own 本人航次 / dept 本部门航次 / any 任意航次；「any:大宗」= 仅大宗采购船 ---------- */
  const GROUPS = [['G01', '标识与航线'], ['G02', '货物与合同'], ['G03', '计划时间'], ['G04', '外港侧实际节点'], ['G05', '预计到达修订'], ['G06', '本港侧节点与泊位'], ['G07', '卸船作业'],
    ['G08', '港口费用'], ['G09', '合同结算'], ['G10', '销售扩展'], ['G11', '管理标记'], ['G12', '系统与计算结果'], ['G13', '作业日志']];
  const GNAME = Object.fromEntries(GROUPS);
  const GBIZ = { G07: ['大宗采购船'], G08: ['大宗采购船'], G09: ['大宗采购船'], G10: ['成品销售船'] };
  const base = { p1: 'own', p2: 'own', p3: 'own', p4: 'dept', p5: 'dept', p6: 'dept', p8: 'any' };
  const GRANT0 = { G01: base, G02: base, G03: base, G04: base, G05: base, G11: base,
    G06: Object.assign({}, base, { p3: 'own|any:大宗', p6: 'dept|any:大宗' }),
    G07: { p1: 'own', p4: 'dept', p3: 'any', p6: 'any', p8: 'any' },
    G08: { p3: 'any', p6: 'any', p8: 'any' },
    G09: { p1: 'own', p4: 'dept', p8: 'any' },
    G10: { p2: 'own', p5: 'dept', p8: 'any' },
    G12: {}, G13: { p3: 'any', p6: 'any', p8: 'any' } };
  let GRANT = SS.get('ssps-board-grant', null) || JSON.parse(JSON.stringify(GRANT0));
  const READ = { G08: ['p1', 'p3', 'p4', 'p6', 'p8'], G09: ['p1', 'p4', 'p8'] };            // 金额：不在名单里的岗位，接口不返回
  const GLOCK = (g, p) => g === 'G12' || p === 'p8' || (READ[g] && !READ[g].includes(p));   // 勾选表里不可改的格子
  const canRead = (g) => !READ[g] || READ[g].includes(post());
  const arrived = (v) => !!v.actDischArr;
  function canWG(v, g) {
    if (v.readonly || g === 'G12') return false;
    if (GBIZ[g] && !GBIZ[g].includes(v.biz)) return false;
    if ((g === 'G07' || g === 'G08' || g === 'G09') && !arrived(v)) return false;          // 船抵卸港后才开始登记

  function commit(el) {

    const byG = {}; Object.values(F).forEach((f) => { if (['todo', 'prog', 'updated'].includes(f.k) || (f.na && f.na(v))) return; const g = grp(f, v); (byG[g] = byG[g] || []).push(f); });
    const logs = M.changeLog.filter((l) => l.voyage === id), etas = M.etaRevisions.filter((l) => l.voyage === id);
    $('drawer').innerHTML = '<div class="dh"><b>' + esc(vname(v)) + '</b><span class="muted">' + v.id + '</span>' + C.stTag(C.statusOf(v)) + '<button data-close>×</button></div><div class="db">' +
      GROUPS.filter(([g]) => byG[g]).map(([g, name]) => '<h5>' + name + (!canRead(g) ? '' : canWG(v, g) ? '<span class="tag amber">你可改</span>' : '<span class="tag gray">只读</span>') + '</h5>' +
        (canRead(g) ? '<div class="kvg" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px">' + byG[g].map((f) => '<div><div class="k">' + f.label + '</div><div class="v">' + (show(v, f.k) || '—') + '</div></div>').join('') + '</div>' : '<div class="note">当前岗位无权查看这一组（接口不返回）。</div>')).join('') +
      '<h5>预计到达修订记录</h5>' + (etas.length ? '<table class="mini"><tbody>' + etas.map((l) => '<tr><td>' + C.mdh(l.at) + '</td><td>' + C.mdh(l.old) + ' → ' + C.mdh(l.nw) + '</td><td>' + esc(l.basis) + '</td><td>' + esc(l.by) + '</td></tr>').join('') + '</tbody></table>' : '<div class="note">没有修订记录</div>') +
      '<h5>修改记录</h5>' + (logs.length ? '<table class="mini"><tbody>' + logs.slice(0, 20).map((l) => '<tr><td>' + C.mdh(l.at) + '</td><td>' + esc(l.field) + '</td><td style="white-space:normal">' + esc(l.old || '（空）') + ' → ' + esc(l.nw || '（空）') + '</td><td>' + esc(l.by) + '</td></tr>').join('') + '</tbody></table>' : '<div class="note">没有修改记录</div>') +
      '</div><div class="df"><span class="note" style="margin-right:auto">货物明细增删、异常标记仍在详情页操作</span><a class="btn" href="P05-voyage-detail.html?id=' + id + '">在详情页打开</a></div>';
    $('drawer').classList.add('on');
  }

  /* ---------- 列设置：在自己可读的字段里挑选、排序，另存为我的视图 ---------- */
  function colSettings() {
    const vw = view(); let cur = cols();
    const render = () => {
      const rest = Object.keys(F).filter((k) => colReadable(k) && !cur.includes(k)), hidden = Object.keys(F).filter((k) => !colReadable(k)).length;
      $('drawer').innerHTML = '<div class="dh"><b>列设置</b><span class="muted">视图：' + esc(vw.name) + '</span><button data-close>×</button></div><div class="db"><h5>显示中 · ' + cur.length + ' 列（可上下调整顺序）</h5>' +
        cur.map((k, i) => '<div class="colrow"><input type="checkbox" checked data-ck="' + k + '"' + (i < 2 ? ' disabled' : '') + '>' + F[k].label + ' <span class="muted" style="font-size:11px">' + (F[k].g === 'node' ? '实际节点' : GNAME[F[k].g]) + '</span>' + (i < 2 ? '<span class="tag gray" style="margin-left:auto">冻结</span>' : '<span class="mv"><button data-up="' + k + '">▲</button><button data-dn="' + k + '">▼</button></span>') + '</div>').join('') +
        '<h5>未显示 · ' + rest.length + ' 列</h5>' + rest.map((k) => '<div class="colrow"><input type="checkbox" data-ck="' + k + '">' + F[k].label + ' <span class="muted" style="font-size:11px">' + (F[k].g === 'node' ? '实际节点' : GNAME[F[k].g]) + '</span></div>').join('') +
        '<div class="note" style="margin-top:12px">只能在你有权查看的字段里挑选。' + (hidden ? '有 ' + hidden + ' 个金额字段当前岗位不可见，这里不会列出（正式实现中接口不返回）。' : '') + '导出同样按权限裁剪。</div></div>' +
        '<div class="df"><button class="btn" id="cReset">恢复默认</button><button class="btn" id="cSave">另存为我的视图</button><button class="btn primary" id="cOk">应用</button></div>';
      const d = $('drawer');
      d.querySelectorAll('[data-ck]').forEach((c) => c.onchange = () => { const k = c.dataset.ck; if (c.checked) cur.push(k); else cur = cur.filter((x) => x !== k); render(); });
      d.querySelectorAll('[data-up],[data-dn]').forEach((b) => b.onclick = () => { const k = b.dataset.up || b.dataset.dn, i = cur.indexOf(k), j = b.dataset.up ? i - 1 : i + 1; if (j < 2 || j >= cur.length) return; cur.splice(i, 1); cur.splice(j, 0, k); render(); });
      $('cOk').onclick = () => { S.cols[vw.id] = cur; d.classList.remove('on'); draw(); };
      $('cReset').onclick = () => { delete S.cols[vw.id]; d.classList.remove('on'); draw(); C.toast('已恢复「' + vw.name + '」的默认列'); };
      $('cSave').onclick = () => C.modal({ title: '另存为我的视图', ok: '保存', width: 400, body: '<div class="field"><label>视图名称</label><input class="inp" id="vn" value="' + esc(vw.name.replace(/^我的 · /, '')) + '（我的）"></div><div class="note">保存当前的列和顺序。原型存在本机浏览器；正式实现存服务端，换设备也在。</div>',
        onOk: (m) => { const name = m.querySelector('#vn').value.trim(); if (!name) return false; const id = 'my' + Date.now(); MYV.push({ id, name, base: vw.base || vw.id, cols: cur }); LS.set('ssps-board-myviews', MYV); S.view = id; d.classList.remove('on'); draw(); C.toast('已保存视图「' + name + '」'); } });
    };
    render(); $('drawer').classList.add('on');
  }

  /* ---------- 岗位授权表：13 个字段组 × 8 个岗位，系统管理员可调 ---------- */
  function grantModal() {
    const admin = post() === 'p8', TXT = { '': '—', own: '本人航次', dept: '本部门', any: '任意航次' }, CYC = ['', 'own', 'dept', 'any'];
    const txt = (c) => !c ? '—' : c.split('|').map((x) => { const [s, l] = x.split(':'); return TXT[s] + (l ? '（仅' + l + '）' : ''); }).join(' + ');
    const m = C.modal({ title: '岗位字段组授权（谁能改哪一组）', ok: false, hideCancel: true, width: 1120, body: '<div id="gtw" style="overflow:auto;max-height:62vh"></div><div class="note" style="margin-top:10px">' + (admin ? '点格子切换：— → 本人航次 → 本部门 → 任意航次。改动立即生效并留痕。' : '只有系统管理员能调整；你现在是「' + POSTS.find((p) => p[0] === post())[1] + '」，仅可查看。') + ' 灰色格子是不能通过配置突破的底线：系统与计算结果任何人不可改；合同结算只能授予大宗采购部；港口费用只能授予仓储物流部和大宗采购部。标 ● 的是与默认值不同的格子。</div>' });
    const render = () => {
      m.querySelector('#gtw').innerHTML = '<table class="gt"><thead><tr><th>字段组</th>' + POSTS.map((p) => '<th>' + p[1].replace(' · ', '<br>') + '</th>').join('') + '</tr></thead><tbody>' +
        GROUPS.map(([g, name]) => '<tr><td><b>' + name + '</b>' + (GBIZ[g] ? ' <span class="muted">· 仅' + GBIZ[g][0].slice(0, 2) + '船</span>' : '') + '</td>' + POSTS.map(([p]) => { const c = (GRANT[g] || {})[p] || '', lk = GLOCK(g, p), chg = c !== ((GRANT0[g] || {})[p] || ''); return '<td class="' + (lk ? 'lk' : 'g') + (c ? ' on' : '') + (chg ? ' chg' : '') + '"' + (lk || !admin ? '' : ' data-g="' + g + '|' + p + '"') + '>' + (chg ? '● ' : '') + txt(c) + '</td>'; }).join('') + '</tr>').join('') + '</tbody></table>';
      m.querySelectorAll('[data-g]').forEach((td) => td.onclick = () => { const [g, p] = td.dataset.g.split('|'), cur = ((GRANT[g] || {})[p] || '').split('|')[0].split(':')[0], nx = CYC[(CYC.indexOf(cur) + 1) % 4]; GRANT[g] = GRANT[g] || {}; if (nx) GRANT[g][p] = nx; else delete GRANT[g][p]; SS.set('ssps-board-grant', GRANT); render(); draw(); });
    };
    render();
  }

  /* ---------- 定位到行（预警、待办、采纳后都走这里） ---------- */
  function locate(id) {
    S.quick = ''; if (!rows().some((v) => v.id === id)) { S.view = 'all'; Object.assign(S, { kw: '', st: '', own: '', me: false, star: false }); $('kw').value = ''; $('fst').value = ''; $('fown').value = ''; }
    S.open.add(id); S.hit = id; draw();
    const tr = $('tbl').querySelector('tr[data-r="' + id + '"]') || $('cards').querySelector('[data-r="' + id + '"]'); if (tr) tr.scrollIntoView({ block: 'center' });
    setTimeout(() => { if (S.hit === id) { S.hit = null; const t = $('tbl').querySelector('tr.hit'); if (t) t.classList.remove('hit'); } }, 2600);
  }
  function newVoyage(o) {
    const id = 'VY-2026-' + String(450 + M.voyageList.length - 39).padStart(4, '0'), biz = o.biz;
    M.voyageList.push(Object.assign({ id, biz, attr: biz === '成品销售船' ? '外贸' : '内贸', no: '', vessel: null, carrier: '', shipVoy: '', disch2: null, finalPort: null, laycanS: null, laycanE: null, planLoadArr: null, actLoadArr: null, loadBerth: null, planLoadDep: null, actLoadDep: null, planDischS: null, planDischE: null, eta: null, actDischArr: null, dischBerth: null, dischDep: null,
      flags: [], planBerths: [], actBerths: [], owner: C.me.name, dept: dept(), focus: false, review: '待审核', source: '应用录入', origKey: '', readonly: false, remark: '', mmsi: '' }, o));
    M.cargoLines.push({ voyage: id, no: 'CL-' + String(M.cargoLines.length + 1).padStart(4, '0'), contract: '', ea: '', big: biz === '成品销售船' ? '成品' : '原料', kind: '', name: o.cargoName || '', alias: '', unit: '', dept2: '', party: '', tons: o.tons, loadTons: null, dry: null, over: '', exec: C.me.name });
    M.changeLog.unshift({ voyage: id, field: o.pred ? '采纳预测方案新建航次' : '新建航次', old: '', nw: id, by: C.me.name, at: M.now });
    C.persist(); return id;
  }

  /* ---------- 事件 ---------- */
  const mount = () => SHELL.mount({ active: 'P04', title: '船舶动态', user: [C.me.name, C.me.dept, C.me.role] });
  function boot() { mount(); S.view = defaultView(); S.quick = ''; S.open.clear(); S.edit = null;
    $('fown').innerHTML = '<option value="">全部业务员</option>' + [...new Set(M.voyageList.map((v) => v.owner))].map((o) => '<option>' + o + '</option>').join('');
    $('dens').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.d === document.documentElement.getAttribute('data-density')));
    $('upd').textContent = '数据更新于 ' + M.now.slice(11); draw(); }
  $('viewer').innerHTML = VIEWERS.map((x) => '<option value="' + x[0] + '"' + (x[0] === C.me.name ? ' selected' : '') + '>' + x[2] + (x[1] === '—' ? '' : ' · ' + x[1]) + '（' + x[0] + '）</option>').join('');
  $('viewer').onchange = (e) => { if (Object.keys(DIRTY).length) Object.keys(DIRTY).forEach((k) => delete DIRTY[k]); setMe(e.target.value); boot(); C.toast('已切换为 ' + C.me.role + (C.me.dept === '—' ? '' : ' · ' + C.me.dept) + '：视图、可改的列和金额列随岗位变化'); };
  $('fst').innerHTML = '<option value="">全部状态</option>' + C.STATUS.concat(['已结束（取消）']).map((s) => '<option>' + s + '</option>').join('');
  $('fst').onchange = (e) => { S.st = e.target.value; draw(); }; $('fown').onchange = (e) => { S.own = e.target.value; draw(); };
  $('kw').oninput = (e) => { S.kw = e.target.value.trim(); draw(); $('kw').focus(); };
  $('fme').onclick = () => { S.me = !S.me; draw(); }; $('fstar').onclick = () => { S.star = !S.star; draw(); };
  $('bRail').onclick = () => { S.rail = !S.rail; draw(); };
  $('bCols').onclick = colSettings; $('bGrant').onclick = grantModal;
  $('bNew').onclick = () => { S.creating = !S.creating; draw(); $('scroll').scrollTop = 0; };
  $('dens').onclick = (e) => { const b = e.target.closest('[data-d]'); if (!b) return; document.documentElement.setAttribute('data-density', b.dataset.d); LS.set('ssps-density', b.dataset.d); try { localStorage.setItem('ssps-density', b.dataset.d); } catch (er) { /* ignore */ } $('dens').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); };
  $('bAdopt').onclick = () => {
    if (!['业务员', '部门主管'].includes(role())) { C.toast('采纳预测方案只有业务员和部门主管可以操作'); return; }
    const id = newVoyage({ biz: '大宗采购船', load: 'SURIGAO', disch: 'BAHODOPI', tons: 50000, cargoName: '红土镍矿', planDischS: day(18) + ' 00:00', planDischE: day(20) + ' 23:59',
      pred: { run: 'PR-20261104-0003', plan: '备选方案', path: '15 天后 · 按航次表', metric: '同期最多 4 艘（能装下的泊位 11 个）', basis: '业务员估算', trust: '低可信' } });
    locate(id); C.toast('已采纳备选方案：新建待宣船航次 ' + id + '，计划到达窗口已写入，已定位到这一行');
  };
  $('bExp').onclick = () => { const cs = cols().filter((k) => !['todo', 'prog', 'updated'].includes(k)), strip = (s) => String(s || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    C.download('船舶动态_' + view().name + '_' + M.today.replace(/-/g, '') + '.csv', [cs.map((k) => F[k].label)].concat(rows().map((v) => cs.map((k) => strip(show(v, k))))).map((r) => r.map((x) => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\n'));
    C.toast('已导出当前视图 ' + rows().length + ' 条、' + cs.length + ' 列（按权限裁剪，不含无权查看的金额列）'); };

  document.addEventListener('mousedown', (e) => {                       // 点格子进入编辑；先把正在编辑的格子收进暂存
    const td = e.target.closest('td[data-c]'); const cur = $('tbl').querySelector('td.editing');
    if (cur && cur.contains(e.target)) return;
    if (cur) cur.querySelectorAll('[data-ed]').forEach(commit);
    if (!td || e.target.closest('button,.tdc')) { if (cur) { S.edit = null; draw(); } return; }
    const [id, k] = td.dataset.c.split('|');
    if (F[k].type === 'bool') { const v = M.voyageList.find((q) => q.id === id), d = (DIRTY[id] = DIRTY[id] || {}); const nv = !val(v, k); if (nv === !!v[k]) delete d[k]; else d[k] = nv; if (!Object.keys(d).length) delete DIRTY[id]; S.edit = null; draw(); e.preventDefault(); return; }
    S.edit = { id, k }; e.preventDefault(); draw();
  });
  document.addEventListener('keydown', (e) => {
    const cur = $('tbl').querySelector('td.editing'); if (!cur || !cur.contains(e.target)) return;
    if (e.key === 'Enter' || e.key === 'Escape') { if (e.key === 'Enter') cur.querySelectorAll('[data-ed]').forEach(commit); S.edit = null; draw(); }
    if (e.key === 'Tab') { const ins = [...cur.querySelectorAll('[data-ed]')]; if (ins.indexOf(e.target) < ins.length - 1 && !e.shiftKey) return; e.preventDefault(); ins.forEach(commit); const cells = [...cur.parentNode.querySelectorAll('td[data-c]')].filter((c) => F[c.dataset.c.split('|')[1]].type !== 'bool'), nx = cells[cells.indexOf(cur) + (e.shiftKey ? -1 : 1)]; if (nx) { const [id, k] = nx.dataset.c.split('|'); S.edit = { id, k }; } else S.edit = null; draw(); }
  });
  document.addEventListener('change', (e) => { const el = e.target.closest('[data-ed]'); if (!el || el.closest('td.editing')) return; commit(el); const id = el.dataset.ed.split('|')[0], n = dcount(id);       // 展开区里的输入：只更新按钮，不重画
    document.querySelectorAll('.xin [data-save="' + id + '"]').forEach((b) => b.textContent = '保存本行' + (n ? '（' + n + '）' : '')); const tr = $('tbl').querySelector('tr[data-r="' + id + '"] td.fr'); if (tr) tr.innerHTML = n ? '<button class="rowbtn pri" data-save="' + id + '">保存 ' + n + '</button> <button class="rowbtn" data-undo="' + id + '">撤销</button>' : '<button class="rowbtn" data-drawer="' + id + '">详情</button>'; });
  document.addEventListener('click', (e) => {
    const t = e.target, q = (s) => t.closest(s);
    if (q('[data-close]')) { $('drawer').classList.remove('on'); return; }
    if (q('#views [data-v]')) { S.view = q('[data-v]').dataset.v; S.quick = ''; S.edit = null; draw(); $('scroll').scrollTop = 0; return; }
    if (q('#qx')) { S.quick = ''; draw(); return; }
    if (q('#sum [data-q]')) { const k = q('[data-q]').dataset.q; S.quick = S.quick === k ? '' : k; draw(); return; }
    if (q('[data-save]')) { saveRow(q('[data-save]').dataset.save); return; }
    if (q('[data-undo]')) { delete DIRTY[q('[data-undo]').dataset.undo]; S.edit = null; draw(); return; }
    if (q('[data-drawer]')) { drawer(q('[data-drawer]').dataset.drawer); return; }
    if (q('[data-now]')) { const [id, k] = q('[data-now]').dataset.now.split('|'), inp = q('.ln').querySelector('[data-ed]'); inp.value = toLocal(M.now); commit(inp); inp.dispatchEvent(new Event('change', { bubbles: true })); return; }
    if (q('[data-addlog]')) { const id = q('[data-addlog]').dataset.addlog, v = M.voyageList.find((x) => x.id === id), ins = q('.logf').querySelectorAll('input,select'), isLoad = prod(v);
      const date = ins[0].value, shift = isLoad ? '' : ins[1].value, pcs = +ins[isLoad ? 1 : 2].value, tons = +ins[isLoad ? 2 : 3].value;
      if (!date || !(tons > 0)) { C.toast('请填日期和本日重量'); return; }
      LOGS.push({ voyage: id, date, item: isLoad ? (cg0(v).name || '') : (cg0(v).contract || ''), shift, pcs: pcs || 0, tons }); SS.set('ssps-board-logs', LOGS);
      M.changeLog.unshift({ voyage: id, field: isLoad ? '装船记录' : '卸船记录', old: '', nw: C.md(date) + (shift ? ' ' + shift + '班' : '') + ' ' + C.fmt(tons) + ' 吨', by: C.me.name, at: M.now }); C.persist();
      draw(); C.toast('已追加' + (isLoad ? '装船' : '卸船') + '记录；累计 ' + C.fmt(logSum(v)) + ' 吨，' + (isLoad ? '待装 ' : '待卸 ') + C.fmt(Math.max(0, C.total(v) - logSum(v))) + ' 吨'); return; }
    if (q('[data-go]')) { locate(q('[data-go]').dataset.go); return; }
    if (q('[data-x]')) { const id = q('[data-x]').dataset.x; if (S.open.has(id)) S.open.delete(id); else S.open.add(id); draw(); return; }
    if (q('#nNo')) { S.creating = false; draw(); return; }
    if (q('#nOk')) { const biz = $('nb').value, load = $('nl').value, disch = $('nd').value, tons = +$('nt').value;
      if (!['业务员', '部门主管', '系统管理员'].includes(role())) { C.toast('物流管理员不能新建航次'); return; }
      if (load === disch) { C.toast('装港和卸港不能相同'); return; } if (!(tons > 0)) { C.toast('请填写预计货量'); return; }
      S.creating = false; const id = newVoyage({ biz, load, disch, tons }); locate(id); C.toast('已新建 ' + id + '（待宣船）；其余字段在这一行里继续补'); return; }
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'nb') { const p = e.target.value === '成品销售船'; $('nl').value = p ? 'BAHODOPI' : 'SURIGAO'; $('nd').value = p ? 'HAIPHONG' : 'BAHODOPI'; } });
  window.addEventListener('resize', () => $('scroll').style.setProperty('--bdw', $('scroll').clientWidth + 'px'));
  boot();
  if (C.qs.get('go')) locate(C.qs.get('go'));
})();
</script>
</body>
