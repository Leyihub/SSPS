<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智能发船预测 · SSPS</title>
<style>
:root{
  --nav-1:#26394f;--nav-2:#203348;--primary:#1677ff;--primary-bg:#e6f4ff;
  --bg:#f1f4f8;--card:#fff;--line:#e4e8ee;--text:#1f2d3d;--muted:#6b7a8c;--faint:#98a4b3;
  --radius:12px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.05);
  /* CMR 色阶（沿用德龙版）：≥50% 充裕 / 30–50% 适中 / 10–30% 偏紧 / <10% 紧张 */
  --c1-bg:#d9f7be;--c1-fg:#135200;--c1-bd:#95de64;
  --c2-bg:#fff1b8;--c2-fg:#614700;--c2-bd:#ffd666;
  --c3-bg:#ffd8bf;--c3-fg:#873800;--c3-bd:#ffa940;
  --c4-bg:#ffccc7;--c4-fg:#a8071a;--c4-bd:#ff7875;
  --stripe:repeating-linear-gradient(135deg,#f6f7f9 0,#f6f7f9 5px,#cdd2d9 5px,#cdd2d9 6px); /* 无数据：灰色斜线 */
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 "PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(90deg,var(--nav-1),var(--nav-2));color:#fff;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.3px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--primary);display:grid;place-items:center;font-weight:700}
.top a{color:#b9c8da;font-size:12px;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero h1{font-size:20px;margin:6px 0 2px}
.hero p{margin:0 0 12px;color:var(--muted)}
.ask{padding:12px;border:1.5px solid #b7d8ff;box-shadow:0 2px 10px rgba(22,119,255,.10)}
.ask textarea{width:100%;border:0;outline:0;resize:none;min-height:64px;font-size:15px;line-height:1.6;background:transparent}
.ask-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.ask-bar small{color:var(--faint)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 16px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;padding:8px 22px}
.btn.primary:active{background:#0958d9}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 12px;font-size:13px;color:#3b4a5c;cursor:pointer}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.ex{margin-top:12px}
@media(max-width:600px){.ex .chip:nth-child(n+4){display:none}}
.understood{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 4px;font-size:13px}
.understood .k{color:var(--muted);margin-right:2px}
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:0 9px;line-height:24px;background:var(--primary-bg);color:#0958d9;border:1px solid #91caff;font-size:13px;white-space:nowrap}
.tag.miss{background:#fff;border-style:dashed;color:var(--muted);border-color:#c4cad3}
.grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:12px}
@media(min-width:980px){.grid{grid-template-columns:380px minmax(0,1fr);align-items:start}}
/* 方案 */
.plan{padding:16px}
.plan h2{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.badge{border-radius:4px;color:#fff;padding:0 7px;font-size:12px;line-height:20px;background:var(--primary)}
.badge.b{background:#08979c}
.big{font-size:26px;font-weight:700;line-height:1.25;letter-spacing:.2px}
.big small{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.line{margin:8px 0 0;color:#3b4a5c}
.line b{color:var(--text)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stat{border:1px solid;border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;line-height:1.35;min-width:120px}
.stat b{font-size:20px}.stat span{font-size:12px}
.alt{padding:12px 16px;margin-top:12px;border:1px dashed #9bd6d8;background:#f4fcfc;box-shadow:none}
.alt .row{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:4px}
.alt .d{font-weight:700;font-size:16px}
.pill{display:inline-block;border:1px solid;border-radius:10px;padding:0 8px;font-size:12px;line-height:20px}
.link{border:0;background:none;color:var(--primary);cursor:pointer;padding:0;font-size:13px;margin-top:10px}
.msg{padding:18px 16px;color:#3b4a5c}
.msg b{display:block;font-size:15px;margin-bottom:4px;color:var(--text)}
.msg .chips{margin-top:10px}
.hintline{margin-top:8px;font-size:12.5px;color:var(--muted)}
.c1{background:var(--c1-bg);color:var(--c1-fg);border-color:var(--c1-bd)}
.c2{background:var(--c2-bg);color:var(--c2-fg);border-color:var(--c2-bd)}
.c3{background:var(--c3-bg);color:var(--c3-fg);border-color:var(--c3-bd)}
.c4{background:var(--c4-bg);color:var(--c4-fg);border-color:var(--c4-bd)}
.nd{background:var(--stripe);color:#7b8696;border-color:#c4cad3}
/* 日历 */
.cal-card{padding:14px 12px 12px}
.cal-h{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding:0 4px 8px}
.cal-h h2{margin:0;font-size:15px}.cal-h span{color:var(--muted);font-size:12px}
.phase{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 4px 10px;font-size:12px;color:#3b4a5c}
.phase i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}.wd.we{color:#cf1322}
.cell{position:relative;min-height:58px;border:1px solid;border-radius:8px;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;background:#fff;font-size:12px;line-height:1.25}
.cell .dt{position:absolute;top:2px;left:4px;font-size:10px;opacity:.7}
.cell b{font-size:15px;margin-top:8px}
.cell small{font-size:10.5px;opacity:.9}
.cell.past{visibility:hidden}
.cell.far{border-style:dashed}
.cell.far.first{box-shadow:-3px 0 0 #9254de}
.cell.today .dt{color:var(--primary);font-weight:700;opacity:1}
.cell.nd b{display:none}.cell.nd small{background:rgba(255,255,255,.85);border-radius:3px;padding:0 3px;margin-top:8px}
.cell:hover{outline:2px solid var(--primary);outline-offset:0;z-index:2}
.cell.hlA{box-shadow:0 0 0 2.5px var(--primary);z-index:1}
.cell.hlB{box-shadow:0 0 0 2.5px #08979c;z-index:1}
.cell .mk{position:absolute;top:-1px;right:-1px;font-size:10px;line-height:15px;padding:0 4px;border-radius:0 7px 0 6px;color:#fff;background:var(--primary)}
.cell .mk.b{background:#08979c}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 4px 0;font-size:12px;color:var(--muted);align-items:center}
.sw{display:inline-block;min-width:30px;padding:0 4px;text-align:center;border:1px solid;border-radius:4px;font-size:11px;line-height:16px;margin-right:3px}
/* 明细抽屉 */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;z-index:50}
.mask.on{display:block}
.sheet{position:fixed;background:#fff;z-index:60;display:none;flex-direction:column;box-shadow:0 -8px 30px rgba(16,24,40,.25)}
.sheet.on{display:flex}
@media(max-width:979px){.sheet{left:0;right:0;bottom:0;max-height:80vh;border-radius:16px 16px 0 0}}
@media(min-width:980px){.sheet{top:0;right:0;bottom:0;width:440px;box-shadow:-8px 0 30px rgba(16,24,40,.2)}}
.sh-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.sh-h h3{margin:0;font-size:17px}.sh-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.sh-h button{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);align-self:flex-start}
.sh-b{padding:10px 16px 20px;overflow:auto;flex:1}
.ship{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.ship .n{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
.ship .t{font-size:11px;font-weight:500;border-radius:4px;padding:0 6px;line-height:18px}
.t.arr{background:#e6f4ff;color:#0958d9}.t.in{background:#f2f4f7;color:#5b6878}
.ship .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;margin-top:6px;font-size:12.5px;color:#3b4a5c}
.ship .kv span em{font-style:normal;color:var(--muted);margin-right:4px}
.ship .kv .w{grid-column:1/-1}
.nodata{padding:22px 4px;color:var(--muted);line-height:1.8}
.nodata .ico{width:48px;height:48px;border-radius:10px;background:var(--stripe);border:1px solid #c4cad3;margin-bottom:8px}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--faint)}
.foot a{color:var(--muted)}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#26394f;color:#fff;border-radius:8px;padding:8px 16px;z-index:100;display:none}
.toast.on{display:block}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">S</span>智慧发船预测</div>
  <a href="index.html">原型导航 · 示例数据</a>
</header>

<main class="wrap">
  <section class="hero">
    <h1>想几号发船？直接问</h1>
    <p>说出货量、航线和时间就行，系统自动判断是大宗、成品还是备件船。</p>
    <div class="card ask">
      <textarea id="q" rows="2" placeholder="例如：下周五前有一船5万吨镍矿从苏里高到港，哪天合适？"></textarea>
      <div class="ask-bar"><small>Enter 发送 · Shift+Enter 换行</small><button class="btn primary" id="go">查询</button></div>
    </div>
    <div class="chips ex" id="examples"></div>
  </section>

  <div id="understood"></div>

  <div class="grid">
    <section id="result"></section>
    <section class="card cal-card">
      <div class="cal-h"><h2>未来 30 天港口容量</h2><span id="calMeta"></span></div>
      <div class="phase">
        <span><i class="c1"></i>近 15 天：泊位余量（来自靠船计划）</span>
        <span><i class="c1" style="border-style:dashed"></i>15 天后：同期船数（来自航次计划，估算）</span>
      </div>
      <div class="cal" id="cal"></div>
      <div class="legend" id="legend"></div>
    </section>
  </div>

  <div class="foot">原型 · 示例数据均为虚构 · <a href="index.html">返回原型导航</a></div>
</main>

<div class="mask" id="mask"></div>
<aside class="sheet" id="sheet" aria-live="polite"></aside>
<div class="toast" id="toast"></div>

<script src="mock-data.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  const M = window.MOCK, E = window.ENGINE, $ = (id) => document.getElementById(id);
  const DAY = 86400000, T = E.TODAY, HORIZON = T + 29, DEFAULT_TONS = 50000; // 5 万吨为已锁定的默认档
  const LOCAL = 'BAHODOPI';
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (n) => Number(n).toLocaleString('en-US');
  const wkOf = (n) => '周' + E.wk(n);
  const mdCn = (n) => { const [, m, d] = E.iso(n).split('-'); return Number(m) + '月' + Number(d) + '日'; };
  const md = E.md;
  const cmrCls = (v) => (v >= .5 ? 'c1' : v >= .3 ? 'c2' : v >= .1 ? 'c3' : 'c4');
  const cmrLab = (v) => (v >= .5 ? '充裕' : v >= .3 ? '适中' : v >= .1 ? '偏紧' : '紧张');
  const denCls = (c, n) => { const r = c / n; return r <= .5 ? 'c1' : r <= .7 ? 'c2' : r <= .9 ? 'c3' : 'c4'; };
  const denLab = (c, n) => { const r = c / n; return r <= .5 ? '宽松' : r <= .7 ? '适中' : r <= .9 ? '偏密' : '拥挤'; };
  const toast = (t) => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); };

  // =============== 自然语言解析（关键词规则，原型版） ===============
  const CN = { 零: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
  function cn2n(s) {
    if (/^[\d.]+$/.test(s)) return parseFloat(s);
    if (s === '十') return 10;
    const m = s.match(/^([一二两三四五六七八九])?十([一二三四五六七八九])?$/);
    if (m) return (m[1] ? CN[m[1]] : 1) * 10 + (m[2] ? CN[m[2]] : 0);
    return s.length === 1 && CN[s] !== undefined ? CN[s] : NaN;
  }
  const KW = {
    '大宗采购船': ['大宗', '镍矿', '红土', '矿', '煤', '石灰石', '灰石', '硫磺', '焦炭', '原料', '燃料', '辅料', '采购', '散货'],
    '成品销售船': ['成品', '线材', '热卷', '方坯', '板坯', '钢', '出口', '销售', '装船', '外贸', '发货', '客户'],
    '物资备件船': ['备件', '物资', '设备', '配件', '备品', '工程', '杂货'],
  };
  function detectBiz(t) {
    const score = {}; let best = null, top = 0, tie = false;
    Object.keys(KW).forEach((k) => { score[k] = KW[k].filter((w) => t.includes(w)).length; });
    Object.keys(score).forEach((k) => { if (score[k] > top) { top = score[k]; best = k; tie = false; } else if (score[k] === top && top > 0) tie = true; });
    return tie ? null : best;
  }
  function detectTons(t) {
    let m = t.match(/([\d.]+|[一二两三四五六七八九十]+)\s*万\s*([一二三四五六七八九])?\s*(?:吨|t|T)?/);
    if (m) { const base = cn2n(m[1]); if (!isNaN(base)) return Math.round((base + (m[2] ? CN[m[2]] / 10 : 0)) * 10000); }
    m = t.match(/(\d+(?:\.\d+)?)\s*千\s*吨/); if (m) return Math.round(parseFloat(m[1]) * 1000);
    m = t.match(/(\d{3,6})\s*(?:吨|t\b|T\b|mt|MT)/); if (m) return parseInt(m[1], 10);
    return null;
  }
  const ALIAS = [];
  M.ports.forEach((p) => {
    const names = [p.en.toLowerCase(), p.cn.replace(/（.*?）/g, '')];
    if (p.isLocal) names.push('imip', '本港', '园区');
    names.forEach((n) => ALIAS.push([n.toLowerCase(), p.en]));
  });
  function detectPorts(t) {
    const low = t.toLowerCase(), hits = [];
    ALIAS.forEach(([n, en]) => { const i = low.indexOf(n); if (i >= 0 && !hits.find((h) => h.en === en)) hits.push({ en, i }); });
    return hits.sort((a, b) => a.i - b.i).map((h) => h.en);
  }
  const dnOf = (m, d) => E.dn((m < 11 ? 2027 : 2026) + '-' + pad(m) + '-' + pad(d));
  const monthEnd = (m) => dnOf(m === 12 ? 1 : m + 1, 1) - 1;
  function detectWindow(t) {
    const fwd = (s) => /^\s*(前|之前|以前|以内|内)/.test(s);
    let m;
    // 1) 明确区间：11月8日到18日 / 11/8-11/18
    m = t.match(/(\d{1,2})\s*[月\/]\s*(\d{1,2})\s*[日号]?\s*(?:到|至|-|~|—|–)\s*(?:(\d{1,2})\s*[月\/])?\s*(\d{1,2})\s*[日号]?/);
    if (m) { const m1 = +m[1], m2 = m[3] ? +m[3] : m1; return { a: dnOf(m1, +m[2]), b: dnOf(m2, +m[4]) }; }
    // 2) 某月初/中/底
    m = t.match(/(\d{1,2})月(上旬|中旬|下旬|初|中|底)/) ;
    let mon = null, part = null;
    if (m) { mon = +m[1]; part = m[2]; }
    else if ((m = t.match(/(下个?月|本月|这个月|月)(初|中|底)/))) { mon = /下/.test(m[1]) ? 12 : 11; part = m[2]; }
    if (mon) {
      const r = { 初: [1, 7], 上旬: [1, 10], 中: [12, 18], 中旬: [11, 20], 底: [25, 31], 下旬: [21, 31] }[part];
      return { a: dnOf(mon, r[0]), b: Math.min(dnOf(mon, r[1]), monthEnd(mon)) };
    }
    // 3) 周几 / 本周 / 下周
    m = t.match(/(下下|下|本|这)?\s*(?:个)?(?:周|星期|礼拜)([一二三四五六日天])\s*(前|之前|以前)?/);
    if (m) {
      const dow = new Date(T * DAY).getUTCDay(), mon = T - ((dow + 6) % 7);
      const k = '一二三四五六日天'.indexOf(m[2]); const kk = k >= 6 ? 7 : k + 1;
      let d = mon + (m[1] === '下' ? 7 : m[1] === '下下' ? 14 : 0) + kk - 1;
      if (!m[1] && d < T) d += 7;
      return m[3] ? { a: T, b: d } : { a: d - 1, b: d + 1 };
    }
    m = t.match(/(下下|下|本|这)(?:个)?(?:周|星期)(?![一二三四五六日天])/);
    if (m) {
      const dow = new Date(T * DAY).getUTCDay(), mon = T - ((dow + 6) % 7) + (m[1] === '下' ? 7 : m[1] === '下下' ? 14 : 0);
      return { a: Math.max(mon, T), b: mon + 6 };
    }
    // 4) N 天后 / N 天内
    m = t.match(/(\d+|[一二两三四五六七八九十]+)\s*天\s*(后|内|之内|以内)/);
    if (m) { const n = cn2n(m[1]); if (!isNaN(n)) return m[2] === '后' ? { a: T + n - 1, b: T + n + 1 } : { a: T, b: T + n }; }
    // 5) 单个日期：11月15日 / 15号 （带「前」= 截止）
    m = t.match(/(\d{1,2})\s*[月\/]\s*(\d{1,2})\s*[日号]?/);
    if (m) { const d = dnOf(+m[1], +m[2]); return fwd(t.slice(t.indexOf(m[0]) + m[0].length)) ? { a: T, b: d } : { a: d - 1, b: d + 1 }; }
    m = t.match(/(\d{1,2})\s*[日号]/);
    if (m) { let d = dnOf(11, +m[1]); if (d < T) d = dnOf(12, +m[1]); return fwd(t.slice(t.indexOf(m[0]) + m[0].length)) ? { a: T, b: d } : { a: d - 1, b: d + 1 }; }
    if (/后天/.test(t)) return { a: T + 2, b: T + 2 };
    if (/明天/.test(t)) return { a: T + 1, b: T + 1 };
    if (/今天|今日/.test(t)) return { a: T, b: T };
    return null;
  }
  function parse(text, ov) {
    const t = text.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 65248));
    const r = { text, biz: (ov && ov.biz) || detectBiz(t), tons: (ov && ov.tons) || detectTons(t), notes: [] };
    const ports = detectPorts(t), others = ports.filter((p) => p !== LOCAL);
    if (r.biz === '成品销售船') { r.load = LOCAL; r.disch = others[0] || null; }
    else { r.load = others[0] || null; r.disch = LOCAL; }
    const w = detectWindow(t);
    if (w) { r.a = Math.max(w.a, T); r.b = Math.min(w.b, HORIZON); r.hasWin = true; if (r.b < r.a) { r.outside = true; } }
    else { r.a = T; r.b = T + 15; r.hasWin = false; }
    return r;
  }

  // =============== 渲染 ===============
  let S = { text: '', ov: {}, parsed: null, res: null, tons: DEFAULT_TONS };

  function understood(p) {
    if (!p) { $('understood').innerHTML = ''; return; }
    const chip = (txt, miss) => '<span class="tag' + (miss ? ' miss' : '') + '">' + txt + '</span>';
    const zh = (en) => { const x = M.ports.find((q) => q.en === en); return x ? x.cn.replace(/（.*?）/g, '') : en; };
    let h = '<span class="k">我理解为：</span>';
    h += chip(p.biz || '船型待确认', !p.biz) + chip(p.tons ? fmt(p.tons) + ' 吨' : '货量待补充', !p.tons);
    if (p.biz === '成品销售船') h += chip('本港装货 → ' + (p.disch ? zh(p.disch) : '客户港未说明'), !p.disch);
    else h += chip((p.load ? zh(p.load) : '装港未说明') + ' → 巴浩多比', !p.load);
    h += p.hasWin ? chip((p.biz === '成品销售船' ? '装船 ' : '到港 ') + md(p.a) + ' – ' + md(p.b)) : chip('未说明时间，默认看未来 15 天', true);
    $('understood').innerHTML = '<div class="understood">' + h + '</div>';
  }

  function msg(title, body, chips) {
    return '<div class="card msg"><b>' + title + '</b>' + body + (chips ? '<div class="chips">' + chips + '</div>' : '') + '</div>';
  }
  function statBox(p, P) {
    if (p.mode === 'cmr') {
      const v = p.c.metric;
      return '<div class="stat ' + cmrCls(v) + '"><b>' + peak(p) + ' 艘</b><span>同期船舶（最多）</span></div>' +
             '<div class="stat ' + cmrCls(v) + '"><b>' + Math.round(v * 100) + '%</b><span>泊位余量 · ' + cmrLab(v) + '</span></div>';
    }
    const v = p.c.metric;
    return '<div class="stat ' + denCls(v, P.n) + '"><b>' + v + ' 艘</b><span>同期船舶（最多）· ' + denLab(v, P.n) + '</span></div>';
  }
  const peak = (p) => Math.max(...p.c.days.map((x) => x.occ)); // ≤15 天路径：窗口内同期在泊船数的最大值

  function planA(p, res) {
    const i = res.input, P = res.pool, prod = i.biz === '成品销售船';
    let h = '<div class="card plan"><h2><span class="badge">推荐</span>' + (prod ? '建议装船时间' : '建议到港时间') + '</h2>';
    h += '<div class="big">' + mdCn(p.c.s) + ' – ' + mdCn(p.c.e) + '<small>' + wkOf(p.c.s) + ' 起</small></div>';
    if (!prod) {
      h += p.depart != null
        ? '<div class="line">建议 <b>' + mdCn(p.depart) + '（' + wkOf(p.depart) + '）发船</b>，航程约 ' + res.run.rule.effP50 + '～' + res.run.rule.effP80 + ' 天</div>'
        : '<div class="hintline">没有这条航线的航程数据，先只给到港日期；补上航程后可推算发船日。</div>';
    } else {
      h += '<div class="line">最晚装船日 <b>' + mdCn(p.deadline) + '</b>' + (p.slack > 0 ? '（窗口后还有 ' + p.slack + ' 天余量）' : '') + '</div>';
      if (p.custEta) h += '<div class="line">到客户港约 ' + md(p.custEta[0]) + ' – ' + md(p.custEta[1]) + ' <span class="faint">（仅供参考）</span></div>';
    }
    h += '<div class="stats">' + statBox(p, P) + '</div>';
    if (p.mode === 'cmr' && p.c.metric < .3) h += '<div class="hintline">这段时间整体偏紧，已经是窗口内最好的选择。</div>';
    h += '<button class="link" data-day="' + p.c.s + '">查看 ' + mdCn(p.c.s) + ' 的到港船舶明细 →</button></div>';
    return h;
  }
  function planB(p, res) {
    const i = res.input, P = res.pool, prod = i.biz === '成品销售船';
    if (!p) return '<div class="card plan alt"><h2><span class="badge b">备选</span>暂无备选</h2><div class="hintline">窗口内没有第二个余量不低于 30% 的时段。</div></div>';
    const v = p.c.metric, cls = p.mode === 'cmr' ? cmrCls(v) : denCls(v, P.n);
    return '<div class="card plan alt"><h2><span class="badge b">备选</span>另一个可选时间</h2><div class="row">' +
      '<span class="d">' + mdCn(p.c.s) + ' – ' + mdCn(p.c.e) + '</span>' +
      (!prod && p.depart != null ? '<span>' + mdCn(p.depart) + ' 发船</span>' : '') +
      '<span class="pill ' + cls + '">同期最多 ' + (p.mode === 'cmr' ? peak(p) : v) + ' 艘' + (p.mode === 'cmr' ? ' · 余量 ' + Math.round(v * 100) + '%' : '') + '</span></div>' +
      '<button class="link" data-day="' + p.c.s + '">查看 ' + mdCn(p.c.s) + ' 的到港船舶明细 →</button></div>';
  }
  function renderResult(p) {
    const el = $('result');
    if (!p) { el.innerHTML = msg('在上面说一句话就行', '比如货量、从哪里来、什么时候要到。右边的日历随时可以点开看每天的船。'); return; }
    if (!p.biz) { el.innerHTML = msg('这是哪种船？', '没有从描述里看出是大宗、成品还是备件，请点选：', ['大宗采购船', '成品销售船', '物资备件船'].map((b) => '<button class="chip" data-biz="' + b + '">' + b + '</button>').join('')); return; }
    if (!p.tons) { el.innerHTML = msg('还差一个货量', '请补充货量，例如「5万吨」，也可以直接点选：', [20000, 50000, 70000].map((n) => '<button class="chip" data-tons="' + n + '">' + (n / 10000) + ' 万吨</button>').join('')); return; }
    if (p.outside) { el.innerHTML = msg('时间超出范围', '目前只能看未来 30 天（到 ' + md(HORIZON) + '）。'); return; }
    const res = E.predict({ biz: p.biz, tons: p.tons, load: p.load, disch: p.disch, winStart: E.iso(p.a), winEnd: E.iso(p.b), strict: true });
    S.res = res;
    if (res.errors.length) { el.innerHTML = msg('暂时算不了', res.errors.join('；')); return; }
    if (res.noCandidate) {
      el.innerHTML = msg('这段时间还没有数据，暂时无法推荐',
        (res.run.mode === 'cmr' ? '靠船计划只到 ' + md(E.planCoverTo) + '，灰色斜线的日期暂无数据。' : '航次计划只到 ' + md(E.voyHorizon) + '。') + '可以换个更早的时间再问，或等下一期靠船计划。');
      return;
    }
    el.innerHTML = planA(res.plans[0], res) + planB(res.plans[1], res);
  }

  // ---------- 日历 ----------
  function renderCal(res) {
    const tons = S.tons, cal = E.calendar(tons), days = cal.days, P = cal.P;
    $('calMeta').textContent = fmt(tons) + ' 吨 · 可用泊位 ' + P.n + ' 个' + (S.parsed && S.parsed.tons ? '' : '（默认 5 万吨档）');
    const A = res && res.plans && res.plans[0], B = res && res.plans && res.plans[1];
    const inW = (pl, d) => pl && d >= pl.c.s && d <= pl.c.e;
    const dow0 = (new Date(days[0].d * DAY).getUTCDay() + 6) % 7;     // 周一为 0
    let h = ['一', '二', '三', '四', '五', '六', '日'].map((x, i) => '<div class="wd' + (i > 4 ? ' we' : '') + '">' + x + '</div>').join('');
    for (let k = 0; k < dow0; k++) h += '<div class="cell past"></div>';
    const firstFar = days.find((d) => d.mode === 'density').d;
    days.forEach((d) => {
      const lab = (d.d === T || E.iso(d.d).endsWith('-01') ? md(d.d) : String(Number(E.iso(d.d).slice(8)))) ;
      const dt = '<span class="dt">' + (d.d === T ? '今天' : lab) + '</span>';
      let cls = 'cell', inner;
      if (d.state !== 'ok') { cls += ' nd'; inner = '<small>无数据</small>'; }
      else if (d.mode === 'cmr') { cls += ' ' + cmrCls(d.cmr); inner = '<b>' + d.occ + '艘</b><small>' + Math.round(d.cmr * 100) + '%</small>'; }
      else { cls += ' ' + denCls(d.count, d.n); inner = '<b>' + d.count + '艘</b><small>估算</small>'; }
      if (d.mode === 'density') cls += ' far' + (d.d === firstFar ? ' first' : '');
      if (d.d === T) cls += ' today';
      if (inW(A, d.d)) cls += ' hlA'; else if (inW(B, d.d)) cls += ' hlB';
      const mk = (A && d.d === A.c.s) ? '<span class="mk">荐</span>' : (B && d.d === B.c.s && !inW(A, d.d)) ? '<span class="mk b">备</span>' : '';
      h += '<button class="' + cls + '" data-day="' + d.d + '" aria-label="' + md(d.d) + '">' + dt + mk + inner + '</button>';
    });
    $('cal').innerHTML = h;
    $('legend').innerHTML =
      '<span>近 15 天余量：<i class="sw c1">≥50%</i>充裕<i class="sw c2">30–50%</i>适中<i class="sw c3">10–30%</i>偏紧<i class="sw c4">&lt;10%</i>紧张</span>' +
      '<span><i class="sw nd">&nbsp;</i>无数据（灰色斜线，不是 0%）</span>' +
      '<span><i class="sw" style="border-color:var(--primary);color:var(--primary)">荐</i><i class="sw" style="border-color:#08979c;color:#08979c">备</i>推荐 / 备选</span>' +
      '<span>格内：船数 / 泊位余量</span><span>点击任意一天看到港船舶</span>';
    $('cal').querySelectorAll('[data-day]').forEach((b) => b.onclick = () => openDay(+b.dataset.day));
  }

  // ---------- 明细抽屉 ----------
  const sheet = $('sheet'), mask = $('mask');
  function close() { sheet.classList.remove('on'); mask.classList.remove('on'); }
  mask.onclick = close; document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  function openDay(d) {
    const det = E.dayDetail(d, S.tons), head = mdCn(d) + ' ' + wkOf(d);
    let sub, body = '';
    if (det.state === 'nodata') {
      sub = det.mode === 'cmr' ? '近 15 天 · 靠船计划暂无数据' : '15 天后 · 航次计划暂无数据';
      body = '<div class="nodata"><div class="ico"></div>这一天还没有数据（灰色斜线），显示的不是 0 艘。<br>' +
        (det.mode === 'cmr' ? '靠船计划目前只到 ' + md(E.planCoverTo) + '，下一期更新后会补上。' : '航次计划目前只到 ' + md(E.voyHorizon) + '。') + '</div>';
    } else if (det.mode === 'cmr') {
      sub = '近 15 天 · 同期船舶 ' + det.list.length + ' 艘 · 泊位余量 ' + Math.round(det.cmr * 100) + '%（' + cmrLab(det.cmr) + '，空闲 ' + (det.P.n - det.occ) + '/' + det.P.n + ' 个）';
      body = det.list.length ? det.list.map((s) =>
        '<div class="ship"><div class="n">' + s.vessel + '<span class="t ' + (s.arriving || s.berthing ? 'arr' : 'in') + '">' + (s.arriving ? '今日预抵' : s.berthing ? '今日靠泊' : '在泊') + '</span></div><div class="kv">' +
        '<span><em>泊位</em>' + s.berth + '</span><span><em>货种</em>' + s.cargo + '</span>' +
        '<span><em>货量</em>' + fmt(s.tons) + ' 吨</span><span><em>预计到港</em>' + md(s.eta) + '</span>' +
        '<span><em>靠泊</em>' + md(s.start) + '</span><span><em>在港至</em>' + md(s.end) + '</span></div></div>').join('')
        : '<div class="nodata">这一天没有占用同吨级泊位的船，泊位全部空闲。</div>';
    } else {
      sub = '15 天后 · 同期船舶 ' + det.list.length + ' 艘 · 按航次计划估算';
      body = det.list.length ? det.list.map((s) =>
        '<div class="ship"><div class="n">' + (s.vessel || '待宣船') + '<span class="t ' + (s.arriving ? 'arr' : 'in') + '">' + (s.arriving ? '计划到达' : '窗口内') + '</span></div><div class="kv">' +
        '<span><em>航线</em>' + s.load + ' → ' + s.disch + '</span><span><em>状态</em>' + s.status + '</span>' +
        '<span><em>货量</em>' + fmt(s.tons) + ' 吨</span><span><em>' + (s.side === '装' ? '受载期' : '计划到港') + '</em>' + md(s.start) + ' – ' + md(s.end) + '</span></div></div>').join('')
        : '<div class="nodata">这一天没有与该吨级竞争的船。</div>';
    }
    const filt = det.state === 'ok' ? '<div class="hintline" style="margin:0 0 10px">只列出会占用 ' + fmt(S.tons) + ' 吨货量同吨级泊位的船。</div>' : '';
    sheet.innerHTML = '<div class="sh-h"><div><h3>' + head + '</h3><p>' + sub + '</p></div><button id="shx" aria-label="关闭">×</button></div><div class="sh-b">' + filt + body + '</div>';
    sheet.classList.add('on'); mask.classList.add('on'); $('shx').onclick = close;
  }

  // =============== 交互 ===============
  function run(text, ov) {
    S.text = text; S.ov = ov || {};
    if (!text.trim()) { toast('先说一句话，比如「5万吨镍矿从苏里高到港」'); return; }
    const p = parse(text, S.ov); S.parsed = p;
    S.tons = p.tons || DEFAULT_TONS;
    understood(p); S.res = null; renderResult(p); renderCal(S.res);
  }
  const EXAMPLES = [
    '下周五前有一船5万吨镍矿从苏里高到港，哪天合适？',
    '成品线材2.8万吨，11月8日到20日装船，发海防',
    '备件船8000吨从雅加达来，下周到港',
    '12月初有一船5万吨大宗，塔加尼托过来',
    '11月17号到19号能进一船5万吨镍矿吗，苏里高过来',
  ];
  $('examples').innerHTML = EXAMPLES.map((x, i) => '<button class="chip" data-ex="' + i + '">' + x + '</button>').join('');
  $('examples').onclick = (e) => { const b = e.target.closest('[data-ex]'); if (b) { $('q').value = EXAMPLES[+b.dataset.ex]; run($('q').value); } };
  $('go').onclick = () => run($('q').value);
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); run($('q').value); } });
  $('result').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.biz) run(S.text, Object.assign({}, S.ov, { biz: b.dataset.biz }));
    else if (b.dataset.tons) run(S.text, Object.assign({}, S.ov, { tons: +b.dataset.tons }));
    else if (b.dataset.day) openDay(+b.dataset.day);
  });

  renderResult(null); renderCal(null);
  window.__P02 = { ask(t) { $('q').value = t; run(t); }, parse };
})();
</script>
</body>
</html>
