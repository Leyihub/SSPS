<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P11 智能提问 · SSPS 原型</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.p11{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}
.p11 > section > .card{margin-bottom:14px}
/* 顶部：标题 + 四阶段 */
.hd{padding:16px 20px 14px;background:linear-gradient(100deg,#f3f8ff 0%,#eaf3ff 55%,#dfeeff 100%);border:1px solid #d6e6fb}
.hd-t{display:flex;align-items:center;gap:14px}
.hd-ico{width:52px;height:52px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(22,119,255,.18);flex:none}
.hd-ico svg{width:34px;height:34px}
.hd h1{margin:0;font-size:24px;color:#17365d;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd h1 small{font-size:12px;font-weight:600;color:#0958d9;background:#e6f4ff;border:1px solid #91caff;border-radius:6px;padding:0 8px;line-height:20px}
.hd p{margin:2px 0 0;color:#4a596b;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.st{display:flex;align-items:center;gap:8px;border-radius:20px;padding:5px 12px;background:#fff;border:1px solid #e0e7f1;color:#6b7a8c;font-size:14px;white-space:nowrap;min-width:0}
.st b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#eef2f7;color:#6b7a8c;flex:none}
.st span{overflow:hidden;text-overflow:ellipsis}
.st.cur{background:#1677ff;border-color:#1677ff;color:#fff;font-weight:600}.st.cur b{background:#fff;color:#1677ff}
.st.done{border-color:#91caff;color:#0958d9}.st.done b{background:#e6f4ff;color:#0958d9}
.st.skip{border-style:dashed;color:#98a4b3}
/* 输入框 */
.ask{border:1.5px solid #b7d8ff;box-shadow:0 2px 12px rgba(22,119,255,.10)}
.ask-in{display:flex;gap:10px;padding:12px 16px 4px}
.ask-in .ai{width:30px;height:30px;border-radius:8px;background:#e6f4ff;display:grid;place-items:center;flex:none;margin-top:4px}
.ask textarea{flex:1;border:0;outline:0;resize:none;min-height:58px;font-size:16px;line-height:1.7;padding:4px 0;background:transparent}
.ask-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #e6eefb}
.ask-bar .hint{flex:1;color:#98a4b3;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic{width:40px;height:40px;border-radius:50%;border:1px solid #d3d9e1;background:#fff;cursor:pointer;display:grid;place-items:center;position:relative;flex:none}
.mic svg{width:20px;height:20px;fill:#5b6878}
.mic:hover{border-color:var(--primary)}.mic:hover svg{fill:var(--primary)}
.mic.on{background:#ff4d4f;border-color:#ff4d4f}.mic.on svg{fill:#fff}
.mic.on:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,77,79,.45);animation:pulse 1.1s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
.wave{display:none;align-items:center;gap:3px;height:22px}
.wave.on{display:flex}
.wave i{width:3px;background:#ff4d4f;border-radius:2px;animation:w 0.9s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes w{0%,100%{height:5px}50%{height:20px}}
.bt{height:40px;padding:0 18px;font-size:14.5px;border-radius:8px;flex:none}
.bt.primary{padding:0 24px;font-weight:600;box-shadow:0 2px 6px rgba(22,119,255,.3)}
.btn[disabled],.btn.dis{opacity:.45;cursor:not-allowed;box-shadow:none}
/* 卡片标题 */
.sh{display:flex;align-items:center;gap:10px;padding:12px 18px 6px;flex-wrap:wrap}
.sh h2{margin:0;font-size:16px;display:flex;align-items:center;gap:6px}
.sh .sub{color:var(--muted);font-size:13px}
.sh .sp{flex:1}
.stale{margin:0 18px 10px;border-radius:8px;padding:6px 12px;font-size:13px;background:#fff7e6;border:1px solid #ffd591;color:#ad4e00}
/* 解析结果：可编辑字段 */
.pf{display:grid;grid-template-columns:1fr 1fr .9fr 1.5fr 1.1fr;gap:10px 14px;padding:4px 18px 14px}
.pf label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.pf .inp{width:100%;height:36px;font-size:14.5px}
.pf .miss .inp{border-color:#ffa39e;background:#fff8f7}
.pf .suf{position:relative}.pf .suf .inp{padding-right:30px}.pf .suf em{position:absolute;right:10px;top:9px;font-style:normal;color:var(--muted);font-size:13px}
.pf .rt{display:flex;align-items:center;gap:6px}.pf .rt .inp{flex:1;min-width:0}.pf .rt span{white-space:nowrap;color:#3b4a5c;font-size:14px}
.pf .fh{font-size:12px;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alts{padding:0 18px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:#6b7a8c}
.chipf{border:1px solid var(--line);background:#fff;border-radius:14px;padding:1px 12px;cursor:pointer;font-size:13px;color:#3b4a5c;white-space:nowrap}
.chipf:hover{border-color:var(--primary);color:var(--primary)}
/* 库存测算 */
.lvl{display:inline-block;border-radius:4px;padding:0 8px;font-size:12px;line-height:20px;font-weight:600}
.lvl.ok{background:#f6ffed;color:#237804;border:1px solid #b7eb8f}.lvl.mid{background:#fff7e6;color:#ad4e00;border:1px solid #ffd591}.lvl.bad{background:#fff1f0;color:#a8071a;border:1px solid #ffa39e}
.mcs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:4px 18px 12px}
.mc{border:1px solid #e6ebf2;border-radius:10px;padding:10px 12px;background:#fbfcfe;min-width:0}
.mc .k{font-size:12.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:4px}
.mc .v{font-size:20px;font-weight:700;white-space:nowrap;margin-top:2px}
.mc .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.mc .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc.red{background:#fff1f0;border-color:#ffccc7}.mc.red .v{color:#cf1322}
.mc.grn{background:#f6ffed;border-color:#d9f7be}.mc.grn .v{color:#237804}
.mc.amb .v{color:#d46b08}
.mc select{height:28px;padding:0 6px;font-weight:600;font-size:14px;width:88px}
.tabs2{display:flex;align-items:center;gap:8px;padding:0 18px;border-bottom:1px solid var(--line-2)}
.tabs2 .tb{border:0;background:none;padding:8px 6px;font-size:14px;color:#5b6878;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 .tb.on{color:#0958d9;border-bottom-color:#1677ff;font-weight:600}
.tabs2 .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:3px 12px;font-size:13px;cursor:pointer;color:#3b4a5c;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}.seg button.on{background:#1677ff;color:#fff}
.chartbox{padding:10px 18px 4px}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.dt td{padding:5px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.dt td.r,.dt th.r{text-align:right}
.dt tr.k td{background:#fffbe6}.dt tr.so td{background:#fff1f0;color:#a8071a}
.dtw{max-height:300px;overflow:auto;margin:10px 18px 4px;border:1px solid var(--line-2);border-radius:8px}
.concl{margin:8px 18px 12px;border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.7;background:#f0f7ff;border:1px solid #b7d8ff;color:#0958d9}
.concl.red{background:#fff1f0;border-color:#ffa39e;color:#a8071a}
.concl.amb{background:#fff7e6;border-color:#ffd591;color:#ad4e00}
.concl b.t{margin-right:4px}
.acts{display:flex;align-items:center;gap:12px;padding:12px 18px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.acts .why{color:var(--muted);font-size:13px}
.acts .why.err{color:#cf1322}
.skipc{padding:12px 18px;color:#5b6878;font-size:13.5px}
/* 快捷提问 */
.quick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px}
.quick h3{margin:0;font-size:14px;color:#1f2d3d;white-space:nowrap;display:flex;align-items:center;gap:4px}
.quick .chipf{border-radius:20px;padding:5px 14px;font-size:13.5px;color:#4a596b}
/* 右侧库存面板 */
.inv h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.inv .lg{display:flex;gap:12px;font-size:12.5px;color:#4a596b;flex-wrap:wrap;margin-top:6px}
.inv .lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.inv .up{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 16px 0;color:var(--faint);font-size:12px;flex-wrap:wrap}
.inv .grp{padding:12px 16px 4px}
.itabs{display:grid;grid-template-columns:1fr 1fr;margin:10px 16px 4px;background:#f2f5f9;border-radius:8px;padding:3px}
.itabs button{border:0;background:none;padding:6px 0;border-radius:6px;font-size:14px;color:#5b6878;cursor:pointer}
.itabs button.on{background:#fff;color:#0958d9;font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.ig{margin:8px 16px 0;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.ig-h{display:flex;align-items:center;gap:6px;padding:7px 12px;background:#f5f8fc;cursor:pointer;font-weight:600;font-size:13.5px;user-select:none}
.ig-h .ar{display:inline-block;transition:transform .15s;color:#6b7a8c}.ig.closed .ar{transform:rotate(-90deg)}
.ig.closed .ig-b{display:none}
.ig-b{padding:4px 6px}
.ir{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;min-width:0}
.ir:hover{background:#f2f6fb}
.ir i{width:9px;height:9px;border-radius:50%;flex:none}
.ir span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir em{font-style:normal;color:var(--faint);font-size:12px;white-space:nowrap}
.ir b{font-size:12.5px;border-radius:6px;padding:0 8px;line-height:22px;flex:none}
.ir.ok i{background:#52c41a}.ir.ok b{background:#f6ffed;color:#389e0d}
.ir.mid i{background:#fa8c16}.ir.mid b{background:#fff7e6;color:#d46b08}
.ir.bad i{background:#ff4d4f}.ir.bad b{background:#fff1f0;color:#cf1322}
.ir.sel{background:#e6f4ff}
.imp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px 14px;margin-top:10px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.imp .btn{padding:3px 12px}
.sample{background:#fffbe6;border:1px solid #ffe58f;color:#ad6800;border-radius:6px;padding:0 8px;font-size:12px;line-height:20px;white-space:nowrap}
@media(max-width:1280px){.p11{grid-template-columns:minmax(0,1fr)}.mcs{grid-template-columns:repeat(3,minmax(0,1fr))}.pf{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.steps{grid-template-columns:1fr 1fr}.quick .chipf,.st{white-space:normal}.hd-ico{display:none}.acts .bt{flex:1}.mcs{grid-template-columns:repeat(2,minmax(0,1fr))}.pf{grid-template-columns:1fr 1fr}.pf .wide{grid-column:1/-1}.ask-bar .hint{display:none}.hd h1{font-size:20px}}
</style>
</head>
<body>
<div class="app"><aside id="nav"></aside>
  <div class="main"><header id="topbar"></header>
    <main class="page">
      <div class="p11">
        <section>
          <div class="card hd">
            <div class="hd-t">
              <div class="hd-ico"><svg viewBox="0 0 40 40"><path d="M6 26h28l-4 7H10z" fill="#1677ff"/><path d="M11 25V15h14l4 10z" fill="#69b1ff"/><rect x="14" y="9" width="7" height="6" rx="1" fill="#0958d9"/><path d="M4 35c3 0 3-1.5 6-1.5s3 1.5 6 1.5 3-1.5 6-1.5 3 1.5 6 1.5 3-1.5 6-1.5" stroke="#91caff" stroke-width="1.6" fill="none"/></svg></div>
              <div><h1>智能发船助手<small>智慧发船预测系统</small></h1><p>基于库存消耗、港口容量与航程规则的发船方案助手</p></div>
            </div>
            <div class="steps" id="steps"></div>
          </div>
          <div class="card ask">
            <div class="ask-in"><span class="ai"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z" fill="none" stroke="#1677ff" stroke-width="2" stroke-linejoin="round"/><path d="M8 9h8M8 12h5" stroke="#1677ff" stroke-width="2" stroke-linecap="round"/></svg></span>
              <textarea id="q" placeholder="像说话一样描述需求，比如：烧结石灰石 秦皇岛→德信 5万吨 12月10日前到港"></textarea></div>
            <div class="ask-bar"><span class="hint" id="hint">按 Enter 解析，Shift+Enter 换行</span><span class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></span>
              <button class="mic" id="mic" aria-label="语音输入" title="语音输入"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg></button>
              <button class="btn bt" id="clr">清空</button>
              <button class="btn primary bt" id="send">解析需求</button></div>
          </div>
          <div id="parsed"></div>
          <div id="stock"></div>
          <div class="card"><div class="quick" id="quickbox"><h3><svg width="14" height="14" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="#1677ff"/></svg>快捷提问</h3><span id="quick" style="display:contents"></span></div></div>
        </section>
        <aside class="card inv" id="inv"></aside>
      </div>
    </main>
  </div>
</div>
<script src="mock-data.js"></script><script src="engine.js"></script><script src="assets/shell.js"></script><script src="assets/common.js"></script><script src="assets/nlp.js"></script><script src="assets/stock-chart.js"></script>
<script>
(function () {
  SHELL.mount({ active: 'P11', title: '智能提问' });
  const M = window.MOCK, E = window.ENGINE, C = window.C, N = window.NLP, $ = (id) => document.getElementById(id);
  const fmt = C.fmt, T = E.TODAY, md = (n) => E.md(n), mdCn = (n) => C.mdCn(E.iso(n));
  const EXAMPLES = ['烧结石灰石 秦皇岛→德信 5万吨 2026年12月10日前', '废钢 新村港→德信 1万吨 11月28日前', '高硅块 唐山→德信 3万吨 11月30日前', '成品线材2.8万吨，11月8日到20日装船，发海防', '备件船8000吨从雅加达来，下周到港'];
  const BIZ = ['大宗采购船', '成品销售船', '物资备件船'], LOCAL = 'BAHODOPI', DEF_LOAD = 'QINHUANGDAO', DEF_CUST = 'HAIPHONG';
  // 页面状态。阶段：1 输入需求 → 2 智能解析 → 3 库存测算 → 4 生成方案（只改界面流程，计算全部调用原有引擎函数）
  const S = { text: '', ov: {}, parsed: null, stale: false, gen: false, buf: (M.inventory && M.inventory.bufferDays) || 3,
    invTab: 'mat', closed: {}, view: 'trend', range: 0 };
  const lvl = (d) => (d >= 25 ? ['ok', '充裕'] : d >= 15 ? ['mid', '偏紧'] : ['bad', '危险']);
  const isProd = () => S.parsed && S.parsed.biz === '成品销售船';
  const routeOf = (p) => (p.biz === '成品销售船' ? { load: LOCAL, disch: p.disch || DEF_CUST } : { load: p.load || DEF_LOAD, disch: LOCAL });
  const missing = () => { const p = S.parsed, m = []; if (!p) return ['需求']; if (!p.biz) m.push('船型'); if (!p.tons) m.push('货量'); return m; };
  const ready = () => !!(S.parsed && !S.stale && !missing().length && !S.parsed.outside);

  // ---------- 四阶段 ----------
  function stage() {
    if (!S.parsed || S.stale) return 1;
    if (!ready()) return 2;
    return 4;                                                   // 解析完整后库存测算即时完成（未指定物料时跳过），等待生成方案
  }
  function drawSteps() {
    const cur = stage(), noItem = S.parsed && !S.stale && !S.parsed.item;
    const names = ['输入需求', '智能解析', noItem && cur === 4 ? '库存测算（未指定物料）' : '库存测算', S.gen ? '正在生成方案' : '生成方案'];
    $('steps').innerHTML = names.map((n, i) => { const k = i + 1; let c = k < cur ? 'done' : k === cur ? 'cur' : '';
      if (k === 3 && noItem && cur === 4) c = 'skip';
      return '<div class="st ' + c + '"><b>' + (c === 'done' ? '✓' : k) + '</b><span>' + n + '</span></div>'; }).join('');
  }
  function syncButtons() {
    const has = !!$('q').value.trim();
    $('send').disabled = !has; $('send').title = has ? '' : '先输入需求';
    $('clr').disabled = !has && !S.parsed;
    const g = $('go'), why = $('why');
    if (g) {
      const ok = ready() && !S.gen; g.disabled = !ok;
      if (why) { const m = missing(); why.className = 'why' + (ok ? '' : ' err');
        why.textContent = S.gen ? '正在生成…' : S.stale ? '需求文字已修改，请先点「解析需求」' : m.length ? '还缺少：' + m.join('、') : S.parsed.outside ? '时间超出范围，只能看未来 60 天' : '下一页给出推荐方案和备选方案' + (S.parsed.item ? '，并保证不断料' : ''); }
    }
    drawSteps();
  }

  // ---------- 右侧：库存可用天数分析（按物料 / 按风险） ----------
  function drawInv() {
    const I = M.inventory, sel = S.parsed && S.parsed.item ? S.parsed.item.name : '';
    const row = (i, showType) => { const l = lvl(i.days);
      return '<div class="ir ' + l[0] + (i.name === sel ? ' sel' : '') + '" data-n="' + C.esc(i.name) + '"' + C.tipAttr(i.name + '\n当前库存 ' + fmt(i.stock) + ' 吨 · 日耗 ' + fmt(i.daily) + ' 吨\n' + (i.stockout ? '模拟库存首次降到 0：' + C.mdCn(E.iso(i.stockout)) + '（距今 ' + (i.stockout - T) + ' 天）' : '模拟期内不断料') + '\n点击带入提问') + '><i></i><span>' + i.name + '</span>' + (showType ? '<em>' + i.type + '</em>' : '') + '<b>' + i.days + '天</b></div>'; };
    const grp = (key, title, list, showType) => '<div class="ig' + (S.closed[key] ? ' closed' : '') + '"><div class="ig-h" data-g="' + C.esc(key) + '"><span class="ar">▾</span>' + title + '（' + list.length + '）</div><div class="ig-b">' +
      (list.length ? list.map((i) => row(i, showType)).join('') : '<div class="ir" style="cursor:default;color:var(--faint)">没有</div>') + '</div></div>';
    let body;
    if (S.invTab === 'mat') { const types = [...new Set(I.items.map((i) => i.type))]; body = types.map((ty) => grp('t:' + ty, ty, I.items.filter((i) => i.type === ty).sort((a, b) => a.days - b.days), false)).join(''); }
    else body = [['bad', '危险（15 天以内）'], ['mid', '偏紧（15–25 天）'], ['ok', '充裕（25 天以上）']].map(([k, t]) => grp('r:' + k, t, I.items.filter((i) => lvl(i.days)[0] === k).sort((a, b) => a.days - b.days), true)).join('');
    $('inv').innerHTML = '<div class="grp"><h2>库存可用天数分析' + C.ic('按库存消耗模拟表计算：可用天数 = 当前库存 ÷ 日耗。模拟库存已经包含已排定的到货，降到 0 的那一天就是断料日。点击某个物料可以带入提问。') + '</h2>' +
      '<div class="lg"><span><i style="background:#52c41a"></i>充裕（>25天）</span><span><i style="background:#fa8c16"></i>偏紧（15–25天）</span><span><i style="background:#ff4d4f"></i>危险（&lt;15天）</span></div></div>' +

  // ---------- 阶段 2：解析结果（可编辑后重新计算） ----------

      const r = routeOf(p), sp = E.effStockout(p.item, S.buf, r.load, r.disch, p.biz), it = p.item, so = sp.so, latest = so != null ? so - S.buf : null, l = lvl(it.days);
      const rule = E.ruleFor(r.load, r.disch, p.biz), p80 = rule && p.biz !== '成品销售船' ? Math.ceil(rule.effP80) : null;

        '<span class="sp"></span><span class="sub">到港后缓冲' + C.ic('船到港后还要靠泊、卸货、入库，所以要提前留几天。原型默认 3 天，待确认。') + '</span><select class="inp" id="buf" style="width:84px;height:30px;padding:0 6px;font-weight:600">' +
        [0, 1, 2, 3, 4, 5, 7].map((n) => '<option value="' + n + '"' + (n === S.buf ? ' selected' : '') + '>' + n + ' 天</option>').join('') + '</select></div>';
      const card = (k, v, n, cls) => '<div class="mc ' + (cls || '') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + (n ? '<div class="n">' + n + '</div>' : '') + '</div>';
      h += '<div class="mcs">' + card('当前库存', fmt(it.stock) + '<small>吨</small>') + card('日耗', fmt(it.daily) + '<small>吨/天</small>') + card('可用天数', it.days + '<small>天</small>', l[1], l[0] === 'bad' ? 'red' : l[0] === 'mid' ? 'amb' : '') +

        card('约定的截止日', p.userDeadline && p.b ? mdCn(p.b) : '未约定', p.userDeadline && p.b ? '距今 ' + (p.b - T) + ' 天' : '按库存自动推算') +
        card('断料日', so != null ? mdCn(so) : '不断料', so != null ? (so <= T ? '已断料' : '距今 ' + (so - T) + ' 天') + (sp.gap ? ' · 另有短缺口 ' + md(sp.gap.from) : '') : '模拟期内', so != null ? 'red' : 'grn') + '</div>';
      h += '<div class="tabs2"><button class="tb' + (S.view === 'trend' ? ' on' : '') + '" data-v="trend">库存趋势预测</button><button class="tb' + (S.view === 'detail' ? ' on' : '') + '" data-v="detail">库存明细</button><span class="sp"></span>' +
        '<span class="seg">' + [[7, '7天'], [15, '15天'], [30, '30天'], [0, '全部']].map(([n, t]) => '<button data-r="' + n + '" class="' + (S.range === n ? 'on' : '') + '">' + t + '</button>').join('') + '</span></div>';
      const until = S.range ? T + S.range : Math.min(Math.max(T + 45, (so || 0) + 14, (latest || 0) + 14), T + 100);
      if (S.view === 'trend') h += '<div class="chartbox">' + window.StockChart.html(it, { latest, so, gap: sp.gap, warnDays: 15, until: S.range ? until : undefined, width: Math.max(320, ($('stock').clientWidth || 900) - 36) }) + '</div>';

    el.querySelectorAll('[data-v]').forEach((x) => x.onclick = () => { S.view = x.dataset.v; drawStock(); syncButtons(); });
    el.querySelectorAll('[data-r]').forEach((x) => x.onclick = () => { S.range = +x.dataset.r; drawStock(); syncButtons(); });

  // ---------- 阶段 4：生成方案（跳到 P02，参数与原来一致） ----------
  function go() {
    if (!ready() || S.gen) return;
    S.gen = true; $('go').innerHTML = SHIP + '正在生成方案…'; syncButtons();
    const p = S.parsed, it = p.item, r = routeOf(p);

    let we = p.userDeadline && p.b ? p.b : (it ? (latest != null ? Math.max(latest, T) : T + 30) : T + 15);

    const q = { biz: p.biz, tons: p.tons, load: r.load, disch: r.disch, ws: E.iso(ws), we: E.iso(we) };
    if (it) { q.item = it.name; q.buf = S.buf; q.pb = 'end'; }
    setTimeout(() => { location.href = 'P02-prediction.html?' + new URLSearchParams(q); }, 350);
  }

  // ---------- 阶段 1 → 2：解析 ----------
  function run(keep) {
    const text = $('q').value.trim(); if (!text) { C.toast('先输入需求，或点右侧的物料'); syncButtons(); return; }
    if (!keep) S.ov = {};

    if (!keep) C.toast(ready() ? '已解析，可以直接修改字段后重新计算' : '已解析，还缺少：' + missing().join('、'));
  }
  function clearAll() { $('q').value = ''; S.text = ''; S.ov = {}; S.parsed = null; S.stale = false; S.gen = false; render(); $('q').focus(); }

  // ---------- 语音输入 ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null, on = false, timer = null;
  const setOn = (v) => { on = v; $('mic').classList.toggle('on', v); $('wave').classList.toggle('on', v); $('hint').textContent = v ? '正在听，请直接说出需求…再点一次麦克风结束' : '按 Enter 解析，Shift+Enter 换行'; };

  }
  $('mic').onclick = () => {
    if (on) { if (rec) { try { rec.stop(); } catch (e) { /* ignore */ } } clearInterval(timer); setOn(false); if ($('q').value.trim()) run(); return; }
    if (!SR) { demoVoice('这个浏览器不支持语音识别，已改为演示：模拟说出一句话'); return; }

      rec.onresult = (e) => { $('q').value = [...e.results].map((r) => r[0].transcript).join(''); };

      rec.start(); setOn(true);
    } catch (e) { demoVoice('语音识别启动失败，已改为演示'); }
  };

  // ---------- 导入真实的库存消耗模拟表（只在本机浏览器解析） ----------
  const loadXlsx = () => new Promise((res, rej) => { if (window.XLSX) return res(window.XLSX); const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('解析库加载失败，请检查网络')); document.head.appendChild(s); });
  const dayOf = (v) => { if (v == null || v === '') return NaN; if (v instanceof Date) return Math.round(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()) / 86400000); if (typeof v === 'number') return Math.round(v - 25569); const m = String(v).match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/); return m ? Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000) : NaN; };
  const numOf = (v) => { const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : NaN; };
  async function importFile(file) {
    try {
      C.toast('正在解析…'); const X = await loadXlsx(); const wb = X.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
      const rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null });
      if (!rows.length || !('品名' in rows[0]) || !('库存' in rows[0])) { C.toast('不是库存消耗模拟表：找不到「品名」「库存」列'); return; }
      const by = new Map(); let bad = 0, imp = '';
      rows.forEach((r) => { const d = dayOf(r['库存日期']), s = numOf(r['库存']), dl = numOf(r['日耗']); if (r['导入日期'] && !imp) imp = String(r['导入日期'] instanceof Date ? r['导入日期'].toISOString().slice(0, 10) : r['导入日期']).replace(/\//g, '-');
        if (!isFinite(d) || !isFinite(s)) { bad++; return; } const k = r['品名']; if (!by.has(k)) by.set(k, { type: r['物料类型'] || '其他', name: k, rows: [] }); by.get(k).rows.push([d, s, isFinite(dl) ? dl : null, numOf(r['可用天数'])]); });
      const items = [...by.values()].map((g) => { g.rows.sort((a, b) => a[0] - b[0]); let lastDl = (g.rows.find((x) => x[2]) || [0, 0, 1])[2] || 1;
        const series = g.rows.map((x) => { if (x[2]) lastDl = x[2]; return [x[0], x[1], x[2] || lastDl]; });
        const at = series.find((x) => x[0] >= T) || series[0], first0 = series.find((x) => x[0] >= T && x[1] <= 0);
        const days = isFinite(g.rows.find((x) => x[0] === at[0])[3]) ? Math.floor(g.rows.find((x) => x[0] === at[0])[3]) : Math.floor(at[1] / at[2]);
        return { type: g.type, name: g.name, stock: at[1], daily: at[2], days, series, stockout: first0 ? first0[0] : null, arrivals: [] }; });
      M.inventory = { updated: (imp || M.today) + ' 导入', source: '导入：' + file.name, sample: false, warnDays: 15, safeDays: 25, bufferDays: 3, items };
      try { sessionStorage.setItem('ssps-inventory', JSON.stringify(M.inventory)); } catch (e) { C.toast('已导入，但浏览器存不下，翻页后会恢复示例数据'); }
      C.toast('已导入 ' + items.length + ' 个物料' + (bad ? '，忽略 ' + bad + ' 行错误值' : '') + '；文件没有上传'); S.parsed = null; render(); drawInv();
    } catch (e) { C.toast(e.message || '导入失败'); }
  }

  $('quick').innerHTML = EXAMPLES.map((x, i) => '<button class="chipf" data-i="' + i + '">' + x + '</button>').join('');
  $('quick').onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) { $('q').value = EXAMPLES[+b.dataset.i]; run(); } };
  $('send').onclick = () => run();
  $('clr').onclick = clearAll;
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if ($('q').value.trim()) run(); } });
  $('q').addEventListener('input', () => { const st = !!(S.parsed && $('q').value.trim() !== S.text); if (st !== S.stale) { S.stale = st; render(); } else syncButtons(); });
  render();
  window.__P11 = { ask(t) { $('q').value = t; run(); }, state: () => S };
})();
</script>
