<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P11 智能提问 · SSPS 原型</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.p11{display:grid;grid-template-columns:minmax(0,1fr) 540px;gap:20px;align-items:start}
.hero{text-align:center;padding:26px 0 18px}
.hero small{color:#1677ff;font-weight:600;font-size:14px;letter-spacing:1px}
.hero h1{margin:6px 0 4px;font-size:38px;line-height:1.25;color:#17365d;letter-spacing:2px}
.hero p{margin:0;color:#5b6878;font-size:15px;display:flex;align-items:center;justify-content:center;gap:14px}
.hero p:before,.hero p:after{content:"";width:60px;height:1px;background:#c9d0d9}
.ask{border:1.5px solid #b7d8ff;box-shadow:0 2px 12px rgba(22,119,255,.10)}
.ask textarea{width:100%;border:0;outline:0;resize:none;min-height:104px;font-size:16px;line-height:1.7;padding:16px 18px;background:transparent;border-radius:12px 12px 0 0}
.ask-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f7faff;border-top:1px solid #e6eefb;border-radius:0 0 12px 12px}
.ask-bar .hint{flex:1;color:#98a4b3;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic{width:42px;height:42px;border-radius:50%;border:1px solid #d3d9e1;background:#fff;cursor:pointer;display:grid;place-items:center;position:relative;flex:none}
.mic svg{width:20px;height:20px;fill:#5b6878}
.mic:hover{border-color:var(--primary)}.mic:hover svg{fill:var(--primary)}
.mic.on{background:#ff4d4f;border-color:#ff4d4f}.mic.on svg{fill:#fff}
.mic.on:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,77,79,.45);animation:pulse 1.1s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
.wave{display:none;align-items:center;gap:3px;height:22px}
.wave.on{display:flex}
.wave i{width:3px;background:#ff4d4f;border-radius:2px;animation:w 0.9s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes w{0%,100%{height:5px}50%{height:20px}}
.send{border:0;background:#1677ff;color:#fff;border-radius:8px;padding:0 26px;height:42px;font-weight:600;font-size:15px;cursor:pointer;flex:none;box-shadow:0 2px 6px rgba(22,119,255,.35)}
.send:active{background:#0958d9}
.card .ch{padding:12px 18px 4px;font-weight:600;color:#0a7a52;display:flex;align-items:center;gap:6px}
.card .ch.blue{color:#0958d9}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 18px 14px}
.pc{display:inline-flex;align-items:center;gap:6px;border-radius:18px;background:#f2f6fb;padding:4px 14px;font-size:14px;white-space:nowrap}
.pc b{color:#0958d9}
.pc .k{color:#3b4a5c;font-weight:600}
.pc.miss{background:#fff;border:1px dashed #c4cad3;color:#98a4b3}
.pc.warn{background:#fff7e6;color:#ad4e00}
.alts{padding:0 18px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:#6b7a8c}
.chipf{border:1px solid var(--line);background:#fff;border-radius:14px;padding:1px 12px;cursor:pointer;font-size:13px;color:#3b4a5c;white-space:nowrap}
.chipf:hover{border-color:var(--primary);color:var(--primary)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 16px;padding:6px 18px 4px}
.facts .k{font-size:12px;color:var(--muted);white-space:nowrap}
.facts .v{font-size:18px;font-weight:700;white-space:nowrap}
.facts .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.lvl{display:inline-block;border-radius:4px;padding:0 8px;font-size:12px;line-height:20px;font-weight:600;vertical-align:2px;margin-left:6px}
.lvl.ok{background:#f6ffed;color:#237804;border:1px solid #b7eb8f}.lvl.mid{background:#fff7e6;color:#ad4e00;border:1px solid #ffd591}.lvl.bad{background:#fff1f0;color:#a8071a;border:1px solid #ffa39e}
.notebox{margin:4px 18px 12px;border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.7}
.notebox.red{background:#fff1f0;border:1px solid #ffa39e;color:#a8071a}
.notebox.amb{background:#fff7e6;border:1px solid #ffd591;color:#ad4e00}
.notebox.blu{background:#f0f7ff;border:1px solid #b7d8ff;color:#0958d9}
.gobar{display:flex;align-items:center;gap:12px;padding:14px 4px 4px;flex-wrap:wrap}
.gobar .btn.primary{padding:9px 30px;font-size:15px;font-weight:600}
.gobar .sm{color:var(--muted);font-size:12.5px}
.quick{margin-top:18px}
.quick h3{margin:0 0 8px;font-size:14px;color:#6b7a8c;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line)}
.quick .chipf{border-radius:20px;padding:6px 16px;font-size:14px;color:#4a596b;background:#fff}
.qwrap{display:flex;flex-wrap:wrap;gap:10px}
/* 右侧库存面板 */
.inv h2{margin:0;font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inv .lg{display:flex;gap:12px;font-size:12.5px;color:#4a596b;flex-wrap:wrap;margin-top:6px}
.inv .lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.inv .up{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 16px 0;color:var(--faint);font-size:12px;flex-wrap:wrap}
.inv .grp{padding:10px 16px 6px}
.inv .gt{font-weight:700;font-size:13px;margin:6px 0 4px;color:#1f2d3d}
.invgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.ir{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;min-width:0}
.ir:hover{background:#f2f6fb}
.ir i{width:9px;height:9px;border-radius:50%;flex:none}
.ir span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir b{font-size:12.5px;border-radius:6px;padding:0 8px;line-height:22px;flex:none}
.ir.ok i{background:#52c41a}.ir.ok b{background:#f6ffed;color:#389e0d}
.ir.mid i{background:#fa8c16}.ir.mid b{background:#fff7e6;color:#d46b08}
.ir.bad i{background:#ff4d4f}.ir.bad b{background:#fff1f0;color:#cf1322}
.ir.sel{background:#e6f4ff}
.imp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px 14px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.imp .btn{padding:3px 12px}
.sample{background:#fffbe6;border:1px solid #ffe58f;color:#ad6800;border-radius:6px;padding:0 8px;font-size:12px;line-height:20px;white-space:nowrap}
@media(max-width:1200px){.p11{grid-template-columns:1fr}.invgrid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.hero h1{font-size:28px}.hero p:before,.hero p:after{display:none}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.invgrid{grid-template-columns:1fr}.ask-bar .hint{display:none}}
</style>
</head>
<body>
<div class="app"><aside id="nav"></aside>
  <div class="main"><header id="topbar"></header>
    <main class="page">
      <div class="p11">
        <section>
          <div class="hero"><small>智慧发船预测系统</small><h1>智能发船助手</h1><p>发船方案 · 库存预警 · 港口容量</p></div>
          <div class="card ask">
            <textarea id="q" placeholder="像说话一样描述需求，比如：烧结石灰石 秦皇岛→德信 5万吨 12月10日前到港"></textarea>
            <div class="ask-bar"><span class="hint" id="hint">按 Enter 发送，Shift+Enter 换行</span><span class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></span>
              <button class="mic" id="mic" aria-label="语音输入" title="语音输入"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg></button>
              <button class="send" id="send">发送</button></div>
          </div>
          <div id="parsed"></div>
          <div id="stock"></div>
          <div class="quick"><h3>快捷提问</h3><div class="qwrap" id="quick"></div></div>
        </section>
        <aside class="card inv" id="inv"></aside>
      </div>
    </main>
  </div>
</div>
<script src="mock-data.js"></script><script src="engine.js"></script><script src="assets/shell.js"></script><script src="assets/common.js"></script><script src="assets/nlp.js"></script><script src="assets/stock-chart.js"></script>
<script>
(function () {
  SHELL.mount({ active: 'P11', title: '智能提问' });
  const M = window.MOCK, E = window.ENGINE, C = window.C, N = window.NLP, $ = (id) => document.getElementById(id);
  const fmt = C.fmt, T = E.TODAY, md = (n) => E.md(n), mdCn = (n) => C.mdCn(E.iso(n)), wk = (n) => C.wk(E.iso(n));
  const EXAMPLES = ['烧结石灰石 秦皇岛→德信 5万吨 2026年12月10日前', '废钢 新村港→德信 1万吨 11月28日前', '高硅块 唐山→德信 3万吨 11月30日前', '成品线材2.8万吨，11月8日到20日装船，发海防', '备件船8000吨从雅加达来，下周到港'];
  let S = { text: '', ov: {}, parsed: null, buf: (M.inventory && M.inventory.bufferDays) || 3 };
  const lvl = (d) => (d >= 25 ? ['ok', '充裕'] : d >= 15 ? ['mid', '偏紧'] : ['bad', '危险']);

  // ---------- 右侧：库存可用天数分析 ----------
  function drawInv() {
    const I = M.inventory, sel = S.parsed && S.parsed.item ? S.parsed.item.name : '';
    const grp = (type) => { const L = I.items.filter((i) => i.type === type).sort((a, b) => a.days - b.days);
      return '<div><div class="gt">' + type + '</div>' + L.map((i) => { const l = lvl(i.days); return '<div class="ir ' + l[0] + (i.name === sel ? ' sel' : '') + '" data-n="' + C.esc(i.name) + '"' + C.tipAttr(i.name + '\n当前库存 ' + fmt(i.stock) + ' 吨 · 日耗 ' + fmt(i.daily) + ' 吨\n' + (i.stockout ? '断料日 ' + C.mdCn(E.iso(i.stockout)) + '（距今 ' + (i.stockout - T) + ' 天）' : '模拟期内不断料') + '\n点击带入提问') + '><i></i><span>' + i.name + '</span><b>' + i.days + '天</b></div>'; }).join('') + '</div>'; };
    $('inv').innerHTML = '<div class="grp"><h2>库存可用天数分析' + C.ic('按库存消耗模拟表计算：可用天数 = 当前库存 ÷ 日耗。模拟库存已经包含已排定的到货，所以「断料日」就是模拟库存降到 0 的那一天，也就是断料计划。点击某个物料可以带入提问。') + '</h2>' +
      '<div class="lg"><span><i style="background:#52c41a"></i>充裕（>25天）</span><span><i style="background:#fa8c16"></i>偏紧（15–25天）</span><span><i style="background:#ff4d4f"></i>危险（&lt;15天）</span></div></div>' +
      '<div class="up"><span>更新于 ' + I.updated + '</span>' + (I.sample ? '<span class="sample">示例数据（数值虚构）</span>' : '<span class="sample" style="background:#f6ffed;border-color:#b7eb8f;color:#237804">已导入：' + C.esc(I.source.replace('导入：', '')) + '</span>') + '</div>' +
      '<div class="grp"><div class="invgrid">' + grp('焦煤') + grp('铁矿') + '</div>' + grp('辅料').replace('<div><div class="gt">', '<div style="margin-top:6px"><div class="gt">') + '</div>' +
      '<div class="imp"><button class="btn" id="imp">导入库存消耗模拟表</button><input type="file" id="file" accept=".xlsx,.xls" hidden>' + (I.sample ? '' : '<button class="btn" id="rst">恢复示例数据</button>') + '<span>文件只在你的浏览器里解析，不上传、不保存到仓库。</span></div>';
    $('inv').querySelectorAll('.ir').forEach((r) => r.onclick = () => { const n = r.dataset.n, it = I.items.find((x) => x.name === n); const route = it.type === '辅料' ? '新村港' : '秦皇岛'; $('q').value = n.replace('总库存', '') + ' ' + route + '→德信 5万吨'; run(); $('parsed').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); });
    $('imp').onclick = () => $('file').click(); $('file').onchange = (e) => { if (e.target.files[0]) importFile(e.target.files[0]); };
    const rs = $('rst'); if (rs) rs.onclick = () => { try { sessionStorage.removeItem('ssps-inventory'); } catch (e) { /* ignore */ } location.reload(); };
  }

  // ---------- 解析与展示 ----------
  const chip = (k, v, cls) => '<span class="pc' + (cls ? ' ' + cls : '') + '"><span class="k">' + k + '</span>' + v + '</span>';
  function render() {
    const p = S.parsed; if (!p) { $('parsed').innerHTML = ''; $('stock').innerHTML = ''; return; }
    let h = '<div class="card" style="margin-top:14px"><div class="ch">解析结果' + C.ic('系统按关键词判断是大宗采购船、成品销售船还是物资备件船，并识别物料、货量、航线和到港截止日。数值由规则引擎计算，不经过生成式模型改写。') + '</div><div class="chips">';
    h += p.biz ? chip('船型', '<b>' + p.biz + '</b>') : chip('船型', '待确认', 'miss');
    if (p.item) h += chip('物料', '<b>' + p.item.name.replace('总库存', '（' + p.item.type + '总库存）') + '</b>'); else if (p.biz === '大宗采购船') h += chip('物料', '未识别（只按港口容量预测）', 'warn');
    h += p.tons ? chip('货量', '<b>' + fmt(p.tons) + '吨</b>') : chip('货量', '待补充', 'miss');
    const zh = (en) => C.zh(en);
    h += p.biz === '成品销售船' ? chip('航线', '<b>' + (p.disch ? '本港装货 → ' + zh(p.disch) : '待补充客户港') + '</b>', p.disch ? '' : 'miss') : chip('航线', p.load ? '<b>' + zh(p.load) + ' → 德信</b>' : '装港待补充（默认秦皇岛）', p.load ? '' : 'warn');
    h += p.userDeadline && p.b ? chip(p.biz === '成品销售船' ? '装船' : '到港截止', '<b>' + (p.range && p.a > T ? md(p.a) + ' – ' : '') + mdCn(p.b) + '</b>') : chip('到港截止', p.item ? '未说明，按库存自动推算' : '未说明，默认看未来 15 天', 'miss');
    h += '</div>';
    if (!p.biz) h += '<div class="alts">这是哪种船？' + ['大宗采购船', '成品销售船', '物资备件船'].map((b) => '<button class="chipf" data-biz="' + b + '">' + b + '</button>').join('') + '</div>';
    if (p.biz && !p.tons) h += '<div class="alts">还差一个货量，点选或在上面补一句：' + [20000, 30000, 50000, 70000].map((n) => '<button class="chipf" data-tons="' + n + '">' + n / 10000 + ' 万吨</button>').join('') + '</div>';
    if (p.ambiguous && p.alt.length) h += '<div class="alts">也可能是：' + p.alt.map((i) => '<button class="chipf" data-item="' + C.esc(i.name) + '">' + i.name + '</button>').join('') + '</div>';
    if (p.outside) h += '<div class="notebox red">时间超出范围，只能看未来 60 天。</div>';
    $('parsed').innerHTML = h + '</div>';
    $('parsed').querySelectorAll('[data-biz]').forEach((b) => b.onclick = () => { S.ov.biz = b.dataset.biz; run(true); });
    $('parsed').querySelectorAll('[data-tons]').forEach((b) => b.onclick = () => { S.ov.tons = +b.dataset.tons; run(true); });
    $('parsed').querySelectorAll('[data-item]').forEach((b) => b.onclick = () => { S.ov.item = M.inventory.items.find((x) => x.name === b.dataset.item); run(true); });
    drawStock(); drawInv();
  }
  const ready = () => S.parsed && S.parsed.biz && S.parsed.tons && !S.parsed.outside;
  function drawStock() {
    const p = S.parsed, el = $('stock'); let h = '';
    if (p.item) {
      const it = p.item, so = E.stockout(it), buf = S.buf, latest = so != null ? so - buf : null, d = it.days, l = lvl(d);
      const gap = latest != null ? Math.max(0, latest - T) : null;
      h += '<div class="card" style="margin-top:14px"><div class="ch blue">库存保障 · ' + it.name + '<span class="lvl ' + l[0] + '">' + l[1] + '</span>' + C.ic('库存曲线按日耗下降，已排定的到货会让它回升。降到 0 的那一天是断料日。新到的船必须在「断料日 − 缓冲天数」之前到港，否则按断料处理。') + '</div>' +
        '<div class="facts"><div><div class="k">当前库存</div><div class="v">' + fmt(it.stock) + '<small>吨</small></div></div><div><div class="k">日耗</div><div class="v">' + fmt(it.daily) + '<small>吨/天</small></div></div>' +
        '<div><div class="k">可用天数</div><div class="v">' + d + '<small>天</small></div></div><div><div class="k">断料日</div><div class="v">' + (so != null ? mdCn(so) : '不断料') + '<small>' + (so != null ? (so - T <= 0 ? '已断料' : '距今 ' + (so - T) + ' 天') : '') + '</small></div></div></div>';
      h += '<div class="facts" style="padding-top:4px"><div><div class="k">到港后缓冲' + C.ic('船到港后还要靠泊、卸货、入库，所以要提前留几天。原型默认 3 天，待确认。') + '</div><div class="v"><select class="inp" id="buf" style="width:92px;height:28px;padding:0 6px;font-weight:600">' + [0, 1, 2, 3, 4, 5, 7].map((n) => '<option value="' + n + '"' + (n === buf ? ' selected' : '') + '>' + n + ' 天</option>').join('') + '</select></div></div>' +
        '<div><div class="k">最晚到港日</div><div class="v">' + (latest != null ? mdCn(latest) : '—') + '<small>' + (latest != null ? (latest < T ? '已错过' : '距今 ' + (latest - T) + ' 天') : '') + '</small></div></div>' +
        (p.userDeadline && p.b ? '<div><div class="k">你给的截止日</div><div class="v">' + mdCn(p.b) + '</div></div>' : '') + '</div>';
      h += '<div style="padding:0 12px 6px">' + window.StockChart.html(it, { latest, warnDays: 15, width: Math.max(300, ($('stock').clientWidth || 760) - 28) }) + '</div>';
      if (so != null && so <= T) h += '<div class="notebox red">这个物料已经断料。预测会切换为「最快到港」，并如实提示断料天数；同时请联系供应商或调拨。</div>';
      else if (latest != null && latest - T < 14) h += '<div class="notebox amb">按秦皇岛、唐山这类航线的航程（约 11～14 天），距最晚到港日只剩 ' + Math.max(0, latest - T) + ' 天，<b>可能已经赶不上</b>。生成预测后会给出最快能到的日期和断料天数。</div>';
      else if (so == null) h += '<div class="notebox blu">模拟期内这个物料不会断料，预测只按港口容量安排。</div>';
      else h += '<div class="notebox blu">预测会保证到港窗口落在最晚到港日（' + mdCn(latest) + '）之前，在此范围内选港口最宽松的时间。</div>';
      h += '</div>';
    } else if (p.biz === '大宗采购船') {
      h += '<div class="notebox amb" style="margin:14px 0 0">没有找到这个物料的库存消耗数据，所以这次预测<b>只按港口容量</b>，不考虑断料。可以从右侧点选物料，或把品名说得更具体些。</div>';
    }
    h += '<div class="gobar"><button class="btn primary" id="go"' + (ready() ? '' : ' disabled') + '>生成预测</button><span class="sm">' + (ready() ? '下一页会给出推荐方案和备选方案' + (p.item ? '，并保证不断料' : '') : '还缺少船型或货量') + '</span></div>';
    el.innerHTML = h;
    const b = $('buf'); if (b) b.onchange = (e) => { S.buf = +e.target.value; drawStock(); };
    const g = $('go'); if (g && !g.disabled) g.onclick = go;
  }
  function go() {
    const p = S.parsed, it = p.item, prod = p.biz === '成品销售船';
    const so = it ? E.stockout(it) : null, latest = so != null ? so - S.buf : null;
    let we = p.userDeadline && p.b ? p.b : (it ? (latest != null ? Math.max(latest, T) : T + 30) : T + 15);
    let ws = p.a; if (we < ws) ws = Math.min(ws, T);
    const q = { biz: p.biz, tons: p.tons, load: prod ? 'BAHODOPI' : (p.load || 'QINHUANGDAO'), disch: prod ? (p.disch || 'HAIPHONG') : 'BAHODOPI', ws: E.iso(ws), we: E.iso(we) };
    if (it) { q.item = it.name; q.buf = S.buf; q.pb = 'end'; }
    location.href = 'P02-prediction.html?' + new URLSearchParams(q);
  }
  function run(keep) {
    const text = $('q').value.trim(); if (!text) { C.toast('先说一句话，或点右侧的物料'); return; }
    if (!keep) S.ov = {};
    S.text = text; S.parsed = N.parse(text, S.ov); render();
  }

  // ---------- 语音输入 ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null, on = false, timer = null;
  const setOn = (v) => { on = v; $('mic').classList.toggle('on', v); $('wave').classList.toggle('on', v); $('hint').textContent = v ? '正在听，请直接说出需求…再点一次麦克风结束' : '按 Enter 发送，Shift+Enter 换行'; };
  function demoVoice(why) {
    setOn(true); if (why) C.toast(why);
    const say = EXAMPLES[0], q = $('q'); q.value = ''; let i = 0; clearInterval(timer);
    timer = setInterval(() => { q.value = say.slice(0, ++i); if (i >= say.length) { clearInterval(timer); setTimeout(() => { setOn(false); run(); }, 400); } }, 70);
  }
  $('mic').onclick = () => {
    if (on) { if (rec) { try { rec.stop(); } catch (e) { /* ignore */ } } clearInterval(timer); setOn(false); if ($('q').value.trim()) run(); return; }
    if (!SR) { demoVoice('这个浏览器不支持语音识别，已改为演示：模拟说出一句话'); return; }
    try {
      rec = new SR(); rec.lang = 'zh-CN'; rec.interimResults = true; rec.continuous = false;
      rec.onresult = (e) => { $('q').value = [...e.results].map((r) => r[0].transcript).join(''); };
      rec.onerror = (e) => { setOn(false); demoVoice('没有拿到麦克风权限或网络，已改为演示'); };
      rec.onend = () => { if (on) { setOn(false); if ($('q').value.trim()) run(); } };
      rec.start(); setOn(true);
    } catch (e) { demoVoice('语音识别启动失败，已改为演示'); }
  };

  // ---------- 导入真实的库存消耗模拟表（只在本机浏览器解析） ----------
  const loadXlsx = () => new Promise((res, rej) => { if (window.XLSX) return res(window.XLSX); const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('解析库加载失败，请检查网络')); document.head.appendChild(s); });
  const dayOf = (v) => { if (v == null || v === '') return NaN; if (v instanceof Date) return Math.round(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()) / 86400000); if (typeof v === 'number') return Math.round(v - 25569); const m = String(v).match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/); return m ? Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000) : NaN; };
  const numOf = (v) => { const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : NaN; };
  async function importFile(file) {
    try {
      C.toast('正在解析…'); const X = await loadXlsx(); const wb = X.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
      const rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null });
      if (!rows.length || !('品名' in rows[0]) || !('库存' in rows[0])) { C.toast('不是库存消耗模拟表：找不到「品名」「库存」列'); return; }
      const by = new Map(); let bad = 0, imp = '';
      rows.forEach((r) => { const d = dayOf(r['库存日期']), s = numOf(r['库存']), dl = numOf(r['日耗']); if (r['导入日期'] && !imp) imp = String(r['导入日期'] instanceof Date ? r['导入日期'].toISOString().slice(0, 10) : r['导入日期']).replace(/\//g, '-');
        if (!isFinite(d) || !isFinite(s)) { bad++; return; } const k = r['品名']; if (!by.has(k)) by.set(k, { type: r['物料类型'] || '其他', name: k, rows: [] }); by.get(k).rows.push([d, s, isFinite(dl) ? dl : null, numOf(r['可用天数'])]); });
      const items = [...by.values()].map((g) => { g.rows.sort((a, b) => a[0] - b[0]); let lastDl = (g.rows.find((x) => x[2]) || [0, 0, 1])[2] || 1;
        const series = g.rows.map((x) => { if (x[2]) lastDl = x[2]; return [x[0], x[1], x[2] || lastDl]; });
        const at = series.find((x) => x[0] >= T) || series[0], first0 = series.find((x) => x[0] >= T && x[1] <= 0);
        const days = isFinite(g.rows.find((x) => x[0] === at[0])[3]) ? Math.floor(g.rows.find((x) => x[0] === at[0])[3]) : Math.floor(at[1] / at[2]);
        return { type: g.type, name: g.name, stock: at[1], daily: at[2], days, series, stockout: first0 ? first0[0] : null, arrivals: [] }; });
      M.inventory = { updated: (imp || M.today) + ' 导入', source: '导入：' + file.name, sample: false, warnDays: 15, safeDays: 25, bufferDays: 3, items };
      try { sessionStorage.setItem('ssps-inventory', JSON.stringify(M.inventory)); } catch (e) { C.toast('已导入，但浏览器存不下，翻页后会恢复示例数据'); }
      C.toast('已导入 ' + items.length + ' 个物料' + (bad ? '，忽略 ' + bad + ' 行错误值' : '') + '；文件没有上传'); S.parsed = null; render(); drawInv();
    } catch (e) { C.toast(e.message || '导入失败'); }
  }

  $('quick').innerHTML = EXAMPLES.map((x, i) => '<button class="chipf" data-i="' + i + '">' + x + '</button>').join('');
  $('quick').onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) { $('q').value = EXAMPLES[+b.dataset.i]; run(); } };
  $('send').onclick = () => run();
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); run(); } });
  drawInv();
  window.__P11 = { ask(t) { $('q').value = t; run(); }, state: () => S };
})();
</script>
