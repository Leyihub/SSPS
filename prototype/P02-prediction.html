<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>P02 智能发船预测 · SSPS 原型</title>
<link rel="stylesheet" href="assets/app.css">
<style>
/* —— 整体：所有短文本一律不换行，放不下就整块换到下一行，而不是在文字中间断开 —— */
.nw{white-space:nowrap}
.work{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
/* 示例场景 */
.pbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:8px;padding:10px 16px 12px}
.preset{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fafbfc;padding:6px 10px;cursor:pointer;text-align:left;min-width:0}
.preset:hover{border-color:var(--primary);background:#f5faff}
.preset.on{border-color:var(--primary);background:var(--primary-bg)}
.preset .no{flex:none;width:18px;height:18px;border-radius:50%;background:#26394f;color:#fff;font-size:11px;display:grid;place-items:center}
.preset b{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 灰色提示图标：悬停显示浮窗 */
.i{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#c9d0d9;color:#fff;font:600 10px/1 Georgia,serif;font-style:italic;cursor:help;vertical-align:1px;margin-left:5px;flex:none;user-select:none}
.i:hover{background:#8a97a8}
#tipbox{position:fixed;z-index:400;background:#1f2d3d;color:#fff;border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.7;max-width:320px;box-shadow:0 8px 24px rgba(16,24,40,.3);display:none;pointer-events:none}
/* 左：输入 */
.f-lab{display:flex;align-items:center;margin-bottom:4px;color:var(--muted);font-size:12px;white-space:nowrap}
.field{margin-bottom:12px}
.lockedv{display:flex;align-items:center;gap:6px;height:32px;border:1px dashed #c4cad3;border-radius:6px;padding:0 9px;background:#f7f8fa;color:var(--muted);white-space:nowrap}
.mini{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;white-space:nowrap}
.pathbox{border-radius:8px;padding:6px 10px;margin:2px 0 12px;border:1px solid;font-size:12.5px;display:flex;align-items:center;white-space:nowrap}
.pathbox.le{background:#f0f7ff;border-color:#b7d8ff;color:#0958d9}.pathbox.gt{background:#f9f0ff;border-color:#d3adf7;color:#531dab}
/* 右：结果概览 */
.sum{padding:12px 16px}
.sum-t{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sum-t h2{margin:0;font-size:15px;white-space:nowrap}
.sum-t span{color:var(--muted);white-space:nowrap}
.sum-m{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;color:#3b4a5c}
.sum-m .sp{flex:1}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px}
.cands .ct{width:100%;color:var(--muted);font-size:12.5px;white-space:nowrap}
.cand{display:inline-flex;gap:5px;align-items:center;border:1px solid;border-radius:6px;padding:1px 8px;line-height:20px;white-space:nowrap}
.cand i{font-style:normal;font-weight:600;color:#fff;background:var(--primary);border-radius:3px;padding:0 5px;font-size:11px}
.cand i.b{background:#08979c}
.cand.sp{border-style:dashed}
.link{border:0;background:none;color:var(--primary);cursor:pointer;padding:0;font-size:13px;white-space:nowrap}
/* 方案卡片 */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(580px,1fr));gap:16px;margin-top:16px}
.plan{position:relative;overflow:hidden;min-width:0}
.plan:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--primary)}
.plan.B:before{background:#08979c}
.plan.low{border:1.5px dashed #ff9c6e}
.plan.empty{border:1.5px dashed #c4cad3;background:repeating-linear-gradient(135deg,#fbfbfc 0,#fbfbfc 8px,#f2f3f5 8px,#f2f3f5 9px)}
.plan-h{display:flex;align-items:center;gap:8px;padding:16px 16px 4px;white-space:nowrap}
.plan-h h3{margin:0;font-size:17px}
.plan-h .sp{flex:1}
.plan-h .muted{font-size:12px;display:flex;align-items:center}
.mgrid{display:grid;grid-template-columns:1.25fr 1.2fr 1.1fr;gap:14px;padding:8px 16px 4px}
.m{min-width:0}
.m .lb{font-size:12px;color:var(--muted);display:flex;align-items:center;white-space:nowrap}
.m .v{font-size:20px;font-weight:700;margin:2px 0;white-space:nowrap}
.m .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{display:inline-flex;align-items:baseline;gap:6px;border:1px solid;border-radius:8px;padding:1px 12px;margin:2px 0;white-space:nowrap}
.big b{font-size:22px;line-height:1.35}.big span{font-size:12px}
.days{display:flex;flex-wrap:wrap;gap:5px;padding:8px 16px 0}
.day{border:1px solid;border-radius:5px;padding:0 7px;font-size:12px;line-height:20px;white-space:nowrap}
.kvs{padding:8px 16px 0;display:grid;gap:6px;font-size:13px}
.kvs .r{display:flex;gap:4px 8px;align-items:center;white-space:nowrap;flex-wrap:wrap}
.kvs .k{color:var(--muted);font-size:12px;width:76px;flex:none}
.plan-f{display:flex;gap:8px;padding:14px 16px 14px;align-items:center;white-space:nowrap}
.plan-f .sp{flex:1}
.plan-f .grey{color:var(--faint);font-size:12px;display:flex;align-items:center}
.plan-f .btn{white-space:nowrap}
.badge{border-radius:4px;color:#fff;padding:0 7px;font-size:12px;line-height:20px;background:var(--primary)}
.emptymsg{padding:14px 16px 20px;color:var(--muted)}
.emptymsg b{display:block;font-size:15px;margin-bottom:2px;color:var(--text)}
.banner{margin-top:16px;padding:20px 22px;display:flex;gap:16px;align-items:center}
.banner .ico{flex:none;width:56px;height:56px;border-radius:12px;background:var(--stripe);border:1px solid #c4cad3}
.banner.err .ico{background:#fff1f0;border-color:#ffa39e;display:grid;place-items:center;font-size:26px;color:#cf1322}
.banner h3{margin:0 0 2px;font-size:16px}.banner p{margin:0;color:var(--muted)}
/* 日历 */
.cal{display:grid;grid-template-columns:88px repeat(30,minmax(0,1fr));gap:3px;padding:12px 16px 4px;align-items:stretch}
.cal .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;white-space:nowrap}
.cal .band{border-radius:6px 6px 0 0;padding:4px 8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .band.le{background:#e6f1ff;color:#0958d9;border-bottom:2px solid #1677ff}
.cal .band.gt{background:#f4ebff;color:#531dab;border-bottom:2px solid #9254de}
.cal .dh{text-align:center;font-size:11.5px;line-height:1.25;padding:2px 0;white-space:nowrap}
.cal .dh b{display:block;font-size:12px}
.cal .dh.today b{color:var(--primary)}.cal .dh.wkend{color:#cf1322}
.cal .dh.split,.cal .cell.split{box-shadow:-2px 0 0 #9254de}
.cell{height:50px;border:1px solid;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;position:relative;cursor:pointer;white-space:nowrap;overflow:hidden}
.cell.sel{outline:2.5px solid #26394f;outline-offset:1px;z-index:3}
.cell b{font-size:13px;line-height:1}
.cell .bar{display:block;width:70%;height:4px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden}
.cell .bar i{display:block;height:100%;background:currentColor;opacity:.75}
.cell .dg{display:flex;gap:1px;width:74%;height:4px}
.cell .dg i{flex:1;border-radius:1px;background:rgba(0,0,0,.12)}.cell .dg i.on{background:currentColor;opacity:.8}
.cell.nd i{font-style:normal;font-size:10px;color:#7b8696;background:rgba(255,255,255,.85);padding:0 3px;border-radius:3px}
.cell:hover{outline:2px solid var(--primary);z-index:2}
.mk{height:20px;border-radius:4px;font-size:11px;display:flex;align-items:center;padding:0 6px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk.w{background:#d0d7e2;color:#44546a}.mk.a{background:var(--primary)}.mk.b{background:#08979c}
.mk.low{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0,rgba(255,255,255,.28) 4px,transparent 4px,transparent 8px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:8px 16px 14px;font-size:12px;color:var(--muted)}
.legend .g{display:flex;align-items:center;gap:5px;white-space:nowrap}
.sw{display:inline-block;min-width:34px;padding:0 5px;text-align:center;border:1px solid;border-radius:4px;font-size:10.5px;line-height:16px;white-space:nowrap}
@media(max-width:1700px){.bt{width:50px}.cell.nd i{font-size:9px;padding:0 1px}.cell{font-size:11px}.mk .lt{display:none}}
/* 泊位一览 */
.bm{border-top:1px solid var(--line-2);padding:12px 16px 16px}
.bm-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bm-h b{font-size:14px;white-space:nowrap}
.bm-h .sp{flex:1}
.bm-h .faint{font-size:12px;white-space:nowrap}
.bm-g{display:flex;flex-wrap:wrap;gap:14px 28px}
.bm-t{font-size:12px;color:var(--muted);margin-bottom:5px;white-space:nowrap}
.bm-r{display:flex;gap:6px}
.bt{width:54px;height:46px;border:1px solid;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;cursor:help;flex:none;white-space:nowrap}
.bt b{font-size:13px}.bt small{font-size:11px;opacity:.85}
.bt.free{background:var(--c1-bg);color:var(--c1-fg);border-color:var(--c1-bd)}
.bt.occ{background:var(--c3-bg);color:var(--c3-fg);border-color:var(--c3-bd)}
.bt.cap{background:#e6f4ff;color:#0958d9;border-color:#91caff}
.bt.nd{background:var(--stripe);color:#5b6878;border-color:#c4cad3}
.bt.off{background:#eef0f3;color:#a7b0bc;border-color:#dfe3e8}
.bt:hover{outline:2px solid var(--primary);z-index:2}
.bm-l{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:12px;color:var(--muted)}
.bm-l .g{display:flex;align-items:center;gap:5px;white-space:nowrap}
.bm-l .sw{min-width:26px}
/* 弹窗 */
.annc{background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:2;font-size:13.5px}
.annc .v{background:#e6f4ff;color:#0958d9;border-radius:3px;padding:0 3px;font-weight:600}
.radio{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
.radio.on{border-color:var(--primary);background:var(--primary-bg)}
</style>
</head>
<body>
<div class="app">
  <aside id="nav"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main class="page">
      <div class="page-head">
        <div>
          <h1>智能发船预测</h1>
          <p>回答三件事：几号发船、哪几天到港、到港时泊位够不够。每次给出一个推荐方案和一个备选方案。</p>
        </div>
      </div>

      <section class="card" style="margin-bottom:16px">
        <div class="card-h" style="padding:8px 16px"><h2 class="nw">示例场景<span class="i" data-tip="评审用：点击即填入并预测。覆盖三类船、两条计算路径、数据不完整、完全无数据、缺航程等情形。">i</span></h2></div>
        <div class="pbar" id="presets"></div>
      </section>

      <div class="work">
        <section class="card">
          <div class="card-h"><h2>预测输入</h2></div>
          <div class="card-b">
            <div class="field"><div class="f-lab">业务类型</div><div class="seg" id="biz"></div></div>
            <div class="field"><div class="f-lab">货量（吨）</div>
              <input class="inp" id="tons" type="number" min="1000" step="1000">
              <div class="mini" id="poolHint"></div></div>
            <div class="row2">
              <div class="field"><div class="f-lab">装港</div><div id="loadBox"></div></div>
              <div class="field"><div class="f-lab">卸港</div><div id="dischBox"></div></div>
            </div>
            <div class="field"><div class="f-lab" id="winLabel">期望到港窗口</div>
              <div class="row2"><input class="inp" id="ws" type="date"><input class="inp" id="we" type="date"></div>
              <div class="err" id="formErr"></div></div>
            <div class="pathbox le" id="pathbox"></div>
            <div style="display:flex;gap:8px"><button class="btn primary lg" id="go" style="flex:1">预测</button><button class="btn lg" id="reset">重置</button></div>
          </div>
        </section>
        <section id="result"></section>
      </div>

      <section class="card" style="margin-top:16px">
        <div class="card-h"><h2 class="nw">未来 30 天港口容量<span class="i" data-tip="泊位余量率是唯一的容量指标：空闲泊位 ÷ 能装下该货量的泊位总数，越高越宽松。\n30% 是备选方案的底线；其余色阶分界为原型暂定值。\n灰色斜线表示暂无数据，不是 0%。">i</span></h2><span class="muted nw" id="calMeta"></span></div>
        <div class="cal" id="cal"></div>
        <div class="legend" id="legend"></div>
        <div class="bm" id="bm"></div>
      </section>
    </main>
  </div>
</div>

<div class="mask" id="mAdopt"><div class="modal">
  <div class="modal-h"><span id="adoptTitle">采纳方案</span><button data-close>×</button></div>
  <div class="modal-b" id="adoptBody"></div>
  <div class="modal-f"><button class="btn" data-close>取消</button><button class="btn primary" id="adoptOk">确认采纳</button></div>
</div></div>
<div class="mask" id="mAnnc"><div class="modal">
  <div class="modal-h"><span id="anncTitle">宣船文案</span><button data-close>×</button></div>
  <div class="modal-b">
    <div class="annc" id="anncText"></div>
    <div class="mini" style="margin-top:8px;white-space:normal">蓝色底的数字由规则计算得出，只读、不会被改写。</div>
  </div>
  <div class="modal-f"><button class="btn" data-close>关闭</button><button class="btn primary" id="anncCopy">一键复制</button></div>
</div></div>
<div class="toast" id="toast"></div>
<div id="tipbox"></div>

<script src="mock-data.js"></script>
<script src="engine.js"></script>
<script src="assets/shell.js"></script>
<script>
(function () {
  SHELL.mount({ active: 'P02', title: '智能发船预测' });
  const M = window.MOCK, E = window.ENGINE, $ = (id) => document.getElementById(id);
  const BIZ = ['大宗采购船', '成品销售船', '物资备件船'], LOCAL = 'BAHODOPI';
  const PRESETS = [
    { label: '大宗 · 近 15 天 · 数据完整', tip: '5 万吨，航程为经验估算，推荐和备选都数据完整。',
      v: { biz: '大宗采购船', tons: 50000, load: 'SURIGAO', disch: LOCAL, ws: '2026-11-08', we: '2026-11-18' } },
    { label: '大宗 · 15 天后 · 看同期船数', tip: '5 万吨，历史统计航程，只按同期船数判断，不算泊位余量。',
      v: { biz: '大宗采购船', tons: 50000, load: 'TAGANITO', disch: LOCAL, ws: '2026-11-24', we: '2026-12-02' } },
    { label: '备选方案数据不全（低可信）', tip: '窗口越过靠船计划覆盖期，备选方案只能从数据不全的时间里选。',
      v: { biz: '大宗采购船', tons: 50000, load: 'SURIGAO', disch: LOCAL, ws: '2026-11-12', we: '2026-11-23' } },
    { label: '成品销售船 · 按装港侧推算', tip: '2.8 万吨，受载期，到客户港的时间仅供参考。',
      v: { biz: '成品销售船', tons: 28000, load: LOCAL, disch: 'HAIPHONG', ws: '2026-11-08', we: '2026-11-20' } },
    { label: '物资备件船 · 借用大宗航程', tip: '0.8 万吨，航程取自大宗采购船的同一条航线。',
      v: { biz: '物资备件船', tons: 8000, load: 'JAKARTA', disch: LOCAL, ws: '2026-11-08', we: '2026-11-18' } },
    { label: '窗口内完全没有数据', tip: '灰色斜线，不是 0%，也不会改用另一条计算路径。',
      v: { biz: '大宗采购船', tons: 50000, load: 'SURIGAO', disch: LOCAL, ws: '2026-11-17', we: '2026-11-19' } },
    { label: '缺少这条航线的航程', tip: '泗水 → 巴浩多比 还没有维护航程。',
      v: { biz: '大宗采购船', tons: 30000, load: 'SURABAYA', disch: LOCAL, ws: '2026-11-10', we: '2026-11-18' } },
  ];
  let cur = 0, last = null, showCands = false, selDay = null, curTons = 50000;

  // ---------- 小工具 ----------
  const fmt = (n) => Number(n).toLocaleString('en-US');
  const pct = (x) => Math.round(x * 1000) / 10 + '%';
  const zh = (en) => { const p = M.ports.find((q) => q.en === en); return p ? p.cn.replace(/（.*?）/g, '') : (en || '未说明'); };
  const mdCn = (n) => { const [, m, d] = E.iso(n).split('-'); return Number(m) + '月' + Number(d) + '日'; };
  const dCn = (n) => Number(E.iso(n).slice(8)) + '日';
  const wk = (n) => '周' + E.wk(n);
  // CMR 色阶（沿用德龙版）：≥50% 充裕 / 30–50% 适中 / 10–30% 偏紧 / <10% 紧张
  const cmrCls = (v) => (v >= .5 ? 'c1' : v >= .3 ? 'c2' : v >= .1 ? 'c3' : 'c4');
  const cmrLab = (v) => (v >= .5 ? '充裕' : v >= .3 ? '适中' : v >= .1 ? '偏紧' : '紧张');
  const denCls = (c, n) => { const r = c / n; return r <= .5 ? 'c1' : r <= .7 ? 'c2' : r <= .9 ? 'c3' : 'c4'; };
  const denLab = (c, n) => { const r = c / n; return r <= .5 ? '宽松' : r <= .7 ? '适中' : r <= .9 ? '偏密' : '拥挤'; };
  const toast = (t) => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); };
  const TIPS = []; const ic = (text) => '<span class="i" data-k="' + (TIPS.push(text) - 1) + '">i</span>';

  // ---------- 浮窗 ----------
  const tb = $('tipbox');
  function showTip(el, e) {
    const t = el.dataset.k !== undefined ? TIPS[+el.dataset.k] : el.dataset.tip; if (!t) return;
    tb.innerHTML = String(t).replace(/\\n|\n/g, '<br>'); tb.style.display = 'block';
    const r = el.getBoundingClientRect(), w = tb.offsetWidth, h = tb.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8), y = r.bottom + 8;
    if (y + h > innerHeight - 8) y = r.top - h - 8;
    tb.style.left = x + 'px'; tb.style.top = y + 'px';
  }
  document.addEventListener('mouseover', (e) => { const el = e.target.closest('.i,[data-tip]'); if (el) showTip(el, e); });
  document.addEventListener('mouseout', (e) => { if (e.target.closest('.i,[data-tip]')) tb.style.display = 'none'; });
  document.addEventListener('click', (e) => { const el = e.target.closest('.i'); if (el) showTip(el, e); else tb.style.display = 'none'; });

  // ---------- 表单 ----------
  const portSelect = (id, exclude) => '<select class="inp" id="' + id + '">' + M.ports.filter((p) => p.en !== exclude).map((p) => '<option value="' + p.en + '">' + zh(p.en) + '</option>').join('') + '</select>';
  function drawBiz(sel) {
    $('biz').innerHTML = BIZ.map((b) => '<button data-b="' + b + '" class="nw ' + (b === sel ? 'on' : '') + '">' + b + '</button>').join('');
    $('biz').querySelectorAll('button').forEach((bt) => bt.onclick = () => { setBiz(bt.dataset.b); updateHints(); });
  }
  function setBiz(b, keep) {
    const prev = keep || {}; drawBiz(b);
    const prod = b === '成品销售船', lockBox = '<div class="lockedv"><span>🔒</span>巴浩多比<span class="faint">（本港）</span></div>';
    $('loadBox').innerHTML = prod ? lockBox : portSelect('load', LOCAL);
    $('dischBox').innerHTML = prod ? portSelect('disch', LOCAL) : lockBox;

  // ---------- 方案卡片 ----------

  }
  function routeRows(res) {
    const i = res.input, r = res.run.rule;
    if (i.biz === '成品销售船') return '';
    if (!r) return '<div class="r"><span class="k">航程口径</span><span class="tag gray">暂无</span><span class="muted">没有维护这条航线的航程</span></div>';

    const detail = emp ? '经验航程 <b>' + r.exp + '</b> / 上限 <b>' + r.expMax + '</b> 天 <span class="muted">· 样本 ' + r.samples + ' 条（&lt;5，未切统计值）</span>'
                       : 'P50 <b>' + r.p50 + '</b> / P80 <b>' + r.p80 + '</b> 天 <span class="muted">· 样本 ' + r.samples + ' 条</span>';
    const tipTxt = emp ? '经验航程是常见天数，上限是最长大概多久，分别相当于统计里的 P50、P80。\\n这条航线实际航次只有 ' + r.samples + ' 条，不足 5 条，暂用经验估算；累计到 5 条后自动改用历史统计。'
                       : 'P50：一半的船不超过这个天数；P80：八成的船不超过这个天数。统计自这条航线的 ' + r.samples + ' 条历史航次。';
    return '<div class="r"><span class="k">航程口径</span>' + tag + (res.run.borrowed ? '<span class="tag gray">借用大宗航线</span>' : '') + '<span>' + detail + '</span>' + ic(tipTxt) + '</div>';
  }
  function basisTip(res) {
    const r = res.run, P = res.pool, x = res.excluded, rule = r.rule, L = [];
    L.push(r.mode === 'cmr' ? '靠船计划：' + mdCn(E.dn(M.batch.planDate)) + '更新，覆盖到 ' + mdCn(E.planCoverTo) : '航次计划：覆盖到 ' + mdCn(E.voyHorizon));

    L.push('不计入：' + (r.mode === 'cmr' ? '非德信泊位的 ' + x.offPool + ' 条靠船记录' : '已取消航次 ' + x.cancelled + ' 条'));

  }
  function planCard(p, res, idx) {
    const P = res.pool, i = res.input, prod = i.biz === '成品销售船';

  function renderResult(res) {
    const el = $('result');

    });

    el.querySelectorAll('[data-annc]').forEach((b) => b.onclick = () => openAnnc(b.dataset.annc));
  }

  // ---------- 日历 ----------

    renderBerths(tons);
    $('legend').innerHTML =
      '<div class="g"><b style="color:var(--text)">近 15 天泊位余量</b><span class="sw c1">≥50%</span>充裕<span class="sw c2">30–50%</span>适中<span class="sw c3">10–30%</span>偏紧<span class="sw c4">&lt;10%</span>紧张</div>' +
      '<div class="g"><b style="color:var(--text)">15 天后同期船数</b><span class="sw c1">≤50%</span><span class="sw c2">≤70%</span><span class="sw c3">≤90%</span><span class="sw c4">&gt;90%</span>占能装下的泊位数</div>' +
      '<div class="g"><span class="sw nd">&nbsp;&nbsp;</span><b style="color:var(--text)">无数据</b>不是 0%</div>';
  }

  // ---------- 23 个泊位一览 ----------
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  const wan = (n) => (n / 10000) + ' 万吨';
  function renderBerths(tons) {
    const el = $('bm'), d = selDay; if (d == null) { el.innerHTML = ''; return; }
    const mode = E.modeOf(d), nodata = mode === 'cmr' && d > E.planCoverTo;
    const items = M.berths.map((b) => {
      const capable = b.status === '启用' && tons > 0 && b.capacity >= tons;
      const row = mode === 'cmr' && !nodata ? E.rows.find((r) => r.inPool && r.berth === b.code && r.s <= d && d <= r.e) : null;
      const state = !capable ? 'off' : mode === 'density' ? 'cap' : nodata ? 'nd' : row ? 'occ' : 'free';
      const L = ['<b>' + b.code + ' · ' + b.terminal + '</b>', '容量 ' + wan(b.capacity) + ' · ' + b.category + ' · ' + b.status, '依据：' + b.basis + (b.note ? '（' + b.note + '）' : ''),
        tons > 0 ? '本次货量 ' + fmt(tons) + ' 吨：' + (capable ? '能装下，计入余量基数' : '装不下，不计入余量基数') : '尚未填写货量'];
      const dl = mdCn(d);
      if (mode === 'density') L.push(dl + '：15 天后没有逐泊位数据，只能判断能否装下');
      else if (nodata) L.push(dl + '：靠船计划暂无数据，无法判断占用');
      else if (row) L.push(dl + ' 占用：' + row.vessel, row.cargo + ' ' + fmt(row.tons) + ' 吨', '预计靠泊 ' + E.md(row.s) + ' · 在港至 ' + E.md(row.e));
      else L.push(dl + '：空闲');
      return { b, state, tip: L.join('\n') };
    });
    const cnt = (st) => items.filter((x) => x.state === st).length, n = items.filter((x) => x.state !== 'off').length;
    let chips;
    if (!n) chips = '<span class="tag red">没有能装下的泊位</span>';
    else if (mode === 'density') chips = '<span class="tag blue">能装下 ' + n + ' 个</span><span class="tag gray">15 天后无逐泊位数据</span>';
    else if (nodata) chips = '<span class="tag blue">能装下 ' + n + ' 个</span><span class="tag nodata">暂无数据</span>';
    else chips = '<span class="tag blue">能装下 ' + n + ' 个</span><span class="tag green">空闲 ' + cnt('free') + '</span><span class="tag amber">占用 ' + cnt('occ') + '</span>';
    const grp = (name) => { const g = items.filter((x) => x.b.terminal === name);
      return '<div><div class="bm-t">' + name + ' · ' + g.length + ' 个</div><div class="bm-r">' + g.map((x) => '<div class="bt ' + x.state + '" data-tip="' + esc(x.tip) + '"><b>' + x.b.code + '</b><small>' + (x.b.capacity / 10000) + '万</small></div>').join('') + '</div></div>'; };
    el.innerHTML = '<div class="bm-h"><b>' + M.berths.length + ' 个泊位 · ' + mdCn(d) + ' ' + wk(d) + '</b>' + chips + '<span class="sp"></span><span class="faint">点击上方日历切换日期，鼠标悬停看泊位信息</span></div>' +
      '<div class="bm-g">' + grp('北区码头') + grp('拉博塔码头') + '</div>' +
      '<div class="bm-l"><span class="g"><span class="sw c1">空闲</span>能装下且当天空着</span><span class="g"><span class="sw c3">占用</span>能装下但当天有船</span>' +
      '<span class="g"><span class="sw" style="background:#eef0f3;color:#a7b0bc;border-color:#dfe3e8">灰色</span>装不下本次货量，不计入基数</span>' +
      '<span class="g"><span class="sw nd">&nbsp;&nbsp;</span>无数据</span><span class="g"><span class="sw" style="background:#e6f4ff;color:#0958d9;border-color:#91caff">能装下</span>15 天后只判断能否装下</span></div>';
  }

  // ---------- 采纳 / 宣船文案 ----------
  function openAdopt(L) {
    const p = last.plans[L === 'A' ? 0 : 1], mine = M.voyages.filter((v) => v.status === '待宣船' && v.owner === M.user.name);
    $('adoptTitle').textContent = '采纳' + (L === 'A' ? '推荐方案' : '备选方案') + '（' + E.md(p.c.s) + ' ~ ' + E.md(p.c.e) + '）';
    $('adoptBody').innerHTML = '<div class="mini" style="margin:0 0 10px;white-space:normal">采纳后，方案的计划窗口会写回航次。原型中不会真的写入。</div>' +
      '<label class="radio on"><input type="radio" name="ad" checked><div><b>写回已有航次</b><div style="margin-top:4px"><select class="inp">' +
      (mine.length ? mine.map((v) => '<option>' + v.id + ' · 待宣船 · ' + zh(v.load) + ' → ' + zh(v.disch) + ' · ' + fmt(v.totalTons) + ' 吨</option>').join('') : '<option>（没有属于我的待宣船航次）</option>') + '</select></div></div></label>' +
      '<label class="radio"><input type="radio" name="ad"><div><b>新建待宣船航次</b><div class="muted">按本次预测的船型、货量、装卸港创建。</div></div></label>';
    $('adoptBody').querySelectorAll('.radio').forEach((r) => r.onclick = () => { $('adoptBody').querySelectorAll('.radio').forEach((x) => x.classList.toggle('on', x === r)); r.querySelector('input').checked = true; });
    $('mAdopt').classList.add('on');
  }
  function openAnnc(L) {
    const p = last.plans[L === 'A' ? 0 : 1], parts = E.announce(last, p);
    $('anncTitle').textContent = '宣船文案 · ' + (L === 'A' ? '推荐方案' : '备选方案');
    $('anncText').innerHTML = parts.map((x) => x.v ? '<span class="v">' + x.t + '</span>' : x.t).join('');
    $('anncCopy').onclick = () => { const txt = parts.map((x) => x.t).join(''); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('已复制到剪贴板'), () => toast('已生成（原型环境无法写剪贴板）')); };
    $('mAnnc').classList.add('on');
  }
  document.querySelectorAll('[data-close]').forEach((b) => b.onclick = () => b.closest('.mask').classList.remove('on'));
  $('adoptOk').onclick = () => { $('mAdopt').classList.remove('on'); toast('已采纳（原型演示，未写入）'); };

  // ---------- 运行 ----------
  function run() { const f = readForm(); last = E.predict(f); curTons = f.tons; selDay = (last.plans && last.plans[0]) ? last.plans[0].c.s : E.TODAY; renderResult(last); renderCalendar(last, f.tons); }
  function drawPresets() {
    $('presets').innerHTML = PRESETS.map((p, i) => '<button class="preset' + (i === cur ? ' on' : '') + '" data-i="' + i + '" data-tip="' + p.tip + '"><span class="no">' + (i + 1) + '</span><b>' + p.label + '</b></button>').join('');
    $('presets').querySelectorAll('.preset').forEach((b) => b.onclick = () => { cur = +b.dataset.i; drawPresets(); writeForm(PRESETS[cur].v); run(); });
  }
  $('go').onclick = run;
  $('reset').onclick = () => { cur = 0; drawPresets(); writeForm(PRESETS[0].v); run(); };
  ['tons', 'ws', 'we'].forEach((id) => $(id).addEventListener('input', updateHints));
  const q0 = new URLSearchParams(location.search);
  if (q0.get('biz')) { cur = -1; drawPresets(); writeForm({ biz: q0.get('biz'), tons: +q0.get('tons'), load: q0.get('load'), disch: q0.get('disch'), ws: q0.get('ws'), we: q0.get('we') }); run(); }
  else { drawPresets(); writeForm(PRESETS[0].v); run(); }
  window.__P02 = { PRESETS, pick(i) { cur = i; drawPresets(); writeForm(PRESETS[i].v); run(); }, toggleCands(v) { showCands = v; renderResult(last); } };
})();
</script>
</body>
</html>
