<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>P02 智能发船预测 · SSPS 原型</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.work{display:grid;grid-template-columns:372px minmax(0,1fr);gap:16px;align-items:start}
.pbar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:10px 16px 12px}
.preset{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;background:#fafbfc;padding:6px 9px;cursor:pointer;text-align:left}
.preset:hover{border-color:var(--primary);background:#f5faff}
.preset.on{border-color:var(--primary);background:var(--primary-bg)}
.preset b{font-size:12.5px;display:block}.preset small{color:var(--muted);font-size:11.5px}
.preset .no{flex:none;width:18px;height:18px;border-radius:50%;background:#26394f;color:#fff;font-size:11px;display:grid;place-items:center;margin-top:1px}
.sect{font-size:12px;color:var(--muted);letter-spacing:.5px;margin:2px 0 6px;display:flex;align-items:center;gap:6px}
.sect:after{content:"";flex:1;height:1px;background:var(--line-2)}
.pathbox{border-radius:8px;padding:8px 10px;margin:2px 0 12px;border:1px solid;font-size:12.5px;line-height:1.6}
.pathbox.le{background:#f0f7ff;border-color:#b7d8ff}.pathbox.gt{background:#f9f0ff;border-color:#d3adf7}
.pathbox b{display:block;margin-bottom:1px}
.lockedv{display:flex;align-items:center;gap:6px;height:32px;border:1px dashed #c4cad3;border-radius:6px;padding:0 9px;background:#f7f8fa;color:var(--muted)}
/* 运行信息 */
.meta{display:grid;grid-template-columns:repeat(6,auto);gap:6px 28px;padding:11px 16px;font-size:12.5px}
.meta dt{color:var(--muted);font-size:11.5px}.meta dd{margin:0;font-weight:600}
.meta div{min-width:0}
.cands{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px 11px;border-top:1px dashed var(--line);font-size:12px}
.cand{display:inline-flex;gap:5px;align-items:center;border:1px solid;border-radius:6px;padding:1px 7px;line-height:20px}
.cand i{font-style:normal;font-weight:700;color:#fff;background:var(--primary);border-radius:3px;padding:0 5px;font-size:11px}
.cand i.b{background:#08979c}
.cand.sp{border-style:dashed}
/* Plan 卡片 */
.plans{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.plan{position:relative;overflow:hidden}
.plan:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--primary)}
.plan.B:before{background:#08979c}
.plan.low{border:1.5px dashed #ff9c6e}
.plan.empty{border:1.5px dashed #c4cad3;background:repeating-linear-gradient(135deg,#fbfbfc 0,#fbfbfc 8px,#f2f3f5 8px,#f2f3f5 9px)}
.plan-h{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.plan-h h3{margin:0;font-size:17px}
.plan-h .sp{flex:1}
.lowbox{margin:0 16px 8px;background:#fff2e8;border:1px solid #ffbb96;border-radius:6px;padding:6px 10px;color:#ad2102;font-size:12px;line-height:1.6}
.mgrid{display:grid;grid-template-columns:1.05fr 1.05fr 1.1fr;gap:12px;padding:6px 16px 4px}
.m .lb{font-size:11.5px;color:var(--muted)}
.m .v{font-size:20px;font-weight:700;margin:1px 0;letter-spacing:.2px}
.m .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
.m .sub{font-size:11.5px;color:var(--muted)}
.big{display:inline-flex;align-items:baseline;gap:6px;border:1px solid;border-radius:8px;padding:2px 11px;margin:2px 0}
.big b{font-size:24px;line-height:1.3}.big span{font-size:12px}
.bar{display:block;height:5px;border-radius:3px;background:#e8ebef;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:currentColor;opacity:.75}
.days{display:flex;flex-wrap:wrap;gap:5px;padding:6px 16px 2px}
.day{border:1px solid;border-radius:5px;padding:0 6px;font-size:12px;line-height:20px}
.kvs{padding:6px 16px 2px;display:grid;gap:4px;font-size:12.5px}
.kvs .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kvs .k{color:var(--muted);min-width:76px;font-size:12px}
.s1{margin:8px 16px 0;border:1px solid #d6e4ff;background:#f5f8ff;border-radius:6px;padding:6px 10px;font-size:12px;color:#34476b;line-height:1.7}
.s1 b{color:#10239e}
.plan-f{display:flex;gap:8px;padding:12px 16px 14px;align-items:center}
.plan-f .sp{flex:1}
.emptymsg{padding:20px 22px;color:var(--muted);line-height:1.8}
.emptymsg b{color:var(--text);display:block;font-size:15px;margin-bottom:4px}
.banner{margin-top:16px;padding:22px 24px;display:flex;gap:18px;align-items:center}
.banner .ico{flex:none;width:64px;height:64px;border-radius:12px;background:var(--stripe);border:1px solid #c4cad3}
.banner h3{margin:0 0 4px;font-size:16px}.banner p{margin:0;color:var(--muted);line-height:1.8}
.banner.err .ico{background:#fff1f0;border-color:#ffa39e;display:grid;place-items:center;font-size:28px;color:#cf1322}
/* 日历 */
.cal{display:grid;grid-template-columns:104px repeat(30,minmax(0,1fr));gap:3px 3px;padding:12px 16px 4px;align-items:stretch}
.cal .lab{font-size:11.5px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;text-align:right}
.cal .band{border-radius:6px 6px 0 0;padding:4px 8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.cal .band.le{background:#e6f1ff;color:#0958d9;border-bottom:2px solid #1677ff}
.cal .band.gt{background:#f4ebff;color:#531dab;border-bottom:2px solid #9254de}
.cal .dh{text-align:center;font-size:11.5px;line-height:1.25;padding:2px 0}
.cal .dh b{display:block;font-size:12px}
.cal .dh.today b{color:var(--primary)}.cal .dh.wkend{color:#cf1322}
.cal .dh.split,.cal .cell.split{box-shadow:-2px 0 0 #9254de}
.cell{height:50px;border:1px solid;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;cursor:default;position:relative}
.cell b{font-size:13px;line-height:1}
.cell .bar{width:70%;height:4px}
.cell .dg{display:flex;gap:1px;width:74%;height:4px}
.cell .dg i{flex:1;border-radius:1px;background:rgba(0,0,0,.12)}
.cell .dg i.on{background:currentColor;opacity:.8}
.cell.nd i{font-style:normal;font-size:10px;color:#7b8696;background:rgba(255,255,255,.85);padding:0 3px;border-radius:3px}
.cell:hover{outline:2px solid var(--primary);z-index:2}
.mk{height:20px;border-radius:4px;font-size:11px;display:flex;align-items:center;padding:0 6px;color:#fff;white-space:nowrap;overflow:hidden}
.mk.w{background:#d0d7e2;color:#44546a}.mk.a{background:var(--primary)}.mk.b{background:#08979c}
.mk.low{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0,rgba(255,255,255,.28) 4px,transparent 4px,transparent 8px)}
.legend{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding:8px 16px 14px;font-size:12px;color:var(--muted)}
.legend .grp{display:flex;gap:6px;align-items:center}
.sw{display:inline-block;min-width:34px;padding:0 4px;height:16px;border:1px solid;border-radius:4px;text-align:center;font-size:10.5px;line-height:14px}
.note{font-size:12px;color:var(--muted);padding:0 16px 12px}
/* 宣船文案 */
.annc{background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:12px 14px;line-height:2;font-size:13.5px}
.annc .v{background:#e6f4ff;color:#0958d9;border-radius:3px;padding:0 3px;font-weight:600}
.radio{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer}
.radio.on{border-color:var(--primary);background:var(--primary-bg)}
</style>
</head>
<body>
<div class="app">
  <aside id="nav"></aside>
  <div class="main">
    <header id="topbar"></header>
    <main class="page">
      <div class="page-head">
        <div>
          <h1>智能发船预测</h1>
          <p>帮业务员回答三件事：几号发船、哪几天到港、到港时泊位够不够。每次预测只出 Plan A / Plan B。</p>
        </div>
        <div class="muted">调用接口：A20 容量日历 · A21 预测 · A23 采纳 · A24 宣船文案</div>
      </div>

      <section class="card" style="margin-bottom:16px">
        <div class="card-h" style="padding:8px 16px"><h2>示例场景 <span class="muted" style="font-weight:400">（评审用：点击即填入并预测，覆盖三类船、两条路径、低可信、无数据）</span></h2></div>
        <div class="pbar" id="presets"></div>
      </section>

      <div class="work">
        <!-- 左：输入 -->
        <section class="card">
          <div class="card-h"><h2>预测输入</h2><span class="muted">A21 请求参数</span></div>
          <div class="card-b">
            <div class="field"><label>业务类型</label>
              <div class="seg" id="biz"></div></div>
            <div class="field"><label>货量（吨）</label>
              <input class="inp" id="tons" type="number" min="1000" step="1000">
              <div class="hint" id="poolHint"></div></div>
            <div class="row2">
              <div class="field"><label>装港</label><div id="loadBox"></div></div>
              <div class="field"><label>卸港</label><div id="dischBox"></div></div>
            </div>
            <div class="hint" id="sideHint" style="margin:-4px 0 12px"></div>
            <div class="field"><label id="winLabel">期望到港窗口</label>
              <div class="row2"><input class="inp" id="ws" type="date"><input class="inp" id="we" type="date"></div>
              <div class="hint" id="winHint"></div>
              <div class="err" id="formErr"></div></div>
            <div class="pathbox le" id="pathbox"></div>
            <div style="display:flex;gap:8px"><button class="btn primary lg" id="go" style="flex:1">预测</button><button class="btn lg" id="reset">重置</button></div>
          </div>
        </section>

        <!-- 右：结果 -->
        <section id="result"></section>
      </div>

      <!-- 下：30 天容量日历 -->
      <section class="card" style="margin-top:16px">
        <div class="card-h"><h2>30 天容量日历</h2><span class="muted" id="calMeta"></span></div>
        <div class="cal" id="cal"></div>
        <div class="legend" id="legend"></div>
        <div class="note" id="calNote"></div>
      </section>
    </main>
  </div>
</div>

<div class="mask" id="mAdopt"><div class="modal">
  <div class="modal-h"><span id="adoptTitle">采纳方案</span><button data-close>×</button></div>
  <div class="modal-b" id="adoptBody"></div>
  <div class="modal-f"><button class="btn" data-close>取消</button><button class="btn primary" id="adoptOk">确认采纳</button></div>
</div></div>
<div class="mask" id="mAnnc"><div class="modal">
  <div class="modal-h"><span id="anncTitle">宣船文案</span><button data-close>×</button></div>
  <div class="modal-b">
    <div class="annc" id="anncText"></div>
    <div class="hint" style="margin-top:8px">蓝色底的数值来自规则引擎，只读、不会被改写；其余为固定模板措辞（模板文字待业务确认）。</div>
  </div>
  <div class="modal-f"><button class="btn" data-close>关闭</button><button class="btn primary" id="anncCopy">一键复制</button></div>
</div></div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>

<script src="mock-data.js"></script>
<script src="engine.js"></script>
<script src="assets/shell.js"></script>
<script>
(function () {
  SHELL.mount({ active: 'P02', title: '智能发船预测' });
  const M = window.MOCK, E = window.ENGINE, $ = (id) => document.getElementById(id);
  const BIZ = ['大宗采购船', '成品销售船', '物资备件船'];
  const LOCAL = 'BAHODOPI';
  const PRESETS = [
    { label: '大宗 · ≤15 天 · 数据完整', sub: '5 万吨 · 经验值 · Plan A/B 都是正常可信',
      v: { biz: '大宗采购船', tons: 50000, load: 'SURIGAO', disch: LOCAL, ws: '2026-11-08', we: '2026-11-18' } },
    { label: '大宗 · ＞15 天 · 重叠船数', sub: '5 万吨 · 统计值（样本 14）· 不显示 CMR',
      v: { biz: '大宗采购船', tons: 50000, load: 'TAGANITO', disch: LOCAL, ws: '2026-11-24', we: '2026-12-02' } },
    { label: '≤15 天 · Plan B 降级为低可信', sub: '窗口越过靠船计划覆盖期，无完整数据候选',
      v: { biz: '大宗采购船', tons: 50000, load: 'SURIGAO', disch: LOCAL, ws: '2026-11-12', we: '2026-11-23' } },
    { label: '成品销售船 · 装港侧反推', sub: '2.8 万吨 · 受载期 · 客户港 ETA 仅供参考',
      v: { biz: '成品销售船', tons: 28000, load: LOCAL, disch: 'HAIPHONG', ws: '2026-11-08', we: '2026-11-20' } },
    { label: '物资备件船 · 借用大宗样本', sub: '0.8 万吨 · 航程来自大宗航线',
      v: { biz: '物资备件船', tons: 8000, load: 'JAKARTA', disch: LOCAL, ws: '2026-11-08', we: '2026-11-18' } },
    { label: '窗口内无靠船计划（无数据）', sub: '灰色斜线，不是 0%，也不改走航次表',
      v: { biz: '大宗采购船', tons: 50000, load: 'SURIGAO', disch: LOCAL, ws: '2026-11-17', we: '2026-11-19' } },
    { label: '缺航程规则', sub: 'SURABAYA → BAHODOPI 未维护规则',
      v: { biz: '大宗采购船', tons: 30000, load: 'SURABAYA', disch: LOCAL, ws: '2026-11-10', we: '2026-11-18' } },
  ];
  let cur = 0, last = null;

  // ---------- 小工具 ----------
  const fmt = (n) => Number(n).toLocaleString('en-US');
  const pct = (x) => Math.round(x * 1000) / 10 + '%';
  const dFull = (n) => E.iso(n) + ' 周' + E.wk(n);
  const cmrCls = (v) => (v >= .5 ? 'c1' : v >= .3 ? 'c2' : v >= .15 ? 'c3' : 'c4');
  const cmrLab = (v) => (v >= .5 ? '充裕' : v >= .3 ? '适中' : v >= .15 ? '紧张' : '拥堵');
  const denCls = (c, n) => { const r = c / n; return r <= .4 ? 'c1' : r <= .7 ? 'c2' : r <= .9 ? 'c3' : 'c4'; };
  const denLab = (c, n) => { const r = c / n; return r <= .4 ? '宽松' : r <= .7 ? '适中' : r <= .9 ? '偏密' : '拥挤'; };
  const toast = (t) => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); };
  const isoToN = E.dn;

  // ---------- 表单 ----------
  function portSelect(id, exclude) {
    return '<select class="inp" id="' + id + '">' + M.ports.filter((p) => p.en !== exclude)
      .map((p) => '<option value="' + p.en + '">' + p.en + '（' + p.cn + '）</option>').join('') + '</select>';
  }
  function drawBiz(sel) {
    $('biz').innerHTML = BIZ.map((b) => '<button data-b="' + b + '" class="' + (b === sel ? 'on' : '') + '">' + b + '</button>').join('');
    $('biz').querySelectorAll('button').forEach((bt) => bt.onclick = () => { setBiz(bt.dataset.b); updateHints(); });
  }
  function setBiz(b, keep) {
    const prev = keep || {};
    drawBiz(b);
    const lockedLoad = b === '成品销售船';       // 成品：本港是装港；大宗/物资：本港是卸港
    const lockBox = '<div class="lockedv"><span>🔒</span>' + LOCAL + '<span class="faint">（本港）</span></div>';
    $('loadBox').innerHTML = lockedLoad ? lockBox : portSelect('load', LOCAL);
    $('dischBox').innerHTML = lockedLoad ? portSelect('disch', LOCAL) : lockBox;
    if (!lockedLoad && prev.load) $('load').value = prev.load;
    if (lockedLoad && prev.disch) $('disch').value = prev.disch;
    $('winLabel').textContent = lockedLoad ? '受载期（始 / 止）' : '期望到港窗口（始 / 止）· 抵卸港';
    $('winHint').textContent = lockedLoad ? '截止日 = 最晚装船日 = 受载期止；成品船从装港侧（本港装货）反推。' : '本港侧为卸港：按抵港 / 靠泊时间计算 CMR 或重叠船数。';
    ['load', 'disch'].forEach((id) => { const el = $(id); if (el) el.onchange = updateHints; });
    document.body.dataset.biz = b;
  }
  function readForm() {
    const biz = document.body.dataset.biz, locked = biz === '成品销售船';
    return { biz, tons: Number($('tons').value), load: locked ? LOCAL : $('load').value, disch: locked ? $('disch').value : LOCAL,
      winStart: $('ws').value, winEnd: $('we').value };
  }
  function writeForm(v) {
    setBiz(v.biz, v); $('tons').value = v.tons; $('ws').value = v.ws; $('we').value = v.we;
    if (v.biz === '成品销售船') $('disch').value = v.disch; else $('load').value = v.load;
    updateHints();
  }
  function updateHints() {
    const f = readForm(), P = E.poolFor(f.tons || 0);
    const mx = Math.max(...M.berths.map((b) => b.capacity));
    $('poolHint').innerHTML = f.tons > 0
      ? (P.n ? '吨级匹配：容量 ≥ ' + fmt(f.tons) + ' 吨的启用泊位 <b>' + P.n + '</b> 个（共 ' + M.berths.length + '），这是 CMR 的分母。'
             : '<span class="err">超过最大泊位容量 ' + fmt(mx) + ' 吨，无匹配泊位。</span>') : '';
    const lockedLoad = f.biz === '成品销售船';
    $('sideHint').innerHTML = '本港侧 = <b>' + (lockedLoad ? '装港' : '卸港') + '（' + LOCAL + '）</b>，按此端的时间做 CMR / 密度。';
    const pb = $('pathbox');
    if (!f.winStart) { pb.className = 'pathbox le'; pb.innerHTML = '请选择时间窗口以判定计算路径。'; return; }
    const dist = isoToN(f.winStart) - E.TODAY, le = dist <= E.PATH_LIMIT;
    pb.className = 'pathbox ' + (le ? 'le' : 'gt');
    pb.innerHTML = '<b>目标到港日 ' + f.winStart + '，距今 ' + dist + ' 天 → ' + (le ? '走「≤15 天」路径' : '走「＞15 天」路径') + '</b>' +
      (le ? 'IMIP 靠船计划 · 泊位级 CMR；排序指标 CMR_min。' : '航次表 · 同吨级重叠船数密度；排序指标重叠船数。') +
      '<br><span class="muted">只按日期分流，不看有没有数据。</span>';
  }

  // ---------- 渲染：结果 ----------
  function dayChips(p, res) {
    return p.c.days.map((x) => {
      if (x.state !== 'ok') return '<span class="day nd" title="无数据">' + E.md(x.d) + ' 无数据</span>';
      return p.mode === 'cmr'
        ? '<span class="day ' + cmrCls(x.cmr) + '">' + E.md(x.d) + ' ' + pct(x.cmr) + '</span>'
        : '<span class="day ' + denCls(x.count, x.n) + '">' + E.md(x.d) + ' ' + x.count + ' 艘</span>';
    }).join('');
  }
  function routeRows(res, p) {
    const r = res.run.rule; if (!r) return '<div class="r"><span class="k">航程口径</span><span class="tag gray">无规则</span><span class="muted">未维护 ' + res.input.load + ' → ' + res.input.disch + '，不给客户港 ETA</span></div>';
    const tag = r.basis === '经验值' ? '<span class="tag amber">经验值</span>' : '<span class="tag blue">统计值 · n=' + r.samples + '</span>';
    const detail = r.basis === '经验值'
      ? '经验航程 <b>' + r.exp + '</b> / 上限 <b>' + r.expMax + '</b> 天 <span class="muted">· 样本 ' + r.samples + ' 条（&lt;5，未切统计值）</span>'
      : 'P50 <b>' + r.p50 + '</b> / P80 <b>' + r.p80 + '</b> 天 <span class="muted">· 样本 ' + r.samples + ' 条</span>';
    return '<div class="r"><span class="k">航程口径</span>' + tag + (res.run.borrowed ? '<span class="tag gray">借用大宗航线样本</span>' : '') + '<span>' + detail + '</span><span class="muted mono">' + r.id + '</span></div>';
  }
  function s1Line(res) {
    const r = res.run, P = res.pool, x = res.excluded;
    const src = r.mode === 'cmr'
      ? '靠船计划 <b>' + M.batch.batchNo + '</b>（计划日 ' + M.batch.planDate + '，覆盖至 ' + E.md(E.planCoverTo) + '）'
      : '航次表 T04（计划覆盖至 ' + E.md(E.voyHorizon) + '）';
    const excl = r.mode === 'cmr' ? '非德信池 ' + x.offPool + ' 行不计' : '取消航次 ' + x.cancelled + ' 条不计';
    return '<div class="s1"><b>S1 溯源</b> · ' + src + ' · 泊位池 <b>' + P.n + '/' + M.berths.length + '</b>（容量 ≥ ' + fmt(res.input.tons) + ' 吨） · 规则 <b>' + (r.rule ? r.rule.id + '（' + r.rule.basis + '）' : '—') + '</b> · ' + excl + ' <a href="#" data-detail>查看详情 →</a></div>';
  }
  function planCard(p, res) {
    const P = res.pool, i = res.input, prod = i.biz === '成品销售船';
    if (!p) {
      const L = p === null && res.plans[0] ? E.WINDOW_LEN : 0;
      return '<div class="card plan empty B"><div class="plan-h"><h3 style="color:#8a94a3">Plan B</h3><span class="tag gray">无可用方案</span></div>' +
        '<div class="emptymsg"><b>没有可用的 Plan B</b>窗口内找不到与 Plan A 错开 ' + L + ' 天以上、且有数据的候选。可放宽窗口后重新预测。</div></div>';
    }
    const cls = 'card plan ' + p.label + (p.trust === '低可信' ? ' low' : '');
    const trust = p.trust === '低可信' ? '<span class="tag lowtrust">⚠ 低可信</span>' : '<span class="tag green">可信度 正常</span>';
    const pathTag = p.mode === 'cmr' ? '<span class="tag blue">≤15 天 · 靠船计划 · CMR</span>' : '<span class="tag" style="background:#f9f0ff;color:#531dab;border-color:#d3adf7">＞15 天 · 航次表 · 重叠船数</span>';
    let m1, m2, m3;
    if (!prod) {
      m1 = '<div class="m"><div class="lb">推荐发船日（离装港）</div><div class="v">' + E.iso(p.depart) + '</div><div class="sub">周' + E.wk(p.depart) + ' · 按 P80 反推最晚到港日</div></div>';
      m2 = '<div class="m"><div class="lb">到港窗口（卸港 · 本港侧）</div><div class="v">' + E.md(p.c.s) + ' ~ ' + E.md(p.c.e) + '<small>' + p.c.len + ' 天</small></div><div class="sub">预计抵港 ' + E.md(p.etaFrom) + ' ~ ' + E.md(p.etaTo) + '（P50~P80）</div></div>';
    } else {
      m1 = '<div class="m"><div class="lb">推荐抵装港窗口（装港 · 本港侧）</div><div class="v">' + E.md(p.c.s) + ' ~ ' + E.md(p.c.e) + '<small>' + p.c.len + ' 天</small></div><div class="sub">周' + E.wk(p.c.s) + ' 起 · 在受载期内</div></div>';
      m2 = '<div class="m"><div class="lb">截止日（最晚装船日）</div><div class="v">' + E.iso(p.deadline) + '</div><div class="sub">受载期止 · 窗口末距截止 ' + p.slack + ' 天</div></div>';
    }
    if (p.mode === 'cmr') {
      const c = p.c.metric;
      m3 = '<div class="m"><div class="lb">CMR_min（窗口内最低容量余量率）</div><div class="big ' + cmrCls(c) + '"><b>' + pct(c) + '</b><span>' + cmrLab(c) + '</span></div>' +
        '<div class="sub">分母 ' + P.n + ' 个泊位 · ' + (p.qualifies ? '<span style="color:#237804">✓ 余量 ≥30%</span>' : '<span style="color:#ad2102">✗ 余量 &lt;30%</span>') + '</div></div>';
    } else {
      const c = p.c.metric;
      m3 = '<div class="m"><div class="lb">重叠船数（窗口内峰值）</div><div class="big ' + denCls(c, P.n) + '"><b>' + c + ' 艘</b><span>' + denLab(c, P.n) + '</span></div>' +
        '<div class="sub">同吨级竞争船 · 泊位 ' + P.n + ' 个 · ' + (p.qualifies ? '<span style="color:#237804">✓ 等效余量 ≥30%</span>' : '<span style="color:#ad2102">✗ 等效余量 &lt;30%</span>') + ' · <span class="faint">不输出 CMR</span></div></div>';
    }
    let kv = routeRows(res, p);
    if (prod) {
      kv += '<div class="r"><span class="k">客户港 ETA</span>' + (p.custEta ? '<b>' + E.md(p.custEta[0]) + ' ~ ' + E.md(p.custEta[1]) + '</b>' : '<span class="muted">—</span>') +
        '<span class="tag gray">反向近似 · 仅供参考</span></div>';
    }
    const lowbox = p.trust === '低可信' ? '<div class="lowbox"><b>低可信原因：</b>' + p.reasons.join('；') + '。</div>' : '';
    return '<div class="' + cls + '" data-plan="' + p.label + '">' +
      '<div class="plan-h"><h3>Plan ' + p.label + '</h3>' + trust + pathTag + '<span class="sp"></span><span class="muted">' + (p.mode === 'cmr' ? '排序：CMR_min' : '排序：重叠船数') + '</span></div>' + lowbox +
      '<div class="mgrid">' + m1 + m2 + m3 + '</div>' +
      '<div class="days">' + dayChips(p, res) + '</div>' +
      '<div class="kvs">' + kv + '</div>' + s1Line(res) +
      '<div class="plan-f"><button class="btn primary" data-adopt="' + p.label + '">采纳此方案</button><button class="btn" data-annc="' + p.label + '">生成宣船文案</button><span class="sp"></span><button class="btn ghost" data-detail>预测详情 · S1 溯源 →</button></div></div>';
  }
  function renderResult(res) {
    const el = $('result');
    if (res.errors.length) {
      el.innerHTML = '<div class="card banner err"><div class="ico">!</div><div><h3>无法预测</h3><p>' + res.errors.join('；') + '</p></div></div>'; return;
    }
    if (res.noRule) {
      el.innerHTML = '<div class="card banner err"><div class="ico">!</div><div><h3>未找到航程规则：' + res.input.load + ' → ' + res.input.disch + '（' + res.input.biz + '）</h3>' +
        '<p>没有航程就无法从到港窗口反推发船日。请业务员先在「主数据 · 航程规则」(P08，待做) 填写该航线的经验航程；同航线实际样本 ≥5 条后系统自动切换为统计值。</p></div></div>'; return;
    }
    const r = res.run, P = res.pool;
    const modeTag = r.mode === 'cmr' ? '<span class="tag blue">≤15 天 · 靠船计划</span>' : '<span class="tag" style="background:#f9f0ff;color:#531dab;border-color:#d3adf7">＞15 天 · 航次表</span>';
    const ruleTxt = r.rule ? r.rule.id + ' · ' + r.rule.basis + (r.rule.basis === '统计值' ? '（n=' + r.rule.samples + '）' : '') : '—';
    const cands = (res.candidates || []).map((c) => {
      const mark = res.plans.map((p) => (p && p.c === c ? p.label : '')).join('');
      const txt = c.none ? '无数据' : (r.mode === 'cmr' ? pct(c.metric) : c.metric + ' 艘');
      const k = c.none ? 'nd' : (r.mode === 'cmr' ? cmrCls(c.metric) : denCls(c.metric, P.n));
      return '<span class="cand ' + k + (c.complete ? '' : ' sp') + '" title="' + (c.complete ? '完整数据' : (c.none ? '窗口内全部无数据' : '含无数据日，稀疏候选')) + '">' +
        (mark ? '<i class="' + (mark === 'B' ? 'b' : '') + '">' + mark + '</i>' : '') + E.md(c.s) + '–' + E.md(c.e).slice(3) + ' ' + txt + (c.complete || c.none ? '' : '*') + '</span>';
    }).join('');
    let html = '<div class="card"><div class="card-h"><h2>预测结果 · ' + res.input.biz + ' · ' + fmt(res.input.tons) + ' 吨</h2><span class="muted">D05 prediction_run</span></div>' +
      '<dl class="meta" style="margin:0">' +
      '<div><dt>运行编号</dt><dd class="mono">' + r.id + '</dd></div>' +
      '<div><dt>计算路径</dt><dd>' + modeTag + '</dd></div>' +
      '<div><dt>目标到港日</dt><dd>' + E.iso(r.target) + '（距今 ' + r.dist + ' 天）</dd></div>' +
      '<div><dt>靠船计划批次</dt><dd class="mono">' + (r.batchNo || '— 本次不用') + '</dd></div>' +
      '<div><dt>航程规则口径</dt><dd>' + ruleTxt + '</dd></div>' +
      '<div><dt>运行人 · 时间</dt><dd>' + r.runBy + ' · ' + r.at + '</dd></div></dl>' +
      '<div class="cands"><span class="muted">候选窗口（' + E.WINDOW_LEN + ' 天一档，按 ' + (r.mode === 'cmr' ? 'CMR_min 高者优先' : '重叠船数少者优先') + '，不使用综合评分）：</span>' + cands +
      (res.excluded.pastDepart ? '<span class="muted">· 另有 ' + res.excluded.pastDepart + ' 个候选发船日早于今天，已排除</span>' : '') + '</div></div>';
    if (res.noCandidate) {
      html += '<div class="card banner"><div class="ico"></div><div><h3>窗口内没有可推荐的方案：全部为「无数据」</h3>' +
        '<p>' + (r.mode === 'cmr' ? '该窗口落在靠船计划批次 ' + M.batch.batchNo + ' 的覆盖期（至 ' + E.md(E.planCoverTo) + '）之外。' : '该窗口落在航次表的计划覆盖期之外。') +
        '无数据显示为灰色斜线，<b>不是 0%</b>。目标到港日距今 ' + r.dist + ' 天，仍按「' + (r.mode === 'cmr' ? '≤15 天' : '＞15 天') + '」路径处理，<b>不会因为没有数据而改用另一条路径</b>。建议把窗口前移到覆盖期内，或等下一期靠船计划。</p></div></div>';
    } else {
      html += '<div class="plans">' + planCard(res.plans[0], res) + planCard(res.plans[1] || null, res) + '</div>';
    }
    el.innerHTML = html;
    el.querySelectorAll('[data-detail]').forEach((a) => a.onclick = (e) => { e.preventDefault(); toast('P03 预测详情页（S1 溯源）将在 P02 评审后制作'); });
    el.querySelectorAll('[data-adopt]').forEach((b) => b.onclick = () => openAdopt(b.dataset.adopt));
    el.querySelectorAll('[data-annc]').forEach((b) => b.onclick = () => openAnnc(b.dataset.annc));
  }

  // ---------- 渲染：30 天日历 ----------
  const tip = $('tip');
  function showTip(e, html) { tip.innerHTML = html; tip.style.display = 'block'; const x = Math.min(e.clientX + 14, innerWidth - 340); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 16) + 'px'; }
  function renderCalendar(res, tons) {
    const cal = E.calendar(tons || 0), P = cal.P, days = cal.days;
    const le = days.filter((d) => d.mode === 'cmr').length;
    $('calMeta').innerHTML = '吨级 <b>' + (tons ? fmt(tons) + ' 吨' : '—') + '</b> · 分母 <b>' + P.n + '</b> 个泊位 · 今天 ' + M.today;
    let h = '';
    h += '<div class="lab" style="grid-row:1;grid-column:1"></div><div class="band le" style="grid-row:1;grid-column:2 / span ' + le + '">≤15 天 · IMIP 靠船计划 · 泊位级 CMR（容量余量率，越高越充裕）</div>' +
         '<div class="band gt" style="grid-row:1;grid-column:' + (2 + le) + ' / span ' + (30 - le) + '">＞15 天 · 航次表 · 同吨级重叠船数（越少越宽松）</div>';
    h += '<div class="lab" style="grid-row:2;grid-column:1">日期</div>' + days.map((d) => '<div style="grid-row:2" class="dh' + (d.i === 0 ? ' today' : '') + ([0, 6].includes(new Date(d.d * 86400000).getUTCDay()) ? ' wkend' : '') + (d.i === le ? ' split' : '') + '"><b>' + E.md(d.d).slice(3) + '</b>' + (d.i === 0 ? '今天' : '周' + E.wk(d.d)) + '</div>').join('');
    h += '<div class="lab" style="grid-row:3;grid-column:1">容量</div>' + days.map((d) => {
      const sp = d.i === le ? ' split' : '';
      if (!P.n || d.state !== 'ok') return '<div style="grid-row:3" class="cell nd' + sp + '" data-i="' + d.i + '"><i>无数据</i></div>';
      if (d.mode === 'cmr') return '<div style="grid-row:3" class="cell ' + cmrCls(d.cmr) + sp + '" data-i="' + d.i + '"><b>' + Math.round(d.cmr * 100) + '%</b><span class="bar"><i style="width:' + d.cmr * 100 + '%"></i></span></div>';
      const f = Math.min(8, Math.round(d.count / d.n * 8)), dots = Array.from({ length: 8 }, (_, k) => '<i class="' + (k < f ? 'on' : '') + '"></i>').join('');
      return '<div style="grid-row:3" class="cell ' + denCls(d.count, d.n) + sp + '" data-i="' + d.i + '"><b>' + d.count + ' 艘</b><span class="dg">' + dots + '</span></div>';
    }).join('');
    const place = (cls, text, s, e, extra, row) => {
      const from = s - E.TODAY, to = e - E.TODAY; if (to < 0 || from > 29) return '';
      const a = Math.max(0, from), b = Math.min(29, to);
      return '<div class="mk ' + cls + (extra || '') + '" style="grid-row:' + row + ';grid-column:' + (a + 2) + ' / ' + (b + 3) + '">' + text + '</div>';
    };
    const f = res && res.input ? res.input : null;
    h += '<div class="lab" style="grid-row:4;grid-column:1">' + (document.body.dataset.biz === '成品销售船' ? '受载期' : '期望窗口') + '</div>' + (f && f.winStart ? place('w', E.md(isoToN(f.winStart)) + ' ~ ' + E.md(isoToN(f.winEnd)), isoToN(f.winStart), isoToN(f.winEnd), '', 4) : '');
    ['A', 'B'].forEach((L, k) => {
      h += '<div class="lab" style="grid-row:' + (5 + k) + ';grid-column:1">Plan ' + L + '</div>';
      const p = res && res.plans && res.plans[k];
      if (p) h += place(L === 'A' ? 'a' : 'b', 'Plan ' + L + ' ' + E.md(p.c.s) + '–' + E.md(p.c.e).slice(3) + (p.trust === '低可信' ? ' · 低可信' : ''), p.c.s, p.c.e, p.trust === '低可信' ? ' low' : '', 5 + k);
    });
    $('cal').innerHTML = h;
    $('cal').querySelectorAll('.cell').forEach((c) => {
      const d = days[+c.dataset.i], head = '<b>' + E.md(d.d) + ' 周' + E.wk(d.d) + '</b> · 距今 ' + d.i + ' 天<br>';
      c.onmousemove = (e) => {
        let t;
        if (!P.n) t = head + '无匹配泊位';
        else if (d.state !== 'ok') t = head + '<b>无数据</b>（灰色斜线，不是 0%）<br>' + (d.mode === 'cmr' ? '靠船计划批次只覆盖到 ' + E.md(E.planCoverTo) + '。本日仍走 ≤15 天路径，不改用航次表。' : '航次表计划只覆盖到 ' + E.md(E.voyHorizon) + '。');
        else if (d.mode === 'cmr') t = head + 'CMR <b>' + pct(d.cmr) + '</b>（' + cmrLab(d.cmr) + '）<br>空闲 ' + (d.n - d.occ) + ' / 分母 ' + d.n + ' 个泊位<br>占用：' + (d.occBerths.join('、') || '无') + '<br><span style="color:#9fb3c8">来源：靠船计划 ' + M.batch.batchNo + '</span>';
        else t = head + '同吨级重叠船 <b>' + d.count + ' 艘</b>（泊位 ' + d.n + ' 个）<br>' + (d.ships.map((s) => s.id.slice(-4) + ' ' + (s.vessel || '待宣船')).join('<br>') || '无') + '<br><span style="color:#9fb3c8">来源：航次表 T04 计划窗口</span>';
        showTip(e, t);
      };
      c.onmouseleave = () => { tip.style.display = 'none'; };
    });
    $('legend').innerHTML =
      '<div class="grp"><b style="color:var(--text)">CMR 色阶</b>' +
      '<span class="sw c1">≥50%</span>充裕 <span class="sw c2">30–50%</span>适中 <span class="sw c3">15–30%</span>紧张 <span class="sw c4">&lt;15%</span>拥堵</div>' +
      '<div class="grp"><b style="color:var(--text)">重叠船数</b><span class="sw c1">≤40%</span><span class="sw c2">≤70%</span><span class="sw c3">≤90%</span><span class="sw c4">&gt;90%</span>占分母泊位数的比例</div>' +
      '<div class="grp"><span class="sw nd"></span><b style="color:var(--text)">无数据</b>灰色斜线，不是 0%</div>';
    $('calNote').innerHTML = 'CMR 只用「容量余量率」一种口径，30% 是 Plan B 的余量门槛，其余色阶分界为原型建议值，待确认。重叠船数只计与该吨级泊位竞争的船，已取消航次不计入。';
  }

  // ---------- 采纳 / 宣船文案 ----------
  function openAdopt(L) {
    const p = last.plans[L === 'A' ? 0 : 1], mine = M.voyages.filter((v) => v.status === '待宣船' && v.owner === M.user.name);
    $('adoptTitle').textContent = '采纳 Plan ' + L + '（' + E.md(p.c.s) + ' ~ ' + E.md(p.c.e) + '）';
    $('adoptBody').innerHTML =
      '<div class="hint" style="margin:0 0 10px">采纳会把本方案的计划窗口写回航次（A23），写入前不会改变任何引擎数值。原型中不会真的写入。</div>' +
      '<label class="radio on" data-r="a"><input type="radio" name="ad" checked><div><b>写回已有航次的计划窗口</b><div class="muted" style="margin-top:4px"><select class="inp" id="adVoy">' +
      (mine.length ? mine.map((v) => '<option>' + v.id + ' · 待宣船 · ' + v.load + ' → ' + v.disch + ' · ' + fmt(v.totalTons) + ' 吨</option>').join('') : '<option>（没有属于我的待宣船航次）</option>') + '</select></div></div></label>' +
      '<label class="radio" data-r="b"><input type="radio" name="ad"><div><b>新建待宣船航次</b><div class="muted">按本次预测的业务类型、货量、装卸港创建，窗口取本方案。</div></div></label>';
    $('adoptBody').querySelectorAll('.radio').forEach((r) => r.onclick = () => { $('adoptBody').querySelectorAll('.radio').forEach((x) => x.classList.toggle('on', x === r)); r.querySelector('input').checked = true; });
    $('mAdopt').classList.add('on');
  }
  function openAnnc(L) {
    const p = last.plans[L === 'A' ? 0 : 1], parts = E.announce(last, p);
    $('anncTitle').textContent = '宣船文案 · Plan ' + L;
    $('anncText').innerHTML = parts.map((x) => x.v ? '<span class="v">' + x.t + '</span>' : x.t).join('');
    $('anncCopy').onclick = () => {
      const txt = parts.map((x) => x.t).join('');
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('已复制到剪贴板'), () => toast('已生成（原型环境无法写剪贴板）'));
    };
    $('mAnnc').classList.add('on');
  }
  document.querySelectorAll('[data-close]').forEach((b) => b.onclick = () => b.closest('.mask').classList.remove('on'));
  $('adoptOk').onclick = () => { $('mAdopt').classList.remove('on'); toast('已采纳（原型演示，未写入）'); };

  // ---------- 运行 ----------
  function run() {
    const f = readForm(); $('formErr').textContent = '';
    last = E.predict(f);
    renderResult(last); renderCalendar(last, f.tons);
  }
  function drawPresets() {
    $('presets').innerHTML = PRESETS.map((p, i) => '<button class="preset' + (i === cur ? ' on' : '') + '" data-i="' + i + '"><span class="no">' + (i + 1) + '</span><span><b>' + p.label + '</b><small>' + p.sub + '</small></span></button>').join('');
    $('presets').querySelectorAll('.preset').forEach((b) => b.onclick = () => { cur = +b.dataset.i; drawPresets(); writeForm(PRESETS[cur].v); run(); });
  }
  $('go').onclick = run;
  $('reset').onclick = () => { cur = 0; drawPresets(); writeForm(PRESETS[0].v); run(); };
  ['tons', 'ws', 'we'].forEach((id) => $(id).addEventListener('input', updateHints));
  drawPresets(); writeForm(PRESETS[0].v); run();
  window.__P02 = { PRESETS, pick(i) { cur = i; drawPresets(); writeForm(PRESETS[i].v); run(); } };
})();
</script>
</body>
</html>
