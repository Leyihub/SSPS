<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>P09 数据质量 · SSPS 原型</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.tile{padding:12px 16px;cursor:pointer;border:1px solid transparent}
.tile:hover{border-color:var(--primary)}
.tile.on{border-color:var(--primary);background:var(--primary-bg)}
.tile b{font-size:24px;line-height:1.2;display:block}
.tile span{color:var(--muted);font-size:13px;display:flex;align-items:center;white-space:nowrap}
.tile.hot b{color:#d4380d}
.fbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.fbar .inp{width:auto}
.fbar .lab{color:var(--muted);font-size:12px;white-space:nowrap}
.fbar .grp{display:flex;gap:6px;flex-wrap:wrap}
.tbl td,.tbl th{white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:300px;max-width:520px}
.obj a{color:var(--primary);text-decoration:none;font-weight:600}.obj a:hover{text-decoration:underline}
.obj small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.viewer{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.viewer select{height:28px;padding:0 6px;border:1px solid #d3d9e1;border-radius:6px;background:#fff}
</style>
</head>
<body>
<div class="app"><aside id="nav"></aside>
  <div class="main"><header id="topbar"></header>
    <main class="page">
      <div class="ptitle"><div><h1>数据质量</h1><p>系统在保存和导入时发现的数据问题。点击一行直接跳到对应航次的字段；关闭问题需要责任人本人操作。</p></div>
        <label class="viewer">模拟身份<select id="viewer"></select></label></div>
      <div class="tiles" id="tiles"></div>
      <section class="card">
        <div class="fbar">
          <span class="lab">责任人</span><select class="inp" id="own"></select>
          <span class="lab">状态</span><div class="grp" id="stf"></div>
          <button class="chipf" id="me">只看我的</button>
          <span class="muted nw" id="cnt" style="margin-left:auto;font-size:12px"></span>
        </div>
        <div class="tbl-wrap"><table class="tbl" id="tbl"></table></div>
      </section>
    </main>
  </div>
</div>
<script src="mock-data.js"></script><script src="engine.js"></script><script src="assets/shell.js"></script><script src="assets/common.js"></script>
<script>
(function () {
  const M = window.MOCK, C = window.C, $ = (id) => document.getElementById(id);
  const VIEWERS = [['林海川', '大宗采购部', '业务员'], ['陈砚秋', '大宗采购部', '业务员'], ['韩墨', '商务海运部', '业务员'], ['周晓棠', '大宗采购部', '部门主管']];
  let who = VIEWERS[0];
  SHELL.mount({ active: 'P09', title: '数据质量', user: who });
  const TYPES = [['缺离装港时间', '已抵卸港但「实际离装港」为空，无法记入航程样本。'], ['ETA 超期未更新', '航行中的航次，预计到达时间超过 ' + C.ETA_STALE_DAYS + ' 天没有更新（阈值暂定）。'], ['缺 MMSI', 'MMSI 必填；缺失的船无法接入船讯网定位。'], ['港口未匹配', '导入或录入的港口写法在港口主档（含别名）里找不到。'], ['节点时序倒置', '后一个时间节点早于前一个，保存被拦截。'], ['疑似占位时间', '多条记录的实际时间完全相同，疑似批量复制的占位值，不进统计样本。']];
  const S = { type: '', own: '', st: new Set(['待处理', '处理中']), me: false };
  const mine = () => who[0];
  function draw() {
    const open = (t) => M.issues.filter((x) => x.type === t && x.status !== '已关闭').length;
    $('tiles').innerHTML = TYPES.map((t) => '<div class="card tile' + (S.type === t[0] ? ' on' : '') + (open(t[0]) ? ' hot' : '') + '" data-t="' + t[0] + '"><b>' + open(t[0]) + '</b><span>' + t[0] + C.ic(t[1]) + '</span></div>').join('');
    $('tiles').querySelectorAll('.tile').forEach((x) => x.onclick = () => { S.type = S.type === x.dataset.t ? '' : x.dataset.t; draw(); });
    const L = M.issues.filter((x) => (!S.type || x.type === S.type) && (!S.own || x.owner === S.own) && S.st.has(x.status) && (!S.me || x.owner === mine()));
    $('cnt').textContent = '共 ' + L.length + ' 条';
    const target = (x) => { const v = M.voyageList.find((q) => q.id === x.obj); return v ? { href: 'P05-voyage-detail.html?id=' + v.id + '&focus=' + x.field, label: (v.vessel || '待宣船'), sub: v.id } : { href: 'P08-master-data.html?tab=vessel', label: x.obj, sub: '船舶主档' }; };
    $('tbl').innerHTML = '<thead><tr><th>编号</th><th>问题类型</th><th>对象</th><th>责任人</th><th>状态</th><th>说明</th><th></th></tr></thead><tbody>' + (L.length ? L.map((x) => { const t = target(x), isOwner = x.owner === mine();
      return '<tr class="click" data-h="' + t.href + '"><td class="mut" style="color:var(--muted)">' + x.id + '</td><td><b>' + x.type + '</b></td><td class="obj"><a href="' + t.href + '">' + t.label + '</a><small>' + t.sub + '</small></td><td>' + x.owner + '</td><td><span class="tag ' + (x.status === '已关闭' ? 'gray' : x.status === '处理中' ? 'blue' : 'amber') + '">' + x.status + '</span></td><td class="wrap">' + x.note + '</td><td><a class="btn" href="' + t.href + '" style="text-decoration:none;padding:2px 12px">去处理</a> ' +
        (x.status === '已关闭' ? '' : (x.status === '待处理' ? '<button class="btn" data-s="' + x.id + '" data-to="处理中"' + (isOwner ? '' : ' disabled' + C.tipAttr('只有责任人 ' + x.owner + ' 能操作')) + ' style="padding:2px 12px">开始处理</button> ' : '') + '<button class="btn" data-s="' + x.id + '" data-to="已关闭"' + (isOwner ? '' : ' disabled' + C.tipAttr('关闭需要责任人 ' + x.owner + ' 本人操作')) + ' style="padding:2px 12px">关闭</button>') + '</td></tr>'; }).join('') : '<tr><td colspan="7" class="empty">没有符合条件的问题</td></tr>') + '</tbody>';
    $('tbl').querySelectorAll('tr.click').forEach((r) => r.onclick = (e) => { if (e.target.closest('a,button')) return; location.href = r.dataset.h; });
    $('tbl').querySelectorAll('[data-s]').forEach((b) => { if (!b.disabled) b.onclick = () => { const x = M.issues.find((q) => q.id === b.dataset.s); x.status = b.dataset.to; C.persist(); draw(); C.toast(x.id + ' 已' + (x.status === '已关闭' ? '关闭' : '开始处理')); }; });
    $('me').classList.toggle('on', S.me);
  }
  $('own').innerHTML = '<option value="">全部责任人</option>' + [...new Set(M.issues.map((x) => x.owner))].map((o) => '<option>' + o + '</option>').join('');
  $('own').onchange = (e) => { S.own = e.target.value; draw(); };
  $('stf').innerHTML = ['待处理', '处理中', '已关闭'].map((s) => '<button class="chipf' + (S.st.has(s) ? ' on' : '') + '" data-s="' + s + '">' + s + '</button>').join('');
  $('stf').querySelectorAll('button').forEach((b) => b.onclick = () => { const s = b.dataset.s; if (S.st.has(s)) S.st.delete(s); else S.st.add(s); b.classList.toggle('on'); draw(); });
  $('me').onclick = () => { S.me = !S.me; draw(); };
  $('viewer').innerHTML = VIEWERS.map((x, i) => '<option value="' + i + '">' + x[0] + ' · ' + x[2] + '</option>').join('');
  $('viewer').onchange = (e) => { who = VIEWERS[+e.target.value]; SHELL.mount({ active: 'P09', title: '数据质量', user: who }); draw(); C.toast('已切换为 ' + who[0]); };
  draw();
})();
</script>
</body>
</html>
