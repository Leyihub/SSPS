<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>P06 港口容量日历 · SSPS 原型</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.layout{display:grid;grid-template-columns:minmax(0,1fr) 470px;gap:16px;align-items:start}
.side{position:sticky;top:64px}
.ctl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ctl .lab{color:var(--muted);font-size:13px;display:flex;align-items:center;white-space:nowrap}
.seg button{white-space:nowrap;padding:6px 14px}
.calh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px 8px}
.phase{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:#3b4a5c}
.phase i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid #95de64;background:var(--c1-bg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:4px 16px 8px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}.wd.we{color:#cf1322}
.dc{position:relative;min-height:86px;border:1px solid;border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;background:#fff;text-align:left;white-space:nowrap;overflow:hidden}
.dc .dt{font-size:12px;opacity:.75;display:flex;justify-content:space-between}
.dc .dt b{font-weight:600}
.dc .big{font-size:20px;font-weight:700;line-height:1.2}
.dc .sm{font-size:11.5px;opacity:.85}
.dc .bar{display:block;height:4px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden;margin-top:3px}
.dc .bar i{display:block;height:100%;background:currentColor;opacity:.75}
.dc.far{border-style:dashed}
.dc.nd{background:var(--stripe);border-color:#c4cad3;color:#7b8696}
.dc.firstfar{box-shadow:-4px 0 0 #9254de}
.dc.past{background:#f7f8fa;color:#c0c8d2;border-color:#eceff3;cursor:default}
.dc.today .dt b{color:var(--primary)}
.dc.sel{outline:3px solid #26394f;outline-offset:1px;z-index:2}
.dc.nd .big{display:none}
.dc.nd .sm{background:rgba(255,255,255,.85);border-radius:4px;padding:0 5px;align-self:flex-start}
.mtag{position:absolute;right:6px;top:4px;font-size:10px;color:#531dab;background:#f4ebff;border-radius:3px;padding:0 4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;padding:6px 16px 14px;font-size:12px;color:var(--muted);align-items:center}
.legend .g{display:flex;align-items:center;gap:5px;white-space:nowrap}
.sw{display:inline-block;min-width:34px;padding:0 5px;text-align:center;border:1px solid;border-radius:4px;font-size:10.5px;line-height:16px;white-space:nowrap}
/* 右侧当日详情 */
.dh{padding:14px 16px;border-bottom:1px solid var(--line-2)}
.dh h2{margin:0;font-size:18px;white-space:nowrap}
.dh .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bm{padding:12px 16px 4px}
.bm-t{font-size:12px;color:var(--muted);margin-bottom:5px;white-space:nowrap}
.bm-r{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.bt{width:54px;height:46px;border:1px solid;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;cursor:help;flex:none;white-space:nowrap}
.bt b{font-size:13px}.bt small{font-size:11px;opacity:.85}
.bt.free{background:var(--c1-bg);color:var(--c1-fg);border-color:var(--c1-bd)}
.bt.occ{background:var(--c3-bg);color:var(--c3-fg);border-color:var(--c3-bd)}
.bt.cap{background:#e6f4ff;color:#0958d9;border-color:#91caff}
.bt.nd2{background:var(--stripe);color:#5b6878;border-color:#c4cad3}
.bt.off{background:#eef0f3;color:#a7b0bc;border-color:#dfe3e8}
.bt:hover{outline:2px solid var(--primary);z-index:2}
.bl{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 16px 12px;font-size:12px;color:var(--muted)}
.bl .g{display:flex;align-items:center;gap:4px;white-space:nowrap}
.ships{padding:0 16px 16px}
.ships h3{margin:6px 0 8px;font-size:14px;display:flex;align-items:center}
.sh{border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.sh .n{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
.sh .n a{color:inherit;text-decoration:none}.sh .n a:hover{color:var(--primary);text-decoration:underline}
.sh .t{font-size:11px;font-weight:500;border-radius:4px;padding:0 6px;line-height:18px}
.t.arr{background:#e6f4ff;color:#0958d9}.t.in{background:#f2f4f7;color:#5b6878}
.sh .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;margin-top:5px;font-size:12.5px;color:#3b4a5c}
.sh .kv span em{font-style:normal;color:var(--muted);margin-right:4px}
.sh .kv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.none{padding:18px 4px;color:var(--muted)}
</style>
</head>
<body>
<div class="app"><aside id="nav"></aside>
  <div class="main"><header id="topbar"></header>
    <main class="page">
      <div class="ptitle"><div><h1>港口容量日历</h1><p>全员可看。近 15 天看每日泊位余量，15 天后看同期船数；点任意一天看当天在港和预抵的船。</p></div>
        <div class="ctl"><span class="lab">货量档<span class="i" data-tip="按这个货量算「能装下的泊位」作为基数，默认 5 万吨。\n吨级档的划分还没有确认，原型先按泊位容量档位列出。">i</span></span><div class="seg" id="tons"></div></div></div>
      <div class="layout">
        <section class="card">
          <div class="calh"><div class="phase"><span><i></i>近 15 天：泊位余量（靠船计划）</span><span><i style="border-style:dashed;border-color:#b37feb;background:#f4ebff"></i>15 天后：同期船数（航次计划，估算）</span></div><span class="muted nw" id="meta" style="font-size:12px"></span></div>
          <div class="cal" id="cal"></div>
          <div class="legend" id="legend"></div>
        </section>
        <aside class="side card" id="side"></aside>
      </div>
    </main>
  </div>
</div>
<script src="mock-data.js"></script><script src="engine.js"></script><script src="assets/shell.js"></script><script src="assets/common.js"></script>
<script>
(function () {
  SHELL.mount({ active: 'P06', title: '港口容量日历' });
  const M = window.MOCK, E = window.ENGINE, C = window.C, $ = (id) => document.getElementById(id);
  const TONS = [[10000, '1 万吨'], [20000, '2 万吨'], [30000, '3 万吨'], [50000, '5 万吨'], [70000, '7 万吨']];
  let tons = 50000, sel = C.TODAY;
  const fmt = C.fmt, pct = C.pct;
  const cmrCls = (v) => (v >= .5 ? 'c1' : v >= .3 ? 'c2' : v >= .1 ? 'c3' : 'c4');
  const cmrLab = (v) => (v >= .5 ? '充裕' : v >= .3 ? '适中' : v >= .1 ? '偏紧' : '紧张');
  const denCls = (c, n) => { const r = c / n; return r <= .5 ? 'c1' : r <= .7 ? 'c2' : r <= .9 ? 'c3' : 'c4'; };
  const denLab = (c, n) => { const r = c / n; return r <= .5 ? '宽松' : r <= .7 ? '适中' : r <= .9 ? '偏密' : '拥挤'; };
  const dstr = (n) => C.iso(n);
  const md = (n) => C.md(dstr(n)), mdCn = (n) => C.mdCn(dstr(n)), wk = (n) => C.wk(dstr(n));

  // 42 天（6 周），周一开头
  const dow0 = (new Date(C.TODAY * 86400000).getUTCDay() + 6) % 7, start = C.TODAY - dow0, N = 42;
  function dayInfo(d) {
    if (d < C.TODAY) return { state: 'past' };
    const P = E.poolFor(tons), mode = E.modeOf(d);
    if (!P.n) return { state: 'nodata', mode };
    const x = mode === 'cmr' ? E.dayDetail(d, tons) : E.dayDetail(d, tons);
    return x.state === 'nodata' ? { state: 'nodata', mode } : Object.assign({ state: 'ok', mode, P }, x);
  }
  function drawCal() {
    const P = E.poolFor(tons);
    $('meta').textContent = '货量 ' + fmt(tons) + ' 吨 · 能装下的泊位 ' + P.n + ' / ' + M.berths.length + ' 个';
    let h = ['一', '二', '三', '四', '五', '六', '日'].map((x, i) => '<div class="wd' + (i > 4 ? ' we' : '') + '">周' + x + '</div>').join('');
    const firstFar = C.TODAY + E.PATH_LIMIT + 1;
    for (let i = 0; i < N; i++) {
      const d = start + i, info = dayInfo(d), label = (new Date(d * 86400000).getUTCDate() === 1 ? md(d) : String(Number(dstr(d).slice(8))));
      let cls = 'dc', body = '';
      if (info.state === 'past') { cls += ' past'; body = '<div class="dt"><b>' + label + '</b></div>'; }
      else {
        const far = info.mode === 'density'; if (far) cls += ' far' + (d === firstFar ? ' firstfar' : '');
        if (d === C.TODAY) cls += ' today';
        if (info.state !== 'ok') { cls += ' nd'; body = '<div class="dt"><b>' + (d === C.TODAY ? '今天' : label) + '</b></div><div class="big">—</div><span class="sm">无数据</span>'; }
        else if (info.mode === 'cmr') { cls += ' ' + cmrCls(info.cmr); body = '<div class="dt"><b>' + (d === C.TODAY ? '今天' : label) + '</b><span>' + info.list.length + ' 艘</span></div><div><div class="big">' + Math.round(info.cmr * 100) + '%</div><span class="bar"><i style="width:' + info.cmr * 100 + '%"></i></span></div><span class="sm">余量 · ' + cmrLab(info.cmr) + '</span>'; }
        else { cls += ' ' + denCls(info.count, info.P.n); body = '<div class="dt"><b>' + label + '</b></div><div class="big">' + info.count + ' 艘</div><span class="sm">估算 · ' + denLab(info.count, info.P.n) + '</span>'; }
      }
      if (d === sel) cls += ' sel';
      h += '<button class="' + cls + '" data-d="' + d + '"' + (info.state === 'past' ? ' disabled' : '') + '>' + body + (d === firstFar ? '<span class="mtag">15 天后</span>' : '') + '</button>';
    }
    $('cal').innerHTML = h;
    $('cal').querySelectorAll('.dc:not(.past)').forEach((b) => b.onclick = () => { sel = +b.dataset.d; drawCal(); drawSide(); });
    $('legend').innerHTML = '<div class="g"><b style="color:var(--text)">近 15 天泊位余量</b><span class="sw c1">≥50%</span>充裕<span class="sw c2">30–50%</span>适中<span class="sw c3">10–30%</span>偏紧<span class="sw c4">&lt;10%</span>紧张</div>' +
      '<div class="g"><b style="color:var(--text)">15 天后同期船数</b><span class="sw c1">≤50%</span><span class="sw c2">≤70%</span><span class="sw c3">≤90%</span><span class="sw c4">&gt;90%</span>占能装下的泊位数</div>' +
      '<div class="g"><span class="sw nd">&nbsp;&nbsp;</span><b style="color:var(--text)">无数据</b>灰色斜线，不是 0</div>';
  }
  function drawSide() {
    const d = sel, det = E.dayDetail(d, tons), P = E.poolFor(tons), le = E.modeOf(d) === 'cmr', nodata = det.state === 'nodata';
    const items = M.berths.map((b) => {
      const capable = tons > 0 && b.capacity >= tons;
      const row = le && !nodata ? E.rows.find((r) => r.inPool && r.berth === b.code && r.s <= d && d <= r.e) : null;
      const state = !capable ? 'off' : !le ? 'cap' : nodata ? 'nd2' : row ? 'occ' : 'free';
      const L = ['<b>' + b.code + ' · ' + b.terminal + '</b>', '容量 ' + (b.capacity / 10000) + ' 万吨 · ' + b.category + ' · ' + b.status, '依据：' + b.basis + (b.note ? '（' + b.note + '）' : ''), '货量 ' + fmt(tons) + ' 吨：' + (capable ? '能装下，计入基数' : '装不下，不计入基数')];
      if (!le) L.push(mdCn(d) + '：15 天后没有逐泊位数据'); else if (nodata) L.push(mdCn(d) + '：靠船计划暂无数据'); else if (row) L.push(mdCn(d) + ' 占用：' + row.vessel, row.cargo + ' ' + fmt(row.tons) + ' 吨', '预计靠泊 ' + C.md(C.iso(row.s)) + ' · 在港至 ' + C.md(C.iso(row.e))); else L.push(mdCn(d) + '：空闲');
      return { b, state, tip: L.join('\n') };
    });
    const cnt = (s) => items.filter((x) => x.state === s).length, n = items.filter((x) => x.state !== 'off').length;
    const chips = nodata ? '<span class="tag blue">能装下 ' + n + ' 个</span><span class="tag nodata">暂无数据</span>' : !le ? '<span class="tag blue">能装下 ' + n + ' 个</span><span class="tag" style="background:#f9f0ff;color:#531dab;border-color:#d3adf7">同期 ' + det.count + ' 艘 · ' + denLab(det.count, P.n) + '</span>' :
      '<span class="tag blue">能装下 ' + n + ' 个</span><span class="tag green">空闲 ' + cnt('free') + '</span><span class="tag amber">占用 ' + cnt('occ') + '</span><span class="tag ' + (det.cmr >= .5 ? 'green' : det.cmr >= .3 ? 'amber' : 'red') + '">泊位余量 ' + pct(det.cmr) + ' · ' + cmrLab(det.cmr) + '</span>';
    const grp = (name) => '<div class="bm-t">' + name + ' · ' + items.filter((x) => x.b.terminal === name).length + ' 个</div><div class="bm-r">' + items.filter((x) => x.b.terminal === name).map((x) => '<div class="bt ' + x.state + '" data-tip="' + C.esc(x.tip) + '"><b>' + x.b.code + '</b><small>' + (x.b.capacity / 10000) + '万</small></div>').join('') + '</div>';
    const link = (name, berth) => { const r = E.rows.find((q) => q.vessel === name && q.berth === berth); return r && r.matchVoyage ? '<a href="P05-voyage-detail.html?id=' + r.matchVoyage + '" data-tip="查看这条航次">' + name + '</a>' : name; };
    let list;
    if (nodata) list = '<div class="none">这一天还没有数据（灰色斜线，不是 0 艘）。' + (le ? '靠船计划目前只到 ' + md(E.planCoverTo) + '。' : '航次计划目前只到 ' + md(E.voyHorizon) + '。') + '</div>';
    else if (!det.list.length) list = '<div class="none">这一天没有占用同吨级泊位的船。</div>';
    else if (le) list = det.list.map((s) => '<div class="sh"><div class="n">' + link(s.vessel, s.berth) + '<span class="t ' + (s.arriving || s.berthing ? 'arr' : 'in') + '">' + (s.arriving ? '今日预抵' : s.berthing ? '今日靠泊' : '在泊') + '</span></div><div class="kv"><span><em>泊位</em>' + s.berth + '</span><span><em>货种</em>' + s.cargo + '</span><span><em>货量</em>' + fmt(s.tons) + ' 吨</span><span><em>预计到港</em>' + md(s.eta) + '</span><span><em>靠泊</em>' + md(s.start) + '</span><span><em>在港至</em>' + md(s.end) + '</span></div></div>').join('');
    else list = det.list.map((s) => '<div class="sh"><div class="n"><a href="P05-voyage-detail.html?id=' + s.id + '">' + (s.vessel || '待宣船') + '</a><span class="t ' + (s.arriving ? 'arr' : 'in') + '">' + (s.arriving ? '计划到达' : '窗口内') + '</span></div><div class="kv"><span><em>航线</em>' + C.zh(s.load) + ' → ' + C.zh(s.disch) + '</span><span><em>状态</em>' + s.status + '</span><span><em>货量</em>' + fmt(s.tons) + ' 吨</span><span><em>' + (s.side === '装' ? '受载期' : '计划到港') + '</em>' + md(s.start) + ' – ' + md(s.end) + '</span></div></div>').join('');
    $('side').innerHTML = '<div class="dh"><h2>' + mdCn(d) + ' ' + wk(d) + '</h2><div class="chips">' + chips + '</div></div>' +
      '<div class="bm">' + grp('北区码头') + grp('拉博塔码头') + '</div>' +
      '<div class="bl"><span class="g"><span class="sw c1">空闲</span></span><span class="g"><span class="sw c3">占用</span></span><span class="g"><span class="sw" style="background:#eef0f3;color:#a7b0bc;border-color:#dfe3e8">灰色</span>装不下本次货量</span><span class="g"><span class="sw nd">&nbsp;</span>无数据</span><span class="g"><span class="sw" style="background:#e6f4ff;color:#0958d9;border-color:#91caff">能装下</span>15 天后</span></div>' +
      '<div class="ships"><h3>' + (le ? '当天在港和预抵的船' : '当天同期的船') + '（' + (nodata ? 0 : det.list.length) + '）<span class="i" data-tip="只列出会占用同吨级泊位的船。">i</span></h3>' + list + '</div>';
  }
  $('tons').innerHTML = TONS.map((t) => '<button data-t="' + t[0] + '" class="' + (t[0] === tons ? 'on' : '') + '">' + t[1] + '</button>').join('');
  $('tons').querySelectorAll('button').forEach((b) => b.onclick = () => { tons = +b.dataset.t; $('tons').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); drawCal(); drawSide(); });
  drawCal(); drawSide();
  window.__P06 = { pick(d, t) { if (t) { tons = t; } sel = C.dayNum(d); $('tons').querySelectorAll('button').forEach((x) => x.classList.toggle('on', +x.dataset.t === tons)); drawCal(); drawSide(); } };
})();
</script>
</body>
</html>
