<!doctype html>
<html lang="zh-CN" data-skin="paper" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在途船运工作平面 · 高密度化方案示意原型 · SSPS</title>
<script>try{document.documentElement.setAttribute('data-skin',localStorage.getItem('ssps-skin')||'paper')}catch(e){}</script>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/skin.css">
<style>
/* ==========================================================================
   P04-console-density-demo · 方案示意原型
   仅复用 app.css / skin.css 的 :root token；本文件所有几何均为示意增量。
   密度是独立维度 data-density，绝不写进 skin.css（方案 C8）。
   CMR 四档色阶 / 无数据灰色斜线 / 低可信标签一律用业务变量，不参与换肤。
   ========================================================================== */
html[data-density="cozy"]    { --cd-rowh:48px; --cd-pad:9px 10px; --cd-fs:13px; --cd-sub:11px }
html[data-density="compact"] { --cd-rowh:32px; --cd-pad:4px 8px;  --cd-fs:12px; --cd-sub:10px }
html[data-density="ultra"]   { --cd-rowh:28px; --cd-pad:2px 6px;   --cd-fs:12px; --cd-sub:10px }

html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--text);
  font:13px/1.5 var(--font);font-variant-numeric:tabular-nums}
*,*::before,*::after{box-sizing:border-box}
button,input,select{font-family:inherit}
button{cursor:pointer}
a{color:var(--primary)}

.cd-console{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;
  background:var(--bg);color:var(--text);min-width:0}

/* —— 通用控件 —— */
.cd-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;white-space:nowrap;
  border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);
  color:var(--text);font-size:12px;line-height:1}
.cd-btn:hover{border-color:var(--primary);color:var(--primary)}
.cd-btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-ink)}
.cd-btn.pri:hover{opacity:.88;color:var(--on-ink)}
.cd-btn.on{background:var(--primary-bg);border-color:var(--primary-line);color:var(--primary-fg);font-weight:600}
.cd-btn:disabled{opacity:.45;cursor:not-allowed}
.cd-seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.cd-seg .cd-btn{border:0;border-radius:0;border-right:1px solid var(--line-2);height:26px;padding:0 9px}
.cd-seg .cd-btn:last-child{border-right:0}
.cd-tag{display:inline-flex;align-items:center;gap:3px;padding:0 6px;height:18px;border-radius:4px;
  font-size:11px;line-height:1;white-space:nowrap;border:1px solid transparent}
.cd-tag.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.cd-tag.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.cd-tag.caution{background:var(--caution-bg);border-color:var(--caution-line);color:var(--caution)}
.cd-tag.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
.cd-tag.mute{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.cd-lowtrust{background:var(--caution-bg);border:1px solid var(--caution-line);color:var(--caution);
  border-radius:3px;padding:0 4px;font-size:10px;line-height:16px;white-space:nowrap}
.cd-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
.cd-dim{color:var(--muted)}
.cd-faint{color:var(--faint)}

/* —— 区 1 · 工具栏 —— */
.cd-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 12px;
  background:var(--surface);border-bottom:1px solid var(--line);min-height:46px}
.cd-title{display:flex;align-items:baseline;gap:8px;min-width:0}
.cd-title h1{margin:0;font-size:15px;color:var(--ink);white-space:nowrap;font-weight:650}
.cd-title .cd-note{font-size:10.5px;color:var(--faint);white-space:nowrap}
.cd-chain{display:flex;align-items:center;gap:0;margin-left:6px}
.cd-chain .cd-step{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted);font-size:11.5px;
  white-space:nowrap;cursor:pointer}
.cd-chain .cd-step:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.cd-chain .cd-step:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.cd-chain .cd-step + .cd-step{border-left:0}
.cd-chain .cd-step b{font-size:10px;border:1px solid currentColor;border-radius:50%;width:14px;height:14px;
  display:grid;place-items:center;line-height:1}
.cd-chain .cd-step:hover{color:var(--primary)}
.cd-chain .cd-step.done{background:var(--ok-bg);color:var(--ok)}
.cd-chain .cd-step.done b{background:var(--ok);color:var(--on-ink);border-color:var(--ok)}
.cd-spacer{flex:1;min-width:4px}
.cd-badge{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--line-2);font-size:11.5px;white-space:nowrap}
.cd-badge b{font-size:13px;color:var(--ink)}
.cd-badge.danger b{color:var(--warn)}
.cd-badge.draft{background:var(--caution-bg);border-color:var(--caution-line);color:var(--caution);cursor:pointer}
.cd-skinpop{position:relative}
.cd-skinpop .cd-menu{position:absolute;right:0;top:30px;z-index:40;min-width:150px;padding:5px;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:var(--shadow-pop)}
.cd-skinpop .cd-menu button{display:block;width:100%;text-align:left;padding:6px 9px;border:0;border-radius:4px;
  background:none;color:var(--text);font-size:12px}
.cd-skinpop .cd-menu button:hover{background:var(--surface-2)}
.cd-skinpop .cd-menu button.on{color:var(--primary);font-weight:600}

/* —— 区 2 · 高级筛选 —— */
.cd-filters{padding:6px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:5px 14px;align-items:center}
.cd-filters.collapsed{display:none}
.cd-fl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;white-space:nowrap}
.cd-fl > span{color:var(--muted)}
.cd-inp{height:24px;padding:0 7px;border:1px solid var(--line-strong);border-radius:4px;
  background:var(--surface);color:var(--text);font-size:11.5px;min-width:96px}
.cd-inp:focus{outline:none;box-shadow:var(--focus);border-color:var(--primary)}
.cd-filters .cd-hint{font-size:10.5px;color:var(--faint)}

/* —— 区 3 · 主体 —— */
.cd-main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0;min-width:0}
.cd-main.no-alerts{grid-template-columns:minmax(0,1fr)}
.cd-tablewrap{overflow:auto;min-width:0;min-height:0;position:relative;background:var(--surface)}
.cd-tablewrap::-webkit-scrollbar{width:9px;height:9px}
.cd-tablewrap::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px}
.cd-tablewrap::-webkit-scrollbar-track{background:var(--surface-2)}

table.cd-grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;
  font-size:var(--cd-fs);table-layout:auto}
table.cd-grid th,table.cd-grid td{padding:var(--cd-pad);height:var(--cd-rowh);
  border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
  white-space:nowrap;vertical-align:middle;line-height:1.2}
table.cd-grid thead tr.cd-g th{position:sticky;top:0;z-index:5;height:23px;padding:3px 8px;
  background:var(--surface-3);color:var(--muted);font-size:10.5px;font-weight:600;
  text-align:center;border-bottom:1px solid var(--line-strong);border-right:1px solid var(--line-strong)}
table.cd-grid thead tr.cd-h th{position:sticky;top:23px;z-index:4;height:27px;padding:3px 8px;
  background:var(--surface-2);color:var(--ink);font-weight:600;font-size:11px;text-align:left;
  border-bottom:1px solid var(--line-strong)}
table.cd-grid thead tr.cd-h th .cd-colhint{font-weight:400;color:var(--faint);font-size:10px;margin-left:3px}
table.cd-grid tbody tr.cd-row:hover td{background:var(--surface-2)}
table.cd-grid tbody tr.cd-row.cd-hit td{background:var(--info-bg)}
table.cd-grid tbody tr.cd-row.cd-draftrow td{background:var(--caution-bg)}
table.cd-grid tbody tr.cd-row.cd-selected td{background:var(--primary-bg)}
.cd-fz{position:sticky;z-index:2;background:var(--surface)}
table.cd-grid thead th.cd-fz{z-index:6;background:var(--surface-2)}
table.cd-grid thead tr.cd-g th.cd-fz{background:var(--surface-3)}
table.cd-grid tbody tr.cd-row:hover td.cd-fz,
table.cd-grid tbody tr.cd-row.cd-selected td.cd-fz{background:var(--surface-2)}
table.cd-grid tbody tr.cd-row.cd-hit td.cd-fz{background:var(--info-bg)}
table.cd-grid tbody tr.cd-row.cd-draftrow td.cd-fz{background:var(--caution-bg)}
.cd-fz.cd-fz-last{border-right:2px solid var(--line-strong);box-shadow:2px 0 3px rgba(0,0,0,.05)}
.cd-ctrl{text-align:center;color:var(--muted)}
.cd-exp{border:0;background:none;color:var(--muted);font-size:12px;padding:0 3px;line-height:1}
.cd-exp:hover{color:var(--primary)}
.cd-cell{display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:0}
.cd-cell .cd-s1{color:var(--ink);font-weight:500}
.cd-cell .cd-s2{color:var(--muted);font-size:var(--cd-sub);line-height:1.1}
.cd-num{font-variant-numeric:tabular-nums;text-align:right}
.cd-editable{cursor:text;border-radius:3px}
.cd-editable:hover{background:var(--primary-bg);box-shadow:inset 0 0 0 1px var(--primary-line)}
.cd-locked{color:var(--faint);cursor:not-allowed}
.cd-locked .cd-s1{color:var(--muted)}
.cd-lockico{font-size:9px;color:var(--faint);margin-left:3px}
.cd-relay-hint{box-shadow:inset 0 0 0 1px var(--caution-line);border-radius:3px;background:var(--caution-bg)}
.cd-inline-edit{width:100%;min-width:80px;height:22px;padding:0 5px;font-size:12px;
  border:1px solid var(--primary);border-radius:3px;background:var(--surface);color:var(--ink);outline:none}
.cd-nodata{display:inline-block;min-width:52px;height:15px;border-radius:3px;
  background:var(--stripe);border:1px solid var(--line);position:relative;text-align:center}
.cd-nodata::after{content:"无数据";position:absolute;inset:0;font-size:9px;line-height:14px;color:var(--muted)}
.cd-cmr{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:18px;
  border-radius:3px;font-size:11px;font-weight:600;border:1px solid transparent}
.cd-cmr.c1{background:var(--c1-bg);color:var(--c1-fg);border-color:var(--c1-bd)}
.cd-cmr.c2{background:var(--c2-bg);color:var(--c2-fg);border-color:var(--c2-bd)}
.cd-cmr.c3{background:var(--c3-bg);color:var(--c3-fg);border-color:var(--c3-bd)}
.cd-cmr.c4{background:var(--c4-bg);color:var(--c4-fg);border-color:var(--c4-bd)}
.cd-status{display:inline-flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap}
.cd-prog{display:flex;align-items:center;gap:5px}
.cd-prog .cd-bar{width:38px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.cd-prog .cd-bar i{display:block;height:100%;background:var(--ok)}
.cd-prog small{font-size:10px;color:var(--muted)}
.cd-ops{display:inline-flex;gap:4px}
.cd-ops button{border:0;background:none;color:var(--info);font-size:11px;padding:0 2px}
.cd-ops button:hover{text-decoration:underline}

/* —— 行展开详情 —— */
table.cd-grid tbody tr.cd-detail td{height:auto;padding:0;background:var(--surface-2);
  border-bottom:2px solid var(--line-strong);white-space:normal}
.cd-det{padding:10px 14px 14px 310px;display:grid;grid-template-columns:repeat(3,minmax(190px,1fr));gap:8px}
.cd-det .cd-grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px}
.cd-det .cd-grp h4{margin:0 0 6px;font-size:11.5px;color:var(--ink);display:flex;justify-content:space-between}
.cd-det .cd-grp h4 span{font-size:10px;color:var(--faint);font-weight:400}
.cd-det .cd-kv{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:2px 0;border-bottom:1px dotted var(--line-2)}
.cd-det .cd-kv:last-child{border-bottom:0}
.cd-det .cd-kv span{color:var(--muted)}
.cd-det .cd-kv b{color:var(--text);font-weight:500;text-align:right}
.cd-det .cd-grp.full{grid-column:1/-1}

/* —— 区 4 · 预警中心 —— */
.cd-alerts{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.cd-main.no-alerts .cd-alerts{display:none}
.cd-al-head{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line);flex:none}
.cd-al-head h3{margin:0;font-size:13px;color:var(--ink)}
.cd-al-head .cd-spacer{flex:1}
.cd-al-counts{display:flex;gap:5px;padding:7px 11px;border-bottom:1px solid var(--line-2);flex:none}
.cd-al-counts div{flex:1;text-align:center;padding:4px 0;border-radius:4px;font-size:10.5px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2)}
.cd-al-counts div b{display:block;font-size:16px;line-height:1.2;color:var(--ink)}
.cd-al-counts div.l1 b{color:var(--warn)}
.cd-al-counts div.l2 b{color:var(--caution)}
.cd-al-counts div.l3 b{color:var(--info)}
.cd-al-list{overflow:auto;flex:1;min-height:0;padding:4px 0}
.cd-al-group{padding:7px 11px 3px;font-size:10.5px;font-weight:600;color:var(--muted);
  display:flex;align-items:center;gap:6px;position:sticky;top:0;background:var(--surface);z-index:1}
.cd-al-item{display:block;width:100%;text-align:left;padding:7px 11px;border:0;border-bottom:1px solid var(--line-2);
  background:none;color:var(--text);font-size:11.5px}
.cd-al-item:hover{background:var(--surface-2)}
.cd-al-item.focus{background:var(--info-bg)}
.cd-al-item .cd-al-r1{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.cd-al-item .cd-al-r1 b{font-size:11.5px;color:var(--ink)}
.cd-al-item .cd-al-r2{color:var(--muted);font-size:10.5px;line-height:1.4}
.cd-al-foot{padding:7px 11px;border-top:1px solid var(--line);font-size:10.5px;color:var(--faint);
  display:flex;justify-content:space-between;flex:none}

/* —— 区 5 · 汇总带 —— */
.cd-sum{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:0;
  background:var(--surface);border-top:1px solid var(--line-strong);min-height:44px;flex:none}
.cd-sum .cd-s{padding:5px 10px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0}
.cd-sum .cd-s:last-child{border-right:0}
.cd-sum .cd-s .cd-l{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-sum .cd-s .cd-v{font-size:16px;font-weight:650;color:var(--ink);line-height:1.15;white-space:nowrap}
.cd-sum .cd-s .cd-v small{font-size:10px;font-weight:400;color:var(--muted);margin-left:4px}
.cd-sum .cd-s.bad .cd-v{color:var(--warn)}
.cd-sum .cd-s.good .cd-v{color:var(--ok)}

/* —— 视图配置抽屉 —— */
.cd-mask{position:fixed;inset:0;background:rgba(20,20,18,.32);z-index:50;display:none}
.cd-mask.open{display:block}
.cd-drawer{position:fixed;right:0;top:0;bottom:0;width:430px;max-width:96vw;z-index:51;
  background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:var(--shadow-pop);
  display:none;flex-direction:column}
.cd-drawer.open{display:flex}
.cd-dr-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}
.cd-dr-head h3{margin:0;font-size:14px;color:var(--ink)}
.cd-dr-head .cd-spacer{flex:1}
.cd-dr-body{padding:11px 14px;overflow:auto;flex:1;min-height:0}
.cd-dr-sec{margin-bottom:14px}
.cd-dr-sec > h4{margin:0 0 7px;font-size:11.5px;color:var(--muted);font-weight:600;
  border-bottom:1px solid var(--line-2);padding-bottom:5px}
.cd-dr-roles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cd-dr-roles button{text-align:left;padding:7px 9px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);font-size:11.5px;line-height:1.35}
.cd-dr-roles button b{display:block;color:var(--ink);font-size:12px}
.cd-dr-roles button small{color:var(--muted);font-size:10px}
.cd-dr-roles button.on{border-color:var(--primary);background:var(--primary-bg)}
.cd-dr-note{font-size:10.5px;color:var(--muted);line-height:1.6;background:var(--surface-2);
  border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:7px 9px}
.cd-dr-note b{color:var(--ink)}
.cd-frow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dotted var(--line-2);font-size:11.5px}
.cd-frow label{display:flex;align-items:center;gap:6px;flex:1;min-width:0;cursor:pointer}
.cd-frow label > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-frow .cd-owner{font-size:10px;color:var(--faint);white-space:nowrap}
.cd-frow .cd-mark{font-size:10px;padding:0 4px;border-radius:3px;line-height:16px;white-space:nowrap}
.cd-frow .cd-mark.r{background:var(--info-bg);color:var(--info)}
.cd-frow .cd-mark.w{background:var(--ok-bg);color:var(--ok)}
.cd-frow .cd-mark.n{background:var(--surface-2);color:var(--faint)}
.cd-frow .cd-mv{border:1px solid var(--line-2);background:var(--surface);color:var(--muted);
  width:19px;height:19px;line-height:1;border-radius:3px;font-size:10px;padding:0}
.cd-frow .cd-mv:disabled{opacity:.3;cursor:not-allowed}
.cd-frow.fixed label{cursor:default}
.cd-dr-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:7px;align-items:center;flex:none}
.cd-dr-foot .cd-spacer{flex:1}

/* —— toast / 浮窗 —— */
.cd-toast{position:fixed;left:50%;bottom:62px;transform:translateX(-50%) translateY(10px);z-index:70;
  padding:9px 16px;border-radius:var(--radius);background:var(--ink);color:var(--bg);
  font-size:12px;box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;transition:.18s;max-width:78vw;text-align:center}
.cd-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cd-tip{position:fixed;z-index:65;padding:6px 9px;border-radius:4px;background:var(--surface);
  border:1px solid var(--line-strong);box-shadow:var(--shadow-pop);font-size:11px;color:var(--muted);
  max-width:230px;display:none;line-height:1.5}

/* —— 移动端：保留卡片列表，不做横向压缩（方案 7.8） —— */
.cd-mobile{display:none;padding:12px;overflow:auto;height:100%}
.cd-mcard{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:10px 12px;margin-bottom:8px}
.cd-mcard h4{margin:0 0 5px;font-size:13px;color:var(--ink);display:flex;justify-content:space-between}
.cd-mcard p{margin:2px 0;font-size:11.5px;color:var(--muted)}
@media(max-width:900px){
  .cd-main{grid-template-columns:minmax(0,1fr)}
  .cd-alerts{display:none}
  .cd-tablewrap{display:none}
  .cd-mobile{display:block}
  .cd-sum{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cd-chain{display:none}
  .cd-title .cd-note{display:none}
}
</style>
</head>
<body>

<div class="cd-console">

  <!-- 区 1 · 工具栏 -->
  <header class="cd-bar">
    <div class="cd-title">
      <h1>在途船运工作平面</h1>
      <span class="cd-note">方案示意原型 · 静态 Mock 数据 · 非业务代码 · 不连任何接口/数据库</span>
    </div>

    <div class="cd-chain" id="chain">

      return '<div class="'+cls+'" '+attrs+'><span class="cd-tag '+(bad?'warn':'ok')+'">'+esc(v)+'</span>'+lock+'</div>';

    case 'alert':
      if(!v) return '<div class="'+cls+'" '+attrs+'><span class="cd-faint">—</span></div>';

      return '<div class="'+cls+'" '+attrs+'>'+(v==='低可信'
        ? '<span class="cd-lowtrust">低可信</span>'
        : '<span class="cd-tag '+ac+'">'+esc(v)+'</span>')+'</div>';
    case 'num':
      return '<div class="'+cls+' cd-num" '+attrs+'><span class="cd-s1">'+esc(v)+'</span></div>';
    case 'money':
      return '<div class="'+cls+' cd-num" '+attrs+'><span class="cd-s1">'+esc(v)+'</span></div>';
    case 'progress': {
      var m=String(v).split('/'), pct=Math.round(parseInt(m[0],10)/parseInt(m[1],10)*100);
      return '<div class="'+cls+'" '+attrs+'><span class="cd-prog"><span class="cd-bar"><i style="width:'+pct+'%"></i></span>'+
        '<small>'+esc(v)+'</small></span></div>';
    }
    case 'ops':
      return '<div class="cd-ops"><button data-act="edit" data-id="'+row.id+'">修改</button>'+

    default:
      return '<div class="'+cls+'" '+attrs+'><span class="cd-s1">'+esc(v)+'</span>'+lock+'</div>';
  }
}

  var i=0;
  while(i<seq.length){ var g=seq[i], n=1; while(i+n<seq.length && seq[i+n]===g) n++;

function tip(msg,x,y){

/* —— 事件：行内编辑（U04 语义，逐字段鉴权） —— */
document.getElementById('tablewrap').addEventListener('click',function(e){
  var chkAll=e.target.id==='checkAll';
  if(chkAll) return;
  var expand=e.target.closest('[data-act="expand"]');
  if(expand){ var id=expand.dataset.id; state.expanded[id]=!state.expanded[id]; renderGrid(); return; }
  var op=e.target.closest('[data-act="edit"]');
  if(op){ state.expanded[op.dataset.id]=true; renderGrid(); toast('行内展开编辑：公式/引擎/无权限字段灰显并带锁（U04 逐字段鉴权）'); return; }

  var cell=e.target.closest('[data-edit]');
  if(!cell) return;
  var k=cell.dataset.edit, id=cell.dataset.id, f=FMAP[k];
  var row=ROWS.filter(function(r){return r.id===id;})[0];
  if(!row) return;
  var fake=Object.assign({},f,{_row:row});
  if(!canWrite(fake)){
    var why=row.history?'历史只读航次整行不可编辑':(f.ro?'公式 / 规则引擎输出，只读':(f.money&&!roleDef().seeMoney?'金额字段对当前角色不返回':'当前角色「'+roleDef().name+'」无此字段写权限'));
    tip('不可编辑：'+why,e.clientX,e.clientY); return;
  }
  if(cell.querySelector('input')) return;
  var old=row[k], parts=String(old==null?'':old).split(' ');
  var val=f.t==='date2'?(parts[0]+' '+(parts[1]||'')):old;
  cell.innerHTML='<input class="cd-inline-edit" value="'+esc(val)+'">';
  var inp=cell.querySelector('input'); inp.focus(); inp.select();
  var done=function(save){
    if(save && inp.value.trim()!==''){
      row[k]=inp.value.trim();
      row.updated='刚刚 · '+roleDef().name;
      toast('已保存 '+f.n+'（局部刷新该行，不换页；正式实现走 U04 现有写链路 + 变更日志 + 幂等键）');
    }
    renderGrid();
  };
  inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter') done(true); if(ev.key==='Escape') done(false); });
  inp.addEventListener('blur',function(){ done(true); });
});

  var s=b.dataset.chain;
  state.chainDone[s]=true;

  if(s==='A'){
    var id='DRAFT'+(++state.drafts);
    ROWS.unshift({id:id,voyageNo:'预测草稿 · '+id,bizType:'大宗采购',vessel:'待指定',mmsi:null,
      loadPort:'曹妃甸',disPort:'湛江',route:'曹妃甸→湛江',berth:null,
      etaLoad:'11-20 08:00',etdLoad:'11-22 18:00',etaDis:'11-29 06:00',
      ataLoad:null,atdLoad:null,ataDis:null,status:'待宣船',etaCur:null,etaDev:null,cmr:'c2',
      alert:'方案 A 溯源 · S1',cargo:'铁矿粉',qty:'180,000',contract:null,owner:'待指派',
      relay:'1/10',updated:'刚刚 · 采纳预测方案',demurrage:'—',portFee:'—',_draft:true,
      _plan:{ab:'方案 A',window:'11-20 ~ 11-22',cmrMin:'CMR_min 22%',path:'≤15 天',lowtrust:true}});
    state.hitId=id; state.selected=id;
    renderAll();
    document.getElementById('tablewrap').scrollTop=0;
    toast('阶段 A：调用 A23 adopt 后在工作平面插入「预测草稿行」——待宣船 / 方案 A 溯源 / 推荐窗口 11-20~11-22 / CMR_min 22% / ≤15 天 / 低可信。规则引擎数值原样展示，前端不重算');

  } else if(s==='B'){
    var d=ROWS.filter(function(r){return r._draft;})[0];
    if(!d){ toast('请先执行阶段 A 采纳一条预测方案'); state.chainDone[s]=false; renderAll(); return; }
    d._draft=false; d.status='待宣船'; d.alert='待补录节点'; d.updated='刚刚 · 业务员 · 大宗采购部';
    state.expanded[d.id]=true; state.hitId=d.id; state.selected=d.id;
    renderAll();
    toast('阶段 B：草稿行「转为发船计划」，补齐合同号 / 船名 / 货物明细 / 负责业务员；工具栏「＋ 新建」也可在表内插行快速新建。复用 createVoyage，行内展开继续填，不跳 P05');

  } else if(s==='C'){
    applyRole('logistics'); state.relayHint=true; state.chainDone[s]=true; renderAll();
    toast('阶段 C：接力棒 → 仓储船务。高亮格为当前岗位可填字段；采购业务员填合同/货物/计划，仓储船务填实际节点与作业，大宗综合填费用与复核。能否编辑由 L2 策略决定，公式字段永远只读');

  } else if(s==='D'){
    state.alertsOpen=true; state.chainDone[s]=true; renderAll();
    var first=document.querySelector('[data-alert="0"]'); if(first) first.click();
    toast('阶段 D：8 类预警统一聚合，分严重/中风险/提醒三级；30 秒轮询，界面写「数据更新于 HH:MM」而非「实时」。一期的 ETA 是人工修订，不接 AIS / 气象');
  }
});

/* —— 汇总带 / 草稿徽标 —— */
document.getElementById('draftBadge').onclick=function(){
  var d=ROWS.filter(function(r){return r._draft;})[0]; if(!d) return;
  state.hitId=d.id; state.expanded[d.id]=true; renderAll();
  var tr=document.querySelector('tr[data-row="'+d.id+'"]'); if(tr) tr.scrollIntoView({block:'center'});
};

/* —— 初始化 —— */
(function init(){
  state.visible=defaultVisible(); state.order=state.visible.slice();
  document.documentElement.setAttribute('data-density',state.density);
  renderAll();
  setTimeout(function(){ toast('这是方案示意原型：可切换 4 个岗位模板看列与权限如何变化、点单元格试原地编辑、点 A→B→C→D 看全链路'); },400);
  setInterval(function(){
    var n=new Date(), t=pad(n.getHours())+':'+pad(n.getMinutes());
    var a=document.getElementById('clock'), b=document.getElementById('clock2');
    if(a) a.textContent=t; if(b) b.textContent=t;
  },30000);
})();
</script>
