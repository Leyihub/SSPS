<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSPS 产品原型导航</title>
<style>
:root{--primary:#1677ff;--bg:#f1f4f8;--line:#e4e8ee;--text:#1f2d3d;--muted:#6b7a8c}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.7 "PingFang SC","Microsoft YaHei","Noto Sans SC","WenQuanYi Zen Hei",system-ui,sans-serif}
.top{background:linear-gradient(90deg,#26394f,#203348);color:#fff;height:52px;display:flex;align-items:center;padding:0 16px;gap:10px;font-weight:600}
.logo{width:28px;height:28px;border-radius:8px;background:var(--primary);display:grid;place-items:center}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:20px;margin:4px 0 6px}
p{margin:0 0 10px;color:#3b4a5c}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(16,24,40,.08);padding:14px 16px;margin-top:12px}
a.card{display:block;color:inherit;text-decoration:none;border:1.5px solid var(--primary)}
a.card:active{background:#f5faff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{font-size:15px}
.tag{font-size:12px;border-radius:4px;padding:0 8px;line-height:20px;border:1px solid #91caff;background:#e6f4ff;color:#0958d9;white-space:nowrap}
.tag.g{background:#f5f6f8;color:#5b6878;border-color:#d9dee5}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.list{margin-top:12px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.it{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid #f0f2f5}
.it:last-child{border:0}
.it .c{font:700 12px ui-monospace,Menlo,Consolas,monospace;color:var(--primary);width:30px}
.it.todo .c,.it.todo .n{color:#98a4b3}
.it .n{flex:1}.it .n small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.it a{color:inherit;text-decoration:none;display:contents}
.note{margin-top:14px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><span class="logo">S</span>SSPS 产品原型</header>
<main class="wrap">
  <h1>智慧发船预测系统 · 产品原型</h1>
  <p>P01–P10 的可点击原型，供评审用，不连飞书，示例数据均为虚构，<b>没有任何功能已上线</b>。每页做完先看截图，反馈后再做下一页。</p>

  <a class="card" href="P02-prediction.html">
    <div class="row"><b>P02 智能发船预测（第一版 · 当前）</b><span class="tag">待评审</span></div>
    <div class="sub">表单输入，Plan A / Plan B 卡片 + 30 天容量日历 + 7 个示例场景，桌面版。</div>
  </a>
  <a class="card" href="P02-prediction-v2.html" style="border-color:#d9dee5">
    <div class="row"><b>P02 智能发船预测 · v2 简化草图</b><span class="tag g">备选草图</span></div>
    <div class="sub">一句话提问、手机可用、点击日历看预抵船只；去掉了可信度 / 评分 / 溯源。</div>
  </a>

  <div class="list" id="list"></div>
  <div class="note">页面范围见 docs/implementation-plan.md 第 9 节；截图在 prototype/screenshots/。</div>
</main>
<script src="assets/shell.js"></script>
<script>
(function(){
  const B = SHELL.BUILT, order = ['P01','P02','P03','P04','P05','P06','P07','P08','P09','P10'];
  const by = Object.fromEntries(SHELL.PAGES.map(p => [p.id, p]));
  document.getElementById('list').innerHTML = order.map(id => {
    const p = by[id], built = !!B[id];
    const inner = '<span class="c">' + id + '</span><span class="n">' + p.name + '<small>' + p.user + '</small></span><span class="tag' + (built ? '' : ' g') + '">' + (built ? B[id] : '待做') + '</span>';
    return built ? '<div class="it"><a href="' + p.file + '">' + inner + '</a></div>' : '<div class="it todo">' + inner + '</div>';
  }).join('');
})();
</script>
</body>
</html>
